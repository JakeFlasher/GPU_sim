name: "RTX_5060_Laptop"
# RTX 5060 Laptop (GB206, sm_120) — values derived from a one-time
# operator-driven NCU + cuBLASLt profile captured under solar-rtx5060/.
#
# Static device specs (from torch.cuda.get_device_properties + nvidia-smi):
#   solar-rtx5060/props.txt:
#     multiProcessorCount=26, l2CacheSize=33554432 B (32 MiB),
#     totalGlobalMem=8082096128 B (~8 GB), memoryBusWidth=128 bit,
#     clockRateKHz=1687000 (boost SM clock 1.687 GHz),
#     memoryClockRateKHz=12001000 (effective 12.001 GHz GDDR7).
#   solar-rtx5060/nvidia-smi.txt: "NVIDIA GeForce RTX 5060 Laptop GPU".
#
# DRAM bandwidth (solar-rtx5060/ncu_dram.csv, dram_copy_kernel):
#   dram__bytes.sum.peak_sustained = 32 byte/mem_cycle
#   sustained throughput observed:  333.5 GB/s (~87% of architectural peak)
#   architectural peak:             32 * 12.001 GHz = 384 GB/s
#   in SM-clock units:              384 / 1.687 ≈ 228 byte/sm_cycle
#
# L2 bandwidth (solar-rtx5060/ncu_l2.csv, l2_kernel):
#   lts__t_bytes.sum.peak_sustained = 1024 byte/sm_cycle (architectural peak)
#   sustained throughput observed:    953.3 GB/s (~55% of peak)
#
# Tensor-core BF16 throughput (solar-rtx5060/ncu_hmma.csv, hmma_kernel):
#   wmma::mma_sync m16n16k16 BF16 -> 2 HMMA m16n8k16 inst per wmma call
#   sm__inst_executed_pipe_tensor.sum.peak_sustained = 6.50 inst/cycle
#   HMMA m16n8k16 BF16 -> 16*8*16 = 2048 MAC/inst
#   architectural peak MAC/cycle = 6.50 * 2048 = 13312
#   in TFLOPS: 13312 * 1.687 * 2 ≈ 44.9 TFLOPS dense BF16
#
# Tensor-core FP16 throughput (solar-rtx5060/ncu_hmma_fp16.csv, hmma_fp16):
#   wmma::mma_sync m16n16k16 FP16 (same shape as BF16)
#   sm__inst_executed_pipe_tensor.sum.peak_sustained = 6.50 inst/cycle
#   Same architectural peak as BF16: 13312 MAC/cycle
#   Confirms Blackwell tensor-core parity between FP16 and BF16.
#
# Tensor-core FP8 throughput (solar-rtx5060/ncu_cublaslt_fp8.csv,
#                             nvjet_sm120_qqtsq_mma_256x128x128 kernel):
#   sm__inst_executed_pipe_tensor.sum.peak_sustained = 6.50 inst/cycle
#   sm__inst_executed_pipe_tensor.sum.per_cycle_active = 6.24 inst/cycle (96%)
#   FP8 HMMA m16n8k32 -> 16*8*32 = 4096 MAC/inst
#   architectural peak MAC/cycle = 6.50 * 4096 = 26624
#   cross-check (solar-rtx5060/cublaslt_fp8_8192.csv):
#     cuBLASLt FP8 GEMM 8192^3 = 101.278 TFLOPS achieved
#     101.278 / 1.687 / 2 = 30022 MACs/cycle ≈ 26624 (≈ peak; NCU/profiler quanta)
#
# cuBLASLt BF16 cross-check (solar-rtx5060/cublaslt_bf16_8192.csv):
#   8192^3 BF16 GEMM = 26.299 TFLOPS achieved
#   The selected kernel is cutlass_80_tensorop_bf16_s16816gemm (sm_80 fallback),
#   so the achieved 26.3 TFLOPS is *not* indicative of the sm_120 BF16 ceiling;
#   the BF16 HMMA probe peak above (44.9 TFLOPS) is the right architectural
#   reference. Future rounds can swap in a sm_120-native BF16 kernel (e.g.,
#   CUTLASS sm_120 tensorop) to close the gap.
#
# Other-precision MAC/cycle estimates use the Blackwell tensor-core ratio
# table for the unmeasured precisions (INT8 = FP8; TF32 = 0.5x BF16;
# NVFP4 = 4x BF16 via m16n8k64 if supported). FP32 SM-side throughput
# uses 128 FP32 cores/SM × 26 SMs. Estimates are flagged below.

SRAM_capacity: 33554432            # L2 = 32 MiB (props.txt)
SRAM_byte_per_cycle: 1024          # L2 peak (NCU lts__t_bytes.sum.peak_sustained; ncu_l2.csv)
DRAM_capacity: 8082096128          # 8 GB GDDR7 (props.txt)
DRAM_byte_per_cycle: 228           # DRAM peak in SM-clock units (ncu_dram.csv: 32 byte/mem_cycle × 12.001/1.687)
freq_GHz: 1.687                    # boost SM clock (props.txt: clockRateKHz=1687000)

MAC_per_cycle_bf16_tc: 13312       # MEASURED via solar-rtx5060/ncu_hmma.csv: 6.50 inst/cycle × 2048 MAC/inst
MAC_per_cycle_fp16_tc: 13312       # MEASURED via solar-rtx5060/ncu_hmma_fp16.csv: 6.50 inst/cycle × 2048 MAC/inst (same as BF16)
MAC_per_cycle_fp8_tc: 26624        # CROSS-CHECKED via solar-rtx5060/ncu_cublaslt_fp8.csv + solar-rtx5060/rtx5060/cublaslt/cublaslt_fp8_8192.csv: peak_sustained 6.50 inst/cycle × 4096 MAC/inst (m16n8k32 FP8); cuBLASLt achieves 30022 MAC/cycle (≥ peak)
# task14 CUTLASS-profiler cross-check status (operator-run 2026-05-12):
#   solar-rtx5060/rtx5060/cutlass/cutlass_profiler_{bf16,fp8}_8192.{csv,log}
#   + cutlass_profiler_*.block_scaled_gemm.csv
#   + dryrun_kernels_{bf16,fp8}.txt
#   + manifest.json (cutlass_commit=4370102f, sm_120 build, driver 595.71.05)
# Finding: CUTLASS v4.4.1's sm_120 profiler library ships ONLY block-scaled
# (mxfp8/nvfp4) GEMM kernels for the requested precisions — no dense BF16/BF16
# or dense FP8/FP8 native sm_120 kernels exist in the v4.4.1 manifest.
# Closest available cross-checks:
#   - cuBLASLt dense BF16 GEMM 8192³: 26.299 TFLOPS (sm_80 fallback kernel
#     selected by the heuristic — not a sm_120 ceiling)
#   - cuBLASLt dense FP8 GEMM 8192³: 101.278 TFLOPS (sm_120 native nvjet kernel)
#   - CUTLASS blockscaled best (mxfp8_in/bf16_out/fp32_acc, representative):
#     57.21 TFLOPS / 49.38 median — NOT directly comparable to dense BF16
#     because input and output dtypes differ, but a useful sm_120 native
#     achievement reference.
# Plan Evolution Log row for task14 narrowing records this exact failure mode.
MAC_per_cycle_int8_tc: 26624       # estimate: INT8 throughput equal to FP8 on sm_120 (shared tensor pipe)
MAC_per_cycle_tf32_tc: 6656        # estimate: TF32 = 0.5x BF16 (Blackwell ratio table)
MAC_per_cycle_nvfp4_tc: 53248      # estimate: NVFP4 = 4x BF16 via m16n8k64 (consumer Blackwell whitepaper); UNVERIFIED on this device
MAC_per_cycle_fp32_sm: 3328        # architectural: 128 FP32 cores/SM × 26 SMs (not NCU-measured)
