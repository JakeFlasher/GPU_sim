# Corpus-expansion batch manifest schema reference (v1.0).
#
# This file is the operator-facing contract for `batch-NNN.toml`
# files authored under `.humanize/corpus-expansion/`. The
# authoritative validator lives at `corpus_expansion_batch.py`
# in this same directory (`load_corpus_expansion_batch_manifest`).
# Every gate this file documents is enforced there with a typed
# reason drawn from the closed
# `CORPUS_EXPANSION_BATCH_TYPED_REASONS` frozenset; do not
# loosen any check without updating both surfaces in lockstep.
#
# Note on the path: this schema reference lives next to the
# validator module rather than alongside individual batches
# under `.humanize/corpus-expansion/` because the project's
# `loop-bash-validator.sh` pre-tool hook blocks every `git add`
# that touches `.humanize/` (including `git add -f`), so the
# directory cannot host versioned operator contracts. Individual
# `batch-NNN.toml` files still live under
# `.humanize/corpus-expansion/` as untracked operator artifacts;
# this file documents the contract they must satisfy. The file
# is NOT loaded by the validator at runtime — the validator's
# typed-reason vocabulary IS the runtime contract. The schema
# reference exists so the operator (and any automated reviewer)
# can see, in one place, every required field, closed
# vocabulary, ceiling, and invariant before authoring a new
# batch.
#
# ===== Required top-level fields ===========================
#
# schema_version (string)
#     Must be one of {"1.0", "1.1"}. "1.0" is the legacy schema
#     and is accepted unchanged for the batch manifests that
#     pre-date the cadence-uplift discipline; the cadence-uplift
#     fields below are optional on "1.0" and ignored when absent.
#     "1.1" is the current schema and REQUIRES the cadence-uplift
#     fields below. Anything else is rejected with
#     `corpus_expansion_batch_invalid_schema_version`.
#
# batch_id (string, non-empty)
#     Identifier for the batch. Convention: `"batch-NNN"` where
#     NNN matches the filename's three-digit batch number. Empty
#     strings are rejected with
#     `corpus_expansion_batch_missing_field`.
#
# max_slugs (integer, 0 < x <= 12)
#     Ceiling for the number of `[[slugs]]` entries the batch
#     may carry. Hard cap is 12 (see
#     `CORPUS_EXPANSION_BATCH_MAX_SLUGS`). Anything outside the
#     `(0, 12]` interval is rejected with
#     `corpus_expansion_batch_max_slugs_exceeded`.
#
# max_estimated_runtime_minutes (integer, 0 < x <= 120)
#     Ceiling for the SUM of per-slug
#     `estimated_runtime_minutes`. Hard cap is 120 (see
#     `CORPUS_EXPANSION_BATCH_MAX_RUNTIME_MINUTES`).
#     Out-of-range values are rejected with
#     `corpus_expansion_batch_max_runtime_exceeded`; runtime sum
#     over-ceiling is rejected with
#     `corpus_expansion_batch_runtime_sum_exceeded`.
#
# rationale (string)
#     Free-text justification for the batch composition (family
#     stratification choice, slug picks, etc.).
#
# [family_stratification]
#     Mapping of family-name -> non-negative integer count.
#     Keys must be drawn from the closed family set
#     {`L1`, `L2`, `Quant`, `FIB`}; any other key is rejected
#     with `corpus_expansion_batch_invalid_family`. Counts must
#     sum to `len([[slugs]])`; otherwise
#     `corpus_expansion_batch_family_stratification_mismatch`
#     fires.
#
# ===== `[[slugs]]` per-batch slug entries ====================
#
# Each [[slugs]] entry must declare:
#
#   slug (string)
#       Canonical SOL-ExecBench problem slug
#       (e.g. `problem_004_gemm_n128_k2048`).
#       Duplicates within the array are rejected with
#       `corpus_expansion_batch_duplicate_slug`. When the
#       optional `canonical_slug_set` is supplied to the loader,
#       slugs not in it are rejected with
#       `corpus_expansion_batch_non_canonical_slug`. When the
#       optional `host_arch_unsupported_slug_set` is supplied,
#       slugs in it are rejected with
#       `corpus_expansion_batch_host_arch_unsupported_slug`.
#
#   target_cohort (string, closed set)
#       Must be one of `predictor_friendly` or
#       `predictor_hostile`. Anything else is rejected with
#       `corpus_expansion_batch_invalid_target_cohort`.
#
#   target_language (string, closed set)
#       Must be one of `cuda_cpp` or `cutlass`. Anything else is
#       rejected with
#       `corpus_expansion_batch_invalid_target_language`.
#
#   estimated_runtime_minutes (integer, strictly positive)
#       Documents this slug's harvest cost (NCU run + build +
#       correctness). Sum across all `[[slugs]]` must not exceed
#       `max_estimated_runtime_minutes`. Non-int / non-positive
#       values are rejected with
#       `corpus_expansion_batch_invalid_runtime_estimate`.
#
# ===== `[[predictor_design_coverage_promotions]]` ============
#
# Every batch must predeclare its cohort assignments in
# `predictor_design_coverage.py` BEFORE the batch lands. The
# manifest records that predeclaration in a parallel array.
#
# Each [[predictor_design_coverage_promotions]] entry must
# declare:
#
#   slug (string)
#       Same slug vocabulary as `[[slugs]].slug`. The set of
#       promotion slugs MUST exactly equal the set of `[[slugs]].slug`
#       — neither missing nor extra entries are accepted. A set
#       difference fires
#       `corpus_expansion_batch_promotion_slug_mismatch`.
#
#   target_cohort (string, closed set)
#       Same closed set as `[[slugs]].target_cohort`. For every
#       slug present in BOTH arrays the cohort values MUST
#       match; a disagreement fires
#       `corpus_expansion_batch_promotion_cohort_mismatch`.
#
# Duplicates within the promotion array fire
# `corpus_expansion_batch_duplicate_promotion`. A wholly absent
# array fires `corpus_expansion_batch_missing_promotion_array`.
#
# ===== Cadence-uplift fields (REQUIRED on schema_version 1.1) =
#
# dispatch_family_signature (string, non-empty)
#     Identifies the dispatch surface the batch's slugs route
#     through (e.g. `cublasSgemm_basic_fp32`,
#     `cublasGemmEx_2D_bf16_OP_N_OP_N`). The valid set is the
#     `family_signature` column of
#     `.humanize/corpus-expansion/verified_dispatch_families.toml`
#     when the loader is supplied with
#     `verified_dispatch_families={family_signature:
#     verification_status}`. A missing signature is rejected
#     with `corpus_expansion_batch_invalid_dispatch_family`.
#
# cadence_class (string, closed set)
#     Must be one of `friendly_multi_slug` or
#     `single_slug_isolated`. Anything else is rejected with
#     `corpus_expansion_batch_invalid_cadence_class`.
#
#     friendly_multi_slug:
#       * Requires 3..6 [[slugs]] entries (rejected with
#         `corpus_expansion_batch_friendly_multi_slug_slug_count_out_of_range`
#         outside the range).
#       * Every slug must carry
#         `target_cohort = "predictor_friendly"` (rejected with
#         `corpus_expansion_batch_cadence_uplift_hostile_in_multi_slug_batch`).
#       * `dispatch_family_signature` must be present in the
#         verified-dispatch-families manifest with
#         `verification_status = "verified"`. A pending family
#         is rejected with
#         `corpus_expansion_batch_cadence_uplift_pending_verification_dispatch_family`
#         and any other status with
#         `corpus_expansion_batch_cadence_uplift_unverified_dispatch_family`.
#
#     single_slug_isolated:
#       * Requires exactly 1 [[slugs]] entry (rejected with
#         `corpus_expansion_batch_cadence_class_slug_count_mismatch`).
#       * Requires the `isolation_reason` field below.
#
# isolation_reason (string, closed set) — REQUIRED when
#                  cadence_class = "single_slug_isolated";
#                  FORBIDDEN otherwise
#     Closed vocabulary: `novel_dispatch_family`,
#     `hostile_cohort`, `unverified_dispatch_family`,
#     `operator_override_debug_isolation`,
#     `warm_cold_pinning_candidate`. Missing on single-slug
#     fires
#     `corpus_expansion_batch_single_slug_isolated_missing_isolation_reason`;
#     outside the closed set (or present on a multi-slug batch)
#     fires
#     `corpus_expansion_batch_isolation_reason_outside_closed_vocabulary`.
#
# ===== Optional loader inputs =================================
#
# `load_corpus_expansion_batch_manifest()` accepts four
# optional keyword arguments that gate the manifest against
# external sources of truth:
#
#   canonical_slug_set: Iterable[str] | None = None
#       Slugs absent from this set raise
#       `corpus_expansion_batch_non_canonical_slug`.
#
#   host_arch_unsupported_slug_set: Iterable[str] | None = None
#       Slugs present in this set raise
#       `corpus_expansion_batch_host_arch_unsupported_slug`.
#
#   landed_slug_set: Iterable[str] | None = None
#       After the batch has been executed, the operator can
#       call the loader with `landed_slug_set` populated from
#       the actual on-disk landed baselines. The set MUST
#       exactly equal the manifest slug-set; a missing-or-extra
#       difference raises
#       `corpus_expansion_batch_landed_slug_mismatch`.
#
#   verified_dispatch_families: Mapping[str, str] | None = None
#       Maps `family_signature -> verification_status` (the
#       `family_status_map` of a parsed
#       `VerifiedDispatchFamiliesManifest`). When supplied, the
#       cadence-uplift checks gate the manifest's
#       `dispatch_family_signature` against the mapping.
#
# ===== Closed typed-reason vocabulary (30 members) ============
#
# Every rejection raises `CorpusExpansionBatchError(reason, msg)`
# where `reason` is drawn from this closed set:
#
#   corpus_expansion_batch_io_error
#   corpus_expansion_batch_invalid_toml
#   corpus_expansion_batch_invalid_schema_version
#   corpus_expansion_batch_missing_field
#   corpus_expansion_batch_max_slugs_exceeded
#   corpus_expansion_batch_max_runtime_exceeded
#   corpus_expansion_batch_runtime_sum_exceeded
#   corpus_expansion_batch_slug_count_mismatch
#   corpus_expansion_batch_duplicate_slug
#   corpus_expansion_batch_invalid_target_cohort
#   corpus_expansion_batch_invalid_target_language
#   corpus_expansion_batch_invalid_runtime_estimate
#   corpus_expansion_batch_family_stratification_mismatch
#   corpus_expansion_batch_invalid_family
#   corpus_expansion_batch_non_canonical_slug
#   corpus_expansion_batch_host_arch_unsupported_slug
#   corpus_expansion_batch_missing_promotion_array
#   corpus_expansion_batch_duplicate_promotion
#   corpus_expansion_batch_promotion_slug_mismatch
#   corpus_expansion_batch_promotion_cohort_mismatch
#   corpus_expansion_batch_landed_slug_mismatch
#   corpus_expansion_batch_invalid_cadence_class
#   corpus_expansion_batch_invalid_dispatch_family
#   corpus_expansion_batch_cadence_uplift_unverified_dispatch_family
#   corpus_expansion_batch_cadence_uplift_pending_verification_dispatch_family
#   corpus_expansion_batch_cadence_uplift_hostile_in_multi_slug_batch
#   corpus_expansion_batch_cadence_class_slug_count_mismatch
#   corpus_expansion_batch_single_slug_isolated_missing_isolation_reason
#   corpus_expansion_batch_isolation_reason_outside_closed_vocabulary
#   corpus_expansion_batch_friendly_multi_slug_slug_count_out_of_range
#
# ===== Inline example (illustrative, not a real batch) =======
#
# schema_version = "1.0"
# batch_id = "batch-001"
# max_slugs = 4
# max_estimated_runtime_minutes = 40
# rationale = "First stratified probe; 1 slug per family."
#
# [family_stratification]
# L1 = 1
# L2 = 1
# Quant = 1
# FIB = 1
#
# [[slugs]]
# slug = "problem_004_gemm_n128_k2048"
# target_cohort = "predictor_friendly"
# target_language = "cutlass"
# estimated_runtime_minutes = 10
#
# [[slugs]]
# slug = "problem_010_layernorm_h2048"
# target_cohort = "predictor_friendly"
# target_language = "cuda_cpp"
# estimated_runtime_minutes = 8
#
# [[slugs]]
# slug = "problem_030_int4_groupwise_quant"
# target_cohort = "predictor_hostile"
# target_language = "cuda_cpp"
# estimated_runtime_minutes = 12
#
# [[slugs]]
# slug = "problem_055_flashattn_fwd"
# target_cohort = "predictor_hostile"
# target_language = "cutlass"
# estimated_runtime_minutes = 10
#
# [[predictor_design_coverage_promotions]]
# slug = "problem_004_gemm_n128_k2048"
