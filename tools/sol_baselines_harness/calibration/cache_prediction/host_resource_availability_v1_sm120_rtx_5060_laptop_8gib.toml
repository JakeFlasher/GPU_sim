# Host-resource availability manifest for the local sm_120 host
# (NVIDIA GeForce RTX 5060 Laptop GPU, 8 GiB VRAM).
#
# Sibling to ``host_resource_availability_v1.toml`` (the sm_86 / 3090
# Ti 24 GiB host's carve-outs). Schema, vocabulary, and contract are
# identical — see the header of the sm_86 file for the field
# definitions and the closed typed-reason set.
#
# Carve-out policy: every workload whose reference-side peak
# resident set exceeds ~6 GiB on this 8 GiB device cannot fit with
# the 2 GiB headroom the harness leaves for the eval driver, the
# correctness allocator's intermediates, and runtime fragmentation.
# The 6 GiB threshold is a hard requirement, not a tunable. Bumping
# it requires a deliberate plan revision, not an in-code knob —
# undersized headroom on the 8 GiB device produces OOM cliffs.
#
# Every entry below originates from the sm_86 ``v1`` sibling with
# ``peak_intermediate_gib >= 6``. On the sm_120 host these are
# REJECTED earlier (the eval reference cannot allocate), not later
# (the kernel-side path is irrelevant). All 11 entries point to
# ``b200_sm_100a_192gib`` (192 GiB HBM3e) as the host class on which
# they ARE evaluable.

