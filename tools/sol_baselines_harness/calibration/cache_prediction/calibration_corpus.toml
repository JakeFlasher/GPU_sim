rationale = "Smoke-tractable streaming wide-GEMM hostile pattern: 1 warp (32 lanes) accumulates K=4 inner iterations over two streams (A + B), where the outer dimension `n=32` makes each inner iteration's `a[id + k*n]` and `b[id + k*n]` jump a full 128 B cache line. Per launch every L1 sector access maps to a distinct cache line under cold L1 (`--replay-mode kernel`), producing exactly 32 L1 sectors / 32 L2 sectors per launch with 0% hit rate on both layers — denominator-consistent with NCU's `srcunit_tex` L2 metric. Working set: 512 B A + 512 B B inputs + 128 B C output. Pairs with the full-scale `problem_011_gemm_n28672_k4096` cohort-B cell which preserves the same streaming-capacity access shape but exceeds the smoke trace envelope (calib_hostile_gemm_stream_smoke.cu:1-44,67-77)."

