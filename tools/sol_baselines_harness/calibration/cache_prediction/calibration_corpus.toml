predictor_bucket = "predictor_hostile"
rationale = "Smoke-tractable paged-GQA gather hostile pattern: 32 query lanes look up a unique page each (32 pages, prime-stride permutation `q*7+3 mod 32`) and read a single float per page (D_HEAD=1). Pages are strided 128 B apart (`PAGE_STRIDE_FLOATS=32`, one full L1 cache line) so each lane's K-cache gather lives in a distinct L1 line — no within-warp line reuse + no within-lane reuse. Per launch every L1 sector access maps to a distinct cache line under cold L1 (`--replay-mode kernel`), producing exactly 36 L1 sectors / 36 L2 sectors per launch with 0% hit rate on both layers — denominator-consistent with NCU's `srcunit_tex` L2 metric. Pairs with the full-scale `problem_012_gqa_paged_decode_h32_kv4_d128_ps1` cohort-B cell which preserves the same indirect K-cache gather shape but exceeds the smoke trace envelope (calib_hostile_gqa_paged_decode_smoke.cu:1-32,52-70)."

