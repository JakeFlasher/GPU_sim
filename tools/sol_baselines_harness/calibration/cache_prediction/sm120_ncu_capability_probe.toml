[plan_metric_family_notes]
# The plan AC-1.2 names `l1tex__t_sector_op_read_hit_rate.pct`
# as the L1 read-only metric. That literal name is NOT
# published by NCU 2026.1.1.0 on sm_120 (probe confirmed
# `grep -c` returned 0). The harvester instead uses the more
# specific `l1tex__t_sector_pipe_lsu_mem_global_op_ld_hit_rate.pct`,
# which restricts the numerator and denominator to LSU-pipe
# global loads — strictly stricter than the plan's named
# `op_read` shape and free of store-conflation by
# construction. Plan AC-1.2's spirit is preserved: only
# read-side traffic is admitted; the store-conflated
# `*_t_sector_hit_rate.pct` family is rejected (and was
# verified PRESENT on the host, which is exactly why the lint
# must reject it).
#
# The L2 metric the plan names (`lts__t_sector_op_read_hit_rate.pct`)
# IS published on sm_120 (verified). The harvester uses the
# srcunit-filtered variant
# (`lts__t_sectors_srcunit_tex_op_read.sum` /
# `..._lookup_hit.sum`) so the denominator matches what NVBit
# can observe at the SASS-execute injection surface. Both
# variants are read-only.

[forbidden_metric_families_observed]
# These metric families ARE published on sm_120 (the probe
# verified the literal names), and the lint at AC-1.2 /
# AC-7 must reject them in any harvested label entry.
forbidden = [
    "lts__t_sector_hit_rate.pct",
    "l1tex__t_sector_hit_rate.pct",
    "syslts__t_sector_hit_rate.pct",
]
rationale = "store-conflated; mixes write-back traffic into the hit-rate denominator under L2's no-write-allocate policy"

[smoke_collection]
# One-launch smoke against the existing sm_86-compiled
# calibration binary `calib_coalesced_32x4B_loop`. The binary
# runs cleanly on sm_120 hardware (driver forward-compat or
# PTX-JIT — kernel returned "ok"). The harvester argv is
# accepted; the parser builds a clean `NcuLabelRecord` with
# non-zero denominators.
binary_path = "nvbit_tracer/metric_extractor/tests/calibration/calib_coalesced_32x4B_loop"
binary_compiled_arch = "sm_86"
binary_sha256 = "12d6872de05bf71642dc76cd668326eee0ef3cb957cb13b1c6e1dc4f0bb4b917"
binary_runs_on_sm_120 = true
ncu_argv = [
    "ncu",
    "--launch-skip", "5",
    "--launch-count", "1",
    "--clock-control", "none",
    "--replay-mode", "kernel",
    "--section", "MemoryWorkloadAnalysis",
    "--metrics",
    "l1tex__t_sector_pipe_lsu_mem_global_op_ld_hit_rate.pct,l1tex__t_sectors_pipe_lsu_mem_global_op_ld.sum,l1tex__t_sectors_pipe_lsu_mem_global_op_ld_lookup_hit.sum,lts__t_sectors_srcunit_tex_op_read.sum,lts__t_sectors_srcunit_tex_op_read_lookup_hit.sum",
    "--csv",
]
csv_sha256 = "2a011813e52ac9498d10ec324e1762c7ddc967d2d8ae0b75056f0995720af42e"
parse_result = "ok"
# Sanity numbers from the parsed smoke run (non-zero L1+L2
# denominators; 0 hits for the cold cache pass — expected for
# a one-launch warm-skip-5 invocation with --replay-mode kernel
# clearing the cache before the measured launch).
l1_global_load_sectors_total = 4
l1_global_load_sectors_hit = 0
l1_global_load_hit_rate_pct = 0.0
l2_read_sectors_total = 4
l2_read_sectors_hit = 0
l2_read_hit_rate_pct = 0.0
