# sm_120 NCU capability probe. Captured 2026-05-26 on the live
# RTX 5060 Laptop GPU host. Gates the sm_120 NCU Tier-2 label
# harvest: the harvester refuses to run if this probe reports
# any required read-only metric UNAVAILABLE.
#
# CLAUDE.md Critical Rule 1: NCU is permitted ONLY for the
# offline Tier-2 calibration carve-out on sm_86 / sm_120; the
# deployed framework path and every B200 invocation remains
# NCU-free.
#
# CLAUDE.md Critical Rule 2: No clock-policy mutation. The
# smoke invocation uses `--clock-control none`; the operator
# accepts the NCU "unmodified GPU clocks" warning that follows.

[meta]
schema_version = "1.0"
captured_at_utc = "2026-05-26T07:01:51+00:00"
host_arch = "sm_120"
host_descriptor_hash = "local_sm_120_rtx_5060_laptop_8gib"
repo_commit_sha = "ed8255c78c06bee7a4e08a09670289732fe6ca81"
overall_go_no_go = "go"

[host]
ncu_version = "Version 2026.1.1.0 (build 37634170) (public-release)"
ncu_cli_path = "/usr/bin/ncu"
ncu_cli_sha256 = "a44ff2c735c4dcf66c78f3f430155805d6a0b1f74f26331f98ecec03bfbf3f1a"
driver_version = "595.71.05"
gpu_pci_device_name = "NVIDIA GeForce RTX 5060 Laptop GPU"
gpu_pci_bus_id = "00000000:01:00.0"
compute_capability = "12.0"
os_kernel = "7.0.10-1-cachyos"
persistence_mode = "Disabled"
# RmProfilingAdminOnly=0 in /proc/driver/nvidia/params means the
# perfmon counters that NCU consumes are accessible to non-root
# users. The harness runs as a regular user on this host.
perfmon_counter_availability = "available_to_non_root"
# Consumer GPU: MIG mode is N/A.
mig_mode_or_na = "N/A"
# No nvidia-cuda-mps-control or DCGM processes running at probe
# time; no contention with NCU's counter subscription.
mps_dcgm_contention_status = "no_contention_observed"
# `--clock-control none` is the only flag pinned by the
# harvester argv. NCU printed "Running with unmodified GPU
# clocks" warning, confirming clocks are NOT locked (Rule 2).
clock_control_observed = "none"
# Smoke run used NCU's default cache-control (no explicit
# `--cache-control` flag). DEC-D specifies pinning this
# per-cell during the actual harvest; the probe records the
# default observed by the smoke run.
cache_control_observed = "ncu_default_no_explicit_pin"

[query_metrics]
# Full `ncu --query-metrics --query-metrics-mode all
# --query-metrics-collection profiling` output (714,556 lines)
# captured to a gzipped sidecar to keep the audit trail
# without bloating the working tree.
sidecar_path = "scripts/baselines_harness/calibration/cache_prediction/sm120_ncu_query_metrics_raw.txt.gz"
sidecar_format = "gzip_text"
# SHA-256 of the UNCOMPRESSED raw text content (gunzip -c
# sidecar | sha256sum). Lets a future reviewer verify the
# inventory against this snapshot without re-running NCU.
query_metrics_raw_sha256 = "1cd8642f631e269fe90effbf5f1831cda3133abc6521420bd4c29ad79b301df5"
query_metrics_raw_uncompressed_size_bytes = 142959001
total_metric_names_reported = 215034

[required_metrics_for_predictor]
# The five NCU metric names the harvester at
# `scripts/baselines_harness/calibration/cache_prediction/ncu_harvester.py:128-134`
# pins. The probe verified each name appears in the live
# query-metrics inventory on the sm_120 host.
#
# All five are AVAILABLE; the harvester can proceed to Phase B
# without typed-unavailable fallbacks for any of these names.

[[required_metrics_for_predictor.entries]]
