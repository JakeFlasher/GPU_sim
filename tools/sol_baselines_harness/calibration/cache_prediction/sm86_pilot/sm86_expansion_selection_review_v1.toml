body = """
1. ADMISSION_DECISION_SUMMARY — Admit 15 total cells: 5 R18 pilot + 4 mandatory hostile + 6 friendly expansion cells, maximizing AC-11's allowed window while preserving family diversity and AC-13 validation minima.

2. HOSTILE_ADMISSION — `problem_011_gemm_n28672_k4096`: mandatory hostile admission because it is the only large GEMM capacity-stress representative and exercises memory/Tier-2 budget pressure beyond friendly GEMM shapes.
`problem_018_fused_rope_with_qk_norm_and_kv_cache_update`: mandatory hostile admission because fused RoPE + QK norm + KV-cache update stresses irregular cache-update access patterns absent from friendly norm/GEMM coverage.
`problem_071_kv_cache_update_with_rope`: mandatory hostile admission because it isolates the KV-cache-with-RoPE hostile pattern and provides a second validation handle on cache-write behavior.
`problem_020_nvfp4_linear_layer`: mandatory hostile admission because NVFP4 block scaling is unverified on sm_86 and is the only corpus cell probing that precision/layout risk.

3. FRIENDLY_ADMISSION — `problem_002_fused_add_rmsnorm_h4096`: admit as the mature RMSNorm anchor because it already served as the R22 smoke pilot and has a landed Tier-2 bundle.
`problem_021_rmsnorm_h128`: admit to cover the very-small, latency-bound normalization regime that the current R18 pilot set does not exercise.
