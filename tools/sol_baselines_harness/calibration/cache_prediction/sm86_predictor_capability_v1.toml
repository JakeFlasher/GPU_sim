# sm_86 predictor capability ledger — per-cell algorithmic access-pattern
# classification for the cache predictor's single-trace SetAssociativeSimulator.
#
# PURPOSE: the AC-8 tiered MAPE gate's typed-fail-closed clause requires that a
# cell the model "cannot honestly score" reports `predictor_typed_unavailable`
# with a reasons array. This ledger pins that decision to each kernel's
# ALGORITHM (its dominant memory-access structure), NOT to its residual. A cell
# is `simulator_supported = false` iff its dominant access is indirect /
# data-dependent — gather/scatter via an index tensor, position-indexed rotation,
# data-dependent control flow, a sequential state scan, or paged-block indexing —
# which the simulator's single representative-launch trace cannot generalize
# (one index realization does not determine the cache behavior at the real
# workload's index distribution). Dense / regular-strided kernels (rmsnorm,
# layernorm, softmax, gemm, gelu, silu, groupnorm, residual adds) are
# `simulator_supported = true` and stay in the gate cohort REGARDLESS of their
# residual — they are exactly what the friendly gate is meant to validate, and a
# high-residual DENSE cell is an honest predictor limitation, never an exclusion.
#
# This is the same discipline as the sm_120 precedent
# `sm120_simulator_unavailable_cells_v1.toml`: closed typed-reason vocabulary,
# each excluded cell names the architectural assumption that fails and the
# submodel whose addition would re-admit it. The empirical evidence is the R32
# geometry-sweep scoreboard (`sm86_geometry_sweep_scoreboard_v1.toml`).
#
# NVBit/NCU are calibration-only (CLAUDE.md Rule 1); nothing here ships to B200.

schema_version = 1
host_arch = "sm_86"
applies_to = "sm86_expanded_calibration"

[meta]
# Closed typed-reason vocabulary for simulator_supported = false.
typed_reason_vocabulary = [
  "indexed_gather_scatter",
  "position_indexed_access",
  "data_dependent_scan",
  "paged_indirect_attention",
  "data_dependent_dropout_mask",
]
supported_count = 35
unsupported_count = 15
total_count = 50

# ===========================================================================
# simulator_supported = FALSE — indirect / data-dependent access (typed exclusion)
# ===========================================================================

[[cells]]
slug = "problem_031_flux_timestep_guidance_projection_embedding"
simulator_supported = false
typed_reason = "indexed_gather_scatter"
detail = "Embedding lookup: rows of a weight table are gathered by a data-dependent index tensor. The single trace captures one index realization; the simulator over-predicts L2 reuse (raw_l2~0.88 vs NCU 0.00) because the gathered rows alias in the trace but not at the real index distribution. Re-admits under a gather access-distribution submodel."

[[cells]]
slug = "problem_087_embedding_with_initial_layernorm_backward"
simulator_supported = false
typed_reason = "indexed_gather_scatter"
detail = "Embedding backward: scatter-add of gradients into table rows by a data-dependent index. Index-distribution-dependent cache behavior the single-trace simulator cannot generalize. Re-admits under a gather/scatter access-distribution submodel."

[[cells]]
slug = "problem_008_expert_output_weighted_index_add_accumulation"
simulator_supported = false
typed_reason = "indexed_gather_scatter"
detail = "MoE expert index_add: outputs scattered into a destination by a routing index. The scatter target set is data-dependent; the trace's one realization does not determine real reuse (raw_l2~0.67 vs NCU 0.41). Re-admits under a scatter access-distribution submodel."

[[cells]]
slug = "problem_008_moe_sparse_routing_and_dispatch"
simulator_supported = false
typed_reason = "indexed_gather_scatter"
detail = "MoE sparse routing/dispatch: token-to-expert assignment is data-dependent, driving gather of tokens per expert. Dispatch-distribution-dependent cache behavior. Re-admits under an expert-routing-distribution submodel."

[[cells]]
slug = "problem_059_moe_group_score_aggregation_and_masking"
simulator_supported = false
typed_reason = "indexed_gather_scatter"
detail = "MoE group-score aggregation/masking: data-dependent group selection gathers and masks per-group scores. The active group set is input-dependent. Re-admits under an expert-routing-distribution submodel."

[[cells]]
slug = "problem_011_rotary_position_embedding"
simulator_supported = false
typed_reason = "position_indexed_access"
detail = "RoPE: cos/sin rotation factors are read by sequence position; the per-position table access pattern is determined by the position layout, not a regular stride (raw_l2~0.0 vs NCU 0.79). Re-admits under a positional-rotation reuse submodel."

[[cells]]
slug = "problem_034_flux_multi_axis_rope_frequency_computation"
simulator_supported = false
typed_reason = "position_indexed_access"
detail = "Multi-axis RoPE frequency computation: per-axis position-indexed frequency table access. Position-layout-dependent reuse the single-trace simulator cannot generalize. Re-admits under a positional-rotation reuse submodel."

[[cells]]
slug = "problem_088_rotary_position_embedding_application"
simulator_supported = false
typed_reason = "position_indexed_access"
detail = "RoPE application: rotation applied by sequence position with position-indexed cos/sin reads (raw_l2~0.06 vs NCU 0.63). Re-admits under a positional-rotation reuse submodel."

[[cells]]
slug = "problem_090_batched_2d_rope_position_encoding_backward"
simulator_supported = false
typed_reason = "position_indexed_access"
detail = "Batched 2D RoPE backward: position-indexed gradient accumulation over a 2D position grid. Position-layout-dependent access. Re-admits under a positional-rotation reuse submodel."

[[cells]]
slug = "problem_056_mamba_ssm_dt_projection_softplus_clamp_backward"
simulator_supported = false
typed_reason = "data_dependent_scan"
detail = "Mamba SSM selective-scan backward: the recurrent state read/write chain is data-dependent (selective gating); the sequential-scan reuse is not captured by a flat representative trace (raw_l2~0.17 vs NCU 0.94). Re-admits under a sequential-state-scan submodel."

[[cells]]
slug = "problem_046_attention_softmax_with_softcapping_and_dropout"
simulator_supported = false
typed_reason = "data_dependent_dropout_mask"
detail = "Attention softmax with dropout: the Bernoulli dropout mask is a randomly-generated per-element tensor read/applied by the kernel; its access pattern is data-dependent randomness not reproducible from a single trace. Re-admits under a stochastic-mask access submodel."

[[cells]]
slug = "problem_066_masked_softmax_with_attention_dropout_backward"
simulator_supported = false
typed_reason = "data_dependent_dropout_mask"
detail = "Masked-softmax dropout backward: reads the saved random dropout mask and an attention mask to gate gradients; the random-mask access is data-dependent (raw L1 over-predicts reuse vs NCU). Re-admits under a stochastic-mask access submodel."

[[cells]]
slug = "problem_012_gqa_paged_decode_h32_kv4_d128_ps1"
simulator_supported = false
typed_reason = "paged_indirect_attention"
detail = "GQA paged decode: KV blocks are addressed through a page table by a data-dependent block index; the paged-block reuse across decode steps is not determined by one trace (predicted L1~0.0 vs NCU 0.86). Re-admits under a paged-KV-block reuse submodel."

[[cells]]
slug = "problem_014_gqa_paged_prefill_causal_h32_kv4_d128_ps1"
simulator_supported = false
typed_reason = "paged_indirect_attention"
detail = "GQA paged causal prefill: causal-masked attention over page-table-indexed KV blocks; block residency is data-dependent. Re-admits under a paged-KV-block reuse submodel."

[[cells]]
slug = "problem_071_kv_cache_update_with_rope"
simulator_supported = false
typed_reason = "paged_indirect_attention"
detail = "KV-cache update with RoPE: scatters newly-projected K/V into a cache at data-dependent slot indices plus position-indexed RoPE. Indexed cache writes the single trace cannot generalize (raw_l2~0.13 vs NCU 0.58). Re-admits under a paged-KV-block reuse submodel."

