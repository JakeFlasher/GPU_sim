# sm_120 cohort classification (Claude initial proposal,
# Round 0 / 2026-05-26). This file pins the friendly /
# hostile / typed-unavailable bucket for every calibration
# cell BEFORE the sm_120 NCU harvest runs, so the validation
# gates (AC-5) have a fixed contract.
#
# Source-of-truth alignment: the per-cell bucket assignments
# below mirror the canonical sm_86 partition encoded in
# `scripts/baselines_harness/metrics/predictor_design_coverage.py`
# (functions `_COHORT_A_ENTRIES`, `_COHORT_B_ENTRIES`). The
# canonical partition is the load-bearing single source of
# truth; this TOML adds an sm_120-specific overlay capturing
# arch-conditional bucket downgrades when a sm_120 kernel
# touches a metric family or hardware feature that the
# read-only predictor cannot honestly score on sm_120.
#
# Decision status: AWAITING OPERATOR REVIEW. The plan's
# DEC-J pins cohort classification as operator-owned;
# Claude proposes; the operator amends. This file is
# explicitly marked `decision_status = "proposal"` until
# the operator confirms.

