[package]
name = "sim-run"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "sim_direct_run"
path = "src/lib.rs"

[features]
default = []
performance-counters = ["sim-sm/performance-counters"]
reference = ["sim-sm/reference"]

[[bin]]
name = "sim-run"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sim-arch = { path = "../arch" }
sim-mem = { path = "../mem" }
sim-run-campaign = { path = "../run" }
sim-semantics = { path = "../semantics" }
sim-sm = { path = "../sm" }
sim-trace = { path = "../trace" }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
