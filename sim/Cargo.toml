[workspace]
resolver = "2"
members = ["arch", "engine", "sm", "mem", "trace", "semantics", "direct_run", "run"]
default-members = ["arch", "engine", "sm", "mem", "trace", "direct_run"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/JakeFlasher/cross_arch_gpu_profiler_suite"

[workspace.dependencies]
csv = "1"
libc = "0.2"
prost = "0.14"
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "raw_value"] }
thiserror = "2"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
