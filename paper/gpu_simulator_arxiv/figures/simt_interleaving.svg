<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-labelledby="title desc">
<title id="title">How SIMT is modeled without pretending lanes are CPU threads</title><desc id="desc">CPU thread interleaving, SIMT warp lockstep, and warp-level scheduling are separated; the replay uses the third model.</desc>
<defs><marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#1769AA"/></marker><marker id="arrowCoral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#D95D39"/></marker></defs>
<rect width="1800" height="1050" fill="white"/><text x="72" y="65" text-anchor="start" style="font-family:Georgia;font-size:38px;font-weight:700;fill:#14233B;">How SIMT is modeled without pretending lanes are CPU threads</text><text x="74" y="100" text-anchor="start" style="font-family:Arial;font-size:19px;font-weight:400;fill:#52657A;">Lane masks stay inside a warp; scheduling interleaves resident warps across SMSP issue partitions.</text><rect x="65" y="145" width="510" height="610" rx="20" fill="#EAF4FC" stroke="#1769AA" stroke-width="2.5"/><text x="93" y="190" text-anchor="start" style="font-family:Arial;font-size:21px;font-weight:700;fill:#1769AA;">CPU-style thread interleaving</text><rect x="645" y="145" width="510" height="610" rx="20" fill="#E7F6F2" stroke="#008F82" stroke-width="2.5"/><text x="673" y="190" text-anchor="start" style="font-family:Arial;font-size:21px;font-weight:700;fill:#008F82;">SIMT warp lockstep</text><rect x="1225" y="145" width="510" height="610" rx="20" fill="#FFF3D9" stroke="#E29B22" stroke-width="2.5"/><text x="1253" y="190" text-anchor="start" style="font-family:Arial;font-size:21px;font-weight:700;fill:#E29B22;">Our native replay</text><text x="95" y="225" text-anchor="start" style="font-family:Arial;font-size:15px;font-weight:400;fill:#52657A;font-style:italic;">host threads own independent PCs</text><text x="95" y="298" text-anchor="start" style="font-family:Arial;font-size:16px;font-weight:700;fill:#14233B;">T0</text><rect x="145" y="280" width="100" height="35" rx="6" fill="#1769AA" stroke="#1769AA" stroke-width="1"/><text x="195" y="303" text-anchor="middle" style="font-family:Arial;font-size:15px;font-weight:700;fill:white;">op</text><rect x="265" y="280" width="100" height="35" rx="6" fill="#56B4E9" stroke="#56B4E9" stroke-width="1"/><text x="315" y="303" text-anchor="middle" style="font-family:Arial;font-size:15px;font-weight:700;fill:white;">op</text><rect x="385" y="280" width="100" height="35" rx="6" fill="#1769AA" stroke="#1769AA" stroke-width="1"/><text x="435" y="303" text-anchor="middle" style="font-family:Arial;font-size:15px;font-weight:700;fill:white;">op</text><text x="95" y="366" text-anchor="start" style="font-family:Arial;font-size:16px;font-weight:700;fill:#14233B;">T1</text><rect x="145" y="348" width="100" height="35" rx="6" fill="#1769AA" stroke="#1769AA" stroke-width="1"/><text x="195" y="371" text-anchor="middle" style="font-family:Arial;font-size:15px;font-weight:700;fill:white;">op</text><rect x="265" y="348" width="100" height="35" rx="6" fill="#56B4E9" stroke="#56B4E9" stroke-width="1"/><text x="315" y="371" text-anchor="middle" style="font-family:Arial;font-size:15px;font-weight:700;fill:white;">op</text><rect x="385" y="348" width="100" height="35" rx="6" fill="#1769AA" stroke="#1769AA" stroke-width="1"/><text x="435" y="371" text-anchor="middle" style="font-family:Arial;font-size:15px;font-weight:700;fill:white;">op</text><text x="95" y="434" text-anchor="start" style="font-family:Arial;font-size:16px;font-weight:700;fill:#14233B;">T2</text><rect x="145" y="416" width="100" height="35" rx="6" fill="#1769AA" stroke="#1769AA" stroke-width="1"/><text x="195" y="439" text-anchor="middle" style="font-family:Arial;font-size:15px;font-weight:700;fill:white;">op</text><rect x="265" y="416" width="100" height="35" rx="6" fill="#56B4E9" stroke="#56B4E9" stroke-width="1"/><text x="315" y="439" text-anchor="middle" style="font-family:Arial;font-size:15px;font-weight:700;fill:white;">op</text><rect x="385" y="416" width="100" height="35" rx="6" fill="#1769AA" stroke="#1769AA" stroke-width="1"/><text x="435" y="439" text-anchor="middle" style="font-family:Arial;font-size:15px;font-weight:700;fill:white;">op</text><text x="95" y="502" text-anchor="start" style="font-family:Arial;font-size:16px;font-weight:700;fill:#14233B;">T3</text><rect x="145" y="484" width="100" height="35" rx="6" fill="#1769AA" stroke="#1769AA" stroke-width="1"/><text x="195" y="507" text-anchor="middle" style="font-family:Arial;font-size:15px;font-weight:700;fill:white;">op</text><rect x="265" y="484" width="100" height="35" rx="6" fill="#56B4E9" stroke="#56B4E9" stroke-width="1"/><text x="315" y="507" text-anchor="middle" style="font-family:Arial;font-size:15px;font-weight:700;fill:white;">op</text><rect x="385" y="484" width="100" height="35" rx="6" fill="#1769AA" stroke="#1769AA" stroke-width="1"/><text x="435" y="507" text-anchor="middle" style="font-family:Arial;font-size:15px;font-weight:700;fill:white;">op</text><rect x="95" y="595" width="420" height="92" rx="10" fill="white" stroke="#1769AA" stroke-width="1.5"/><text x="115" y="625" text-anchor="start" style="font-family:Arial;font-size:16px;font-weight:700;fill:#1769AA;">Tradeoff</text><text x="115" y="652" text-anchor="start" style="font-family:Arial;font-size:15px;font-weight:400;fill:#14233B;">accurate per-thread control; high host/event cost</text><text x="675" y="225" text-anchor="start" style="font-family:Arial;font-size:15px;font-weight:400;fill:#52657A;font-style:italic;">one warp instruction, many lanes</text><text x="675" y="298" text-anchor="start" style="font-family:Arial;font-size:16px;font-weight:700;fill:#14233B;">warp 0</text><rect x="755" y="280" width="27" height="35" rx="4" fill="#7356A5" stroke="#7356A5" stroke-width="1"/><rect x="789" y="280" width="27" height="35" rx="4" fill="#008F82" stroke="#008F82" stroke-width="1"/><rect x="823" y="280" width="27" height="35" rx="4" fill="#008F82" stroke="#008F82" stroke-width="1"/><rect x="857" y="280" width="27" height="35" rx="4" fill="#7356A5" stroke="#7356A5" stroke-width="1"/><rect x="891" y="280" width="27" height="35" rx="4" fill="#008F82" stroke="#008F82" stroke-width="1"/><rect x="925" y="280" width="27" height="35" rx="4" fill="#008F82" stroke="#008F82" stroke-width="1"/><rect x="959" y="280" width="27" height="35" rx="4" fill="#7356A5" stroke="#7356A5" stroke-width="1"/><rect x="993" y="280" width="27" height="35" rx="4" fill="#008F82" stroke="#008F82" stroke-width="1"/><text x="675" y="366" text-anchor="start" style="font-family:Arial;font-size:16px;font-weight:700;fill:#14233B;">warp 1</text><rect x="755" y="348" width="27" height="35" rx="4" fill="#008F82" stroke="#008F82" stroke-width="1"/><rect x="789" y="348" width="27" height="35" rx="4" fill="#008F82" stroke="#008F82" stroke-width="1"/><rect x="823" y="348" width="27" height="35" rx="4" fill="#7356A5" stroke="#7356A5" stroke-width="1"/><rect x="857" y="348" width="27" height="35" rx="4" fill="#008F82" stroke="#008F82" stroke-width="1"/><rect x="891" y="348" width="27" height="35" rx="4" fill="#008F82" stroke="#008F82" stroke-width="1"/><rect x="925" y="348" width="27" height="35" rx="4" fill="#7356A5" stroke="#7356A5" stroke-width="1"/><rect x="959" y="348" width="27" height="35" rx="4" fill="#008F82" stroke="#008F82" stroke-width="1"/><rect x="993" y="348" width="27" height="35" rx="4" fill="#008F82" stroke="#008F82" stroke-width="1"/><text x="675" y="434" text-anchor="start" style="font-family:Arial;font-size:16px;font-weight:700;fill:#14233B;">warp 2</text><rect x="755" y="416" width="27" height="35" rx="4" fill="#008F82" stroke="#008F82" stroke-width="1"/><rect x="789" y="416" width="27" height="35" rx="4" fill="#7356A5" stroke="#7356A5" stroke-width="1"/><rect x="823" y="416" width="27" height="35" rx="4" fill="#008F82" stroke="#008F82" stroke-width="1"/><rect x="857" y="416" width="27" height="35" rx="4" fill="#008F82" stroke="#008F82" stroke-width="1"/><rect x="891" y="416" width="27" height="35" rx="4" fill="#7356A5" stroke="#7356A5" stroke-width="1"/><rect x="925" y="416" width="27" height="35" rx="4" fill="#008F82" stroke="#008F82" stroke-width="1"/><rect x="959" y="416" width="27" height="35" rx="4" fill="#008F82" stroke="#008F82" stroke-width="1"/><rect x="993" y="416" width="27" height="35" rx="4" fill="#7356A5" stroke="#7356A5" stroke-width="1"/><text x="675" y="502" text-anchor="start" style="font-family:Arial;font-size:16px;font-weight:700;fill:#14233B;">warp 3</text><rect x="755" y="484" width="27" height="35" rx="4" fill="#7356A5" stroke="#7356A5" stroke-width="1"/><rect x="789" y="484" width="27" height="35" rx="4" fill="#008F82" stroke="#008F82" stroke-width="1"/><rect x="823" y="484" width="27" height="35" rx="4" fill="#008F82" stroke="#008F82" stroke-width="1"/><rect x="857" y="484" width="27" height="35" rx="4" fill="#7356A5" stroke="#7356A5" stroke-width="1"/><rect x="891" y="484" width="27" height="35" rx="4" fill="#008F82" stroke="#008F82" stroke-width="1"/><rect x="925" y="484" width="27" height="35" rx="4" fill="#008F82" stroke="#008F82" stroke-width="1"/><rect x="959" y="484" width="27" height="35" rx="4" fill="#7356A5" stroke="#7356A5" stroke-width="1"/><rect x="993" y="484" width="27" height="35" rx="4" fill="#008F82" stroke="#008F82" stroke-width="1"/><rect x="675" y="595" width="420" height="92" rx="10" fill="white" stroke="#008F82" stroke-width="1.5"/><text x="695" y="625" text-anchor="start" style="font-family:Arial;font-size:16px;font-weight:700;fill:#008F82;">Tradeoff</text><text x="695" y="652" text-anchor="start" style="font-family:Arial;font-size:15px;font-weight:400;fill:#14233B;">excellent lane efficiency; divergence and masks matter</text><text x="1255" y="225" text-anchor="start" style="font-family:Arial;font-size:15px;font-weight:400;fill:#52657A;font-style:italic;">recorded warp streams + masks</text><rect x="1255" y="282" width="100" height="35" rx="6" fill="#1769AA" stroke="#1769AA" stroke-width="1"/><text x="1305" y="305" text-anchor="middle" style="font-family:Arial;font-size:15px;font-weight:700;fill:white;">SMSP 0</text><line x1="1365" y1="300" x2="1410" y2="300" stroke="#1769AA" stroke-width="3" marker-end="url(#arrowBlue)"/><rect x="1415" y="282" width="105" height="35" rx="6" fill="#1769AA" stroke="#1769AA" stroke-width="1"/><text x="1467" y="305" text-anchor="middle" style="font-family:Arial;font-size:15px;font-weight:700;fill:white;">warp</text><rect x="1535" y="282" width="115" height="35" rx="6" fill="white" stroke="#1769AA" stroke-width="1.5"/><text x="1592" y="305" text-anchor="middle" style="font-family:Arial;font-size:13px;font-weight:700;fill:#1769AA;">mask + sectors</text><rect x="1255" y="347" width="100" height="35" rx="6" fill="#7356A5" stroke="#7356A5" stroke-width="1"/><text x="1305" y="370" text-anchor="middle" style="font-family:Arial;font-size:15px;font-weight:700;fill:white;">SMSP 1</text><line x1="1365" y1="365" x2="1410" y2="365" stroke="#7356A5" stroke-width="3" marker-end="url(#arrowBlue)"/><rect x="1415" y="347" width="105" height="35" rx="6" fill="#7356A5" stroke="#7356A5" stroke-width="1"/><text x="1467" y="370" text-anchor="middle" style="font-family:Arial;font-size:15px;font-weight:700;fill:white;">warp</text><rect x="1535" y="347" width="115" height="35" rx="6" fill="white" stroke="#7356A5" stroke-width="1.5"/><text x="1592" y="370" text-anchor="middle" style="font-family:Arial;font-size:13px;font-weight:700;fill:#7356A5;">mask + sectors</text><rect x="1255" y="412" width="100" height="35" rx="6" fill="#D95D39" stroke="#D95D39" stroke-width="1"/><text x="1305" y="435" text-anchor="middle" style="font-family:Arial;font-size:15px;font-weight:700;fill:white;">SMSP 2</text><line x1="1365" y1="430" x2="1410" y2="430" stroke="#D95D39" stroke-width="3" marker-end="url(#arrowBlue)"/><rect x="1415" y="412" width="105" height="35" rx="6" fill="#D95D39" stroke="#D95D39" stroke-width="1"/><text x="1467" y="435" text-anchor="middle" style="font-family:Arial;font-size:15px;font-weight:700;fill:white;">warp</text><rect x="1535" y="412" width="115" height="35" rx="6" fill="white" stroke="#D95D39" stroke-width="1.5"/><text x="1592" y="435" text-anchor="middle" style="font-family:Arial;font-size:13px;font-weight:700;fill:#D95D39;">mask + sectors</text><rect x="1255" y="477" width="100" height="35" rx="6" fill="#E29B22" stroke="#E29B22" stroke-width="1"/><text x="1305" y="500" text-anchor="middle" style="font-family:Arial;font-size:15px;font-weight:700;fill:white;">SMSP 3</text><line x1="1365" y1="495" x2="1410" y2="495" stroke="#E29B22" stroke-width="3" marker-end="url(#arrowBlue)"/><rect x="1415" y="477" width="105" height="35" rx="6" fill="#E29B22" stroke="#E29B22" stroke-width="1"/><text x="1467" y="500" text-anchor="middle" style="font-family:Arial;font-size:15px;font-weight:700;fill:white;">warp</text><rect x="1535" y="477" width="115" height="35" rx="6" fill="white" stroke="#E29B22" stroke-width="1.5"/><text x="1592" y="500" text-anchor="middle" style="font-family:Arial;font-size:13px;font-weight:700;fill:#E29B22;">mask + sectors</text><rect x="1255" y="595" width="420" height="92" rx="10" fill="white" stroke="#E29B22" stroke-width="1.5"/><text x="1275" y="625" text-anchor="start" style="font-family:Arial;font-size:16px;font-weight:700;fill:#E29B22;">Our tradeoff</text><text x="1275" y="652" text-anchor="start" style="font-family:Arial;font-size:15px;font-weight:400;fill:#14233B;">one host actor per SM; lanes stay compact and auditable</text><rect x="65" y="785" width="1670" height="84" rx="12" fill="#FDECE7" stroke="#D95D39" stroke-width="1.5"/><text x="95" y="818" text-anchor="start" style="font-family:Arial;font-size:17px;font-weight:700;fill:#D95D39;">Key distinction</text><text x="245" y="818" text-anchor="start" style="font-family:Arial;font-size:17px;font-weight:700;fill:#14233B;">we do not spawn 32 host threads per warp</text><text x="245" y="846" text-anchor="start" style="font-family:Arial;font-size:15px;font-weight:400;fill:#14233B;">the trace supplies lane masks/addresses; sim-sm interleaves resident warps, and sim-mem aggregates sectors at cache acceptance</text><rect x="55" y="930" width="1690" height="88" rx="12" fill="#EEF4FA" stroke="#C9D9EA" stroke-width="1.5"/><text x="78" y="960" text-anchor="start" style="font-family:Arial;font-size:16px;font-weight:700;fill:#14233B;">Caption.</text><text x="176" y="960" text-anchor="start" style="font-family:Arial;font-size:16px;font-weight:400;fill:#14233B;">SIMT modeling is a hierarchy: lanes execute one warp instruction together, while resident warps interleave at SMSP issue boundaries. The replay preserves the lane evidence without paying CPU-style per-thread event cost.</text><text x="78" y="988" text-anchor="start" style="font-family:Arial;font-size:13px;font-weight:400;fill:#52657A;">Source: sim/sm/src/issue.rs, sim/sm/src/replay.rs, static SASS masks, placement metadata, and custom SIMT differential evidence.</text></svg>