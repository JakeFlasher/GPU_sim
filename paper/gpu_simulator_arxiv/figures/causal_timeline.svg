<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-labelledby="title desc">
<title id="title">One instruction through the causal replay pipeline</title><desc id="desc">A worked timeline separates issue, cache lookup, service, response wake-up, and observation frontiers.</desc>
<defs><marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#1769AA"/></marker><marker id="arrowCoral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#D95D39"/></marker></defs>
<rect width="1800" height="1050" fill="white"/><text x="72" y="65" text-anchor="start" style="font-family:Georgia;font-size:38px;font-weight:700;fill:#14233B;">One instruction through the causal replay pipeline</text><text x="74" y="100" text-anchor="start" style="font-family:Arial;font-size:19px;font-weight:400;fill:#52657A;">The model advances between meaningful events while preserving ownership of each frontier.</text><rect x="65" y="145" width="1670" height="700" rx="18" fill="#F5F8FB" stroke="#D7E1EC" stroke-width="2.0"/><text x="95" y="190" text-anchor="start" style="font-family:Arial;font-size:22px;font-weight:700;fill:#1769AA;">WORKED EVENT SLICE</text><text x="95" y="220" text-anchor="start" style="font-family:Arial;font-size:16px;font-weight:400;fill:#52657A;font-style:italic;">one warp instruction • four sectors • one merged fill</text><text x="95" y="306" text-anchor="start" style="font-family:Arial;font-size:17px;font-weight:700;fill:#14233B;">warp / SMSP</text><line x1="250" y1="300" x2="1690" y2="300" stroke="#D7E1EC" stroke-width="2"/><text x="95" y="396" text-anchor="start" style="font-family:Arial;font-size:17px;font-weight:700;fill:#14233B;">L1TEX</text><line x1="250" y1="390" x2="1690" y2="390" stroke="#D7E1EC" stroke-width="2"/><text x="95" y="486" text-anchor="start" style="font-family:Arial;font-size:17px;font-weight:700;fill:#14233B;">shared L2</text><line x1="250" y1="480" x2="1690" y2="480" stroke="#D7E1EC" stroke-width="2"/><text x="95" y="576" text-anchor="start" style="font-family:Arial;font-size:17px;font-weight:700;fill:#14233B;">service</text><line x1="250" y1="570" x2="1690" y2="570" stroke="#D7E1EC" stroke-width="2"/><text x="95" y="666" text-anchor="start" style="font-family:Arial;font-size:17px;font-weight:700;fill:#14233B;">wake-up</text><line x1="250" y1="660" x2="1690" y2="660" stroke="#D7E1EC" stroke-width="2"/><line x1="250.0" y1="250" x2="250.0" y2="725" stroke="#D7E1EC" stroke-width="1" stroke-dasharray="4 8"/><text x="250.0" y="755" text-anchor="middle" style="font-family:Arial;font-size:14px;font-weight:400;fill:#52657A;">0</text><line x1="265.0" y1="250" x2="265.0" y2="725" stroke="#D7E1EC" stroke-width="1" stroke-dasharray="4 8"/><text x="265.0" y="755" text-anchor="middle" style="font-family:Arial;font-size:14px;font-weight:400;fill:#52657A;">1</text><line x1="280.0" y1="250" x2="280.0" y2="725" stroke="#D7E1EC" stroke-width="1" stroke-dasharray="4 8"/><text x="280.0" y="755" text-anchor="middle" style="font-family:Arial;font-size:14px;font-weight:400;fill:#52657A;">2</text><line x1="370.0" y1="250" x2="370.0" y2="725" stroke="#D7E1EC" stroke-width="1" stroke-dasharray="4 8"/><text x="370.0" y="755" text-anchor="middle" style="font-family:Arial;font-size:14px;font-weight:400;fill:#52657A;">8</text><line x1="610.0" y1="250" x2="610.0" y2="725" stroke="#D7E1EC" stroke-width="1" stroke-dasharray="4 8"/><text x="610.0" y="755" text-anchor="middle" style="font-family:Arial;font-size:14px;font-weight:400;fill:#52657A;">24</text><line x1="970.0" y1="250" x2="970.0" y2="725" stroke="#D7E1EC" stroke-width="1" stroke-dasharray="4 8"/><text x="970.0" y="755" text-anchor="middle" style="font-family:Arial;font-size:14px;font-weight:400;fill:#52657A;">48</text><line x1="1690.0" y1="250" x2="1690.0" y2="725" stroke="#D7E1EC" stroke-width="1" stroke-dasharray="4 8"/><text x="1690.0" y="755" text-anchor="middle" style="font-family:Arial;font-size:14px;font-weight:400;fill:#52657A;">96</text><text x="965" y="790" text-anchor="middle" style="font-family:Arial;font-size:15px;font-weight:400;fill:#52657A;">relative SM cycles</text><rect x="250.0" y="277" width="120.0" height="46" rx="10" fill="#1769AA" stroke="#1769AA" stroke-width="1"/><text x="310.0" y="306" text-anchor="middle" style="font-family:Arial;font-size:15px;font-weight:700;fill:white;">issue</text><rect x="370.0" y="367" width="180.0" height="46" rx="10" fill="#008F82" stroke="#008F82" stroke-width="1"/><text x="460.0" y="396" text-anchor="middle" style="font-family:Arial;font-size:15px;font-weight:700;fill:white;">L1 lookup</text><rect x="550.0" y="457" width="300.0" height="46" rx="10" fill="#7356A5" stroke="#7356A5" stroke-width="1"/><text x="700.0" y="486" text-anchor="middle" style="font-family:Arial;font-size:15px;font-weight:700;fill:white;">L2 miss</text><rect x="850.0" y="547" width="480.0" height="46" rx="10" fill="#D95D39" stroke="#D95D39" stroke-width="1"/><text x="1090.0" y="576" text-anchor="middle" style="font-family:Arial;font-size:15px;font-weight:700;fill:white;">DRAM / service</text><rect x="1330.0" y="637" width="150.0" height="46" rx="10" fill="#2C9362" stroke="#2C9362" stroke-width="1"/><text x="1405.0" y="666" text-anchor="middle" style="font-family:Arial;font-size:15px;font-weight:700;fill:white;">fill + wake</text><path d="M390 390 C500 345 520 480 620 480" stroke="#008F82" stroke-width="3" fill="none" stroke-dasharray="8 7" marker-end="url(#arrowBlue)"/><text x="500" y="350" text-anchor="middle" style="font-family:Arial;font-size:14px;font-weight:700;fill:#008F82;">MSHR merge</text><line x1="370.0" y1="245" x2="370.0" y2="725" stroke="#1769AA" stroke-width="3" stroke-dasharray="10 7"/><text x="378.0" y="265" text-anchor="start" style="font-family:Arial;font-size:14px;font-weight:700;fill:#1769AA;">issue frontier</text><line x1="1480.0" y1="245" x2="1480.0" y2="725" stroke="#7356A5" stroke-width="3" stroke-dasharray="10 7"/><text x="1488.0" y="265" text-anchor="start" style="font-family:Arial;font-size:14px;font-weight:700;fill:#7356A5;">modeled completion</text><line x1="1690.0" y1="245" x2="1690.0" y2="725" stroke="#E29B22" stroke-width="3" stroke-dasharray="10 7"/><text x="1698.0" y="265" text-anchor="start" style="font-family:Arial;font-size:14px;font-weight:700;fill:#E29B22;">observation</text><rect x="95" y="815" width="1590" height="48" rx="10" fill="#FDECE7" stroke="#D95D39" stroke-width="1.5"/><text x="890" y="846" text-anchor="middle" style="font-family:Arial;font-size:17px;font-weight:700;fill:#D95D39;">Frontier rule: issue ≠ completion ≠ profiler observation; dirty writeback/coherence remain typed tails.</text><rect x="55" y="930" width="1690" height="88" rx="12" fill="#EEF4FA" stroke="#C9D9EA" stroke-width="1.5"/><text x="78" y="960" text-anchor="start" style="font-family:Arial;font-size:16px;font-weight:700;fill:#14233B;">Caption.</text><text x="176" y="960" text-anchor="start" style="font-family:Arial;font-size:16px;font-weight:400;fill:#14233B;">A single traced instruction exercises the simulator&#x27;s core promise: event time jumps from issue to lookup, service, and wake-up, but the report preserves which frontier each event belongs to.</text><text x="78" y="988" text-anchor="start" style="font-family:Arial;font-size:13px;font-weight:400;fill:#52657A;">Source: sim-engine event ordering, sim-sm readiness, sim-mem sector state, and the frontier ledger.</text></svg>