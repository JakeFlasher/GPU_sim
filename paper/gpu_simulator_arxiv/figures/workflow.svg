<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc"><title id="title">Six-stage GPU simulator workflow</title><desc id="desc">Publication figure showing concrete artifacts, numbered transformations, and the one-way NCU observation branch.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fcfdff"/><stop offset="1" stop-color="#edf3fa"/></linearGradient><linearGradient id="hero" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#18345d"/><stop offset="1" stop-color="#2e639f"/></linearGradient><linearGradient id="teal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f7f87"/><stop offset="1" stop-color="#29b5a5"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#203b5f" flood-opacity=".16"/></filter><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#3468ad"/></marker><marker id="arrCoral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#e56d50"/></marker><style>.title{font:700 38px Georgia,serif;fill:#15253f}.sub{font:18px Arial,sans-serif;fill:#5d6b80}.panel{font:700 23px Arial,sans-serif;fill:#15253f}.body{font:17px Arial,sans-serif;fill:#15253f}.small{font:14px Arial,sans-serif;fill:#5d6b80}.tiny{font:12px Arial,sans-serif;fill:#5d6b80}.white{font:16px Arial,sans-serif;fill:#fff}.legend{font:14px Arial,sans-serif;fill:#15253f}.caption{font:16px Arial,sans-serif;fill:#15253f}</style></defs><rect width="1800" height="1000" fill="#ffffff"/><text x="72" y="68" class="title">Six transformations turn a GPU trace into evidence</text><text x="74" y="101" class="sub">Each arrow names an artifact or invariant; the dotted branch never feeds replay</text><rect x="95" y="260" width="230" height="170" rx="18" fill="#fff" stroke="#d6e0ec" stroke-width="2"/><circle cx="129" cy="295" r="22" fill="#159b9c"/><text x="129" y="302" class="white" text-anchor="middle">1</text><text x="165" y="302" class="panel" style="font-size:19px">NVBit capture</text><text x="123" y="355" class="body">dynamic_trace.pb</text><text x="123" y="383" class="body">+ stats.csv</text><path d="M325,345 L370,345" fill="none" stroke="#3468ad" stroke-width="3" marker-end="url(#arr)"/><rect x="370" y="260" width="230" height="170" rx="18" fill="#fff" stroke="#d6e0ec" stroke-width="2"/><circle cx="404" cy="295" r="22" fill="#3468ad"/><text x="404" y="302" class="white" text-anchor="middle">2</text><text x="440" y="302" class="panel" style="font-size:19px">Canonical join</text><text x="398" y="355" class="body">warp records</text><text x="398" y="383" class="body">+ SASS controls</text><path d="M600,345 L645,345" fill="none" stroke="#3468ad" stroke-width="3" marker-end="url(#arr)"/><rect x="645" y="260" width="230" height="170" rx="18" fill="#fff" stroke="#d6e0ec" stroke-width="2"/><circle cx="679" cy="295" r="22" fill="#7258a6"/><text x="679" y="302" class="white" text-anchor="middle">3</text><text x="715" y="302" class="panel" style="font-size:19px">SMSP issue</text><text x="673" y="355" class="body">4 partitions</text><text x="673" y="383" class="body">+ dependencies</text><path d="M875,345 L920,345" fill="none" stroke="#3468ad" stroke-width="3" marker-end="url(#arr)"/><rect x="920" y="260" width="230" height="170" rx="18" fill="#fff" stroke="#d6e0ec" stroke-width="2"/><circle cx="954" cy="295" r="22" fill="#e56d50"/><text x="954" y="302" class="white" text-anchor="middle">4</text><text x="990" y="302" class="panel" style="font-size:19px">Hierarchy service</text><text x="948" y="355" class="body">L1 sectors</text><text x="948" y="383" class="body">→ L2 → DRAM</text><path d="M1150,345 L1195,345" fill="none" stroke="#3468ad" stroke-width="3" marker-end="url(#arr)"/><rect x="1195" y="260" width="230" height="170" rx="18" fill="#fff" stroke="#d6e0ec" stroke-width="2"/><circle cx="1229" cy="295" r="22" fill="#e4ad3d"/><text x="1229" y="302" class="white" text-anchor="middle">5</text><text x="1265" y="302" class="panel" style="font-size:19px">Frontier emit</text><text x="1223" y="355" class="body">issue • modeled</text><text x="1223" y="383" class="body">completion • tails</text><path d="M1425,345 L1470,345" fill="none" stroke="#3468ad" stroke-width="3" marker-end="url(#arr)"/><rect x="1470" y="260" width="230" height="170" rx="18" fill="#fff" stroke="#d6e0ec" stroke-width="2"/><circle cx="1504" cy="295" r="22" fill="#2f9a69"/><text x="1504" y="302" class="white" text-anchor="middle">6</text><text x="1540" y="302" class="panel" style="font-size:19px">Compare</text><text x="1498" y="355" class="body">NCU obs.</text><text x="1498" y="383" class="body">+ non-regression</text><rect x="95" y="500" width="1605" height="130" rx="18" fill="#edf4fb" stroke="#c5d8ed"/><text x="125" y="540" class="panel" style="font-size:20px">State carried across the path</text><text x="125" y="578" class="body">warp id  •  PC  •  active/predicate masks  •  lane sectors  •  control bits  •  cache generation  •  event sequence</text><text x="125" y="608" class="small">The same identities let a response wake the right warp and let the report retain mechanism-local frontiers.</text><rect x="330" y="700" width="1050" height="100" rx="18" fill="#fff4e8" stroke="#efd3a5"/><text x="360" y="740" class="panel" style="font-size:20px">Observation-only branch</text><text x="360" y="775" class="body">raw NCU CSV → strict parser → ncu_observation → comparator</text><text x="1100" y="775" class="body" fill="#bd4c50">✕ never a replay input</text><path d="M1310,430 L850,695" fill="none" stroke="#e56d50" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrCoral)"/><text x="95" y="665" class="small">Legend</text><rect x="95" y="685" width="180" height="34" rx="8" fill="#159b9c"/><text x="185" y="708" class="white" text-anchor="middle">modeled path</text><rect x="95" y="730" width="180" height="34" rx="8" fill="#e56d50"/><text x="185" y="753" class="white" text-anchor="middle">observed branch</text><rect x="58" y="875" width="1684" height="112" rx="12" fill="#e6eef8" stroke="#c7d6e8"/><text x="80" y="906" class="caption"><tspan font-weight="700">Caption.</tspan> Numbered stages make the simulator’s contribution inspectable: concrete trace artifacts are normalized, scheduled, serviced, and emitted as separate</text><text x="80" y="929" class="caption">frontiers; NCU is joined only after replay.</text><text x="80" y="957" class="tiny">Source: sim/trace, sim/sm, sim/mem, sim/direct_run/src/ncu.rs; uPIMulator HPCA’24 and Centauri ASPLOS’24 figure grammar.</text></svg>