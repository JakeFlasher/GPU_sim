<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-labelledby="title desc">
<title id="title">Native replay architecture and dataflow</title><desc id="desc">Concrete artifacts flow through sim-trace, sim-sm, sim-engine, sim-mem, and sim-run; NCU remains a one-way post-replay branch.</desc>
<defs><marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#1769AA"/></marker><marker id="arrowCoral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#D95D39"/></marker></defs>
<rect width="1800" height="1050" fill="white"/><text x="72" y="65" text-anchor="start" style="font-family:Georgia;font-size:38px;font-weight:700;fill:#14233B;">Native replay architecture and dataflow</text><text x="74" y="100" text-anchor="start" style="font-family:Arial;font-size:19px;font-weight:400;fill:#52657A;">The simulator is a connected pipeline, not a collection of independent counters.</text><rect x="65" y="155" width="340" height="650" rx="20" fill="#EAF4FC" stroke="#1769AA" stroke-width="2.5"/><text x="92" y="198" text-anchor="start" style="font-family:Arial;font-size:22px;font-weight:700;fill:#1769AA;">INPUT ARTIFACTS</text><text x="92" y="230" text-anchor="start" style="font-family:Arial;font-size:16px;font-weight:400;fill:#52657A;font-style:italic;">captured once; never regenerated by replay</text><rect x="92" y="275" width="285" height="82" rx="13" fill="white" stroke="#56B4E9" stroke-width="2"/><circle cx="115" cy="300" r="10" fill="#56B4E9" stroke="none" stroke-width="0"/><text x="137" y="307" text-anchor="start" style="font-family:Arial;font-size:18px;font-weight:700;fill:#14233B;">CUDA / SASS workload</text><text x="115" y="335" text-anchor="start" style="font-family:Arial;font-size:14px;font-weight:400;fill:#52657A;">real kernel binary + launch roster</text><rect x="92" y="395" width="285" height="82" rx="13" fill="white" stroke="#008F82" stroke-width="2"/><circle cx="115" cy="420" r="10" fill="#008F82" stroke="none" stroke-width="0"/><text x="137" y="427" text-anchor="start" style="font-family:Arial;font-size:18px;font-weight:700;fill:#14233B;">dynamic_trace.pb</text><text x="115" y="455" text-anchor="start" style="font-family:Arial;font-size:14px;font-weight:400;fill:#52657A;">PC • masks • lane addresses • placement</text><rect x="92" y="515" width="285" height="82" rx="13" fill="white" stroke="#7356A5" stroke-width="2"/><circle cx="115" cy="540" r="10" fill="#7356A5" stroke="none" stroke-width="0"/><text x="137" y="547" text-anchor="start" style="font-family:Arial;font-size:18px;font-weight:700;fill:#14233B;">SASS control sidecar</text><text x="115" y="575" text-anchor="start" style="font-family:Arial;font-size:14px;font-weight:400;fill:#52657A;">stall • yield • barriers • reuse</text><rect x="92" y="635" width="285" height="82" rx="13" fill="white" stroke="#E29B22" stroke-width="2"/><circle cx="115" cy="660" r="10" fill="#E29B22" stroke="none" stroke-width="0"/><text x="137" y="667" text-anchor="start" style="font-family:Arial;font-size:18px;font-weight:700;fill:#14233B;">SM86 / SM120 card</text><text x="115" y="695" text-anchor="start" style="font-family:Arial;font-size:14px;font-weight:400;fill:#52657A;">geometry • latency • typed assumptions</text><rect x="465" y="155" width="960" height="650" rx="20" fill="#E7F6F2" stroke="#008F82" stroke-width="2.5"/><text x="495" y="198" text-anchor="start" style="font-family:Arial;font-size:22px;font-weight:700;fill:#008F82;">CONNECTED NATIVE REPLAY</text><text x="495" y="230" text-anchor="start" style="font-family:Arial;font-size:16px;font-weight:400;fill:#52657A;font-style:italic;">identity and causal state remain visible across stages</text><rect x="495" y="330" width="195" height="140" rx="15" fill="white" stroke="#1769AA" stroke-width="2.5"/><circle cx="523" cy="362" r="14" fill="#1769AA" stroke="none" stroke-width="0"/><text x="523" y="368" text-anchor="middle" style="font-family:Arial;font-size:16px;font-weight:700;fill:white;">1</text><text x="517" y="410" text-anchor="start" style="font-family:Arial;font-size:20px;font-weight:700;fill:#14233B;">sim-trace</text><text x="517" y="442" text-anchor="start" style="font-family:Arial;font-size:14px;font-weight:400;fill:#52657A;">decode + canonical join</text><line x1="690" y1="400" x2="720" y2="400" stroke="#1769AA" stroke-width="4" marker-end="url(#arrowBlue)"/><rect x="720" y="330" width="195" height="140" rx="15" fill="white" stroke="#7356A5" stroke-width="2.5"/><circle cx="748" cy="362" r="14" fill="#7356A5" stroke="none" stroke-width="0"/><text x="748" y="368" text-anchor="middle" style="font-family:Arial;font-size:16px;font-weight:700;fill:white;">2</text><text x="742" y="410" text-anchor="start" style="font-family:Arial;font-size:20px;font-weight:700;fill:#14233B;">sim-sm</text><text x="742" y="442" text-anchor="start" style="font-family:Arial;font-size:14px;font-weight:400;fill:#52657A;">issue + readiness + barriers</text><line x1="915" y1="400" x2="945" y2="400" stroke="#1769AA" stroke-width="4" marker-end="url(#arrowBlue)"/><rect x="945" y="330" width="195" height="140" rx="15" fill="white" stroke="#D95D39" stroke-width="2.5"/><circle cx="973" cy="362" r="14" fill="#D95D39" stroke="none" stroke-width="0"/><text x="973" y="368" text-anchor="middle" style="font-family:Arial;font-size:16px;font-weight:700;fill:white;">3</text><text x="967" y="410" text-anchor="start" style="font-family:Arial;font-size:20px;font-weight:700;fill:#14233B;">sim-engine</text><text x="967" y="442" text-anchor="start" style="font-family:Arial;font-size:14px;font-weight:400;fill:#52657A;">deterministic event queue</text><line x1="1140" y1="400" x2="1170" y2="400" stroke="#1769AA" stroke-width="4" marker-end="url(#arrowBlue)"/><rect x="1170" y="330" width="195" height="140" rx="15" fill="white" stroke="#E29B22" stroke-width="2.5"/><circle cx="1198" cy="362" r="14" fill="#E29B22" stroke="none" stroke-width="0"/><text x="1198" y="368" text-anchor="middle" style="font-family:Arial;font-size:16px;font-weight:700;fill:white;">4</text><text x="1192" y="410" text-anchor="start" style="font-family:Arial;font-size:20px;font-weight:700;fill:#14233B;">sim-mem</text><text x="1192" y="442" text-anchor="start" style="font-family:Arial;font-size:14px;font-weight:400;fill:#52657A;">sectored L1 → L2 → service</text><path d="M1030 470 C1030 555 815 555 815 470" stroke="#008F82" stroke-width="3" fill="none" stroke-dasharray="9 7" marker-end="url(#arrowBlue)"/><text x="925" y="585" text-anchor="middle" style="font-family:Arial;font-size:15px;font-weight:700;fill:#008F82;">SM wake-up ↔ memory response</text><rect x="600" y="650" width="690" height="80" rx="14" fill="#008F82" stroke="#008F82" stroke-width="1"/><text x="945" y="685" text-anchor="middle" style="font-family:Arial;font-size:18px;font-weight:700;fill:white;">warp identity • line/sector masks • event sequence</text><text x="945" y="712" text-anchor="middle" style="font-family:Arial;font-size:15px;font-weight:400;fill:white;">carried across the entire replay</text><rect x="1485" y="155" width="250" height="650" rx="20" fill="#FFF3D9" stroke="#E29B22" stroke-width="2.5"/><text x="1510" y="198" text-anchor="start" style="font-family:Arial;font-size:22px;font-weight:700;fill:#E29B22;">OUTPUTS</text><text x="1510" y="230" text-anchor="start" style="font-family:Arial;font-size:16px;font-weight:400;fill:#52657A;font-style:italic;">post-replay evidence</text><rect x="1515" y="295" width="190" height="82" rx="13" fill="white" stroke="#2C9362" stroke-width="2"/><text x="1530" y="327" text-anchor="start" style="font-family:Arial;font-size:17px;font-weight:700;fill:#14233B;">sim-run JSONL</text><text x="1530" y="355" text-anchor="start" style="font-family:Arial;font-size:14px;font-weight:400;fill:#52657A;">counters + predictions</text><rect x="1515" y="425" width="190" height="82" rx="13" fill="white" stroke="#7356A5" stroke-width="2"/><text x="1530" y="457" text-anchor="start" style="font-family:Arial;font-size:17px;font-weight:700;fill:#14233B;">frontier ledger</text><text x="1530" y="485" text-anchor="start" style="font-family:Arial;font-size:14px;font-weight:400;fill:#52657A;">issue • completion • tails</text><rect x="1515" y="555" width="190" height="82" rx="13" fill="white" stroke="#D95D39" stroke-width="2"/><text x="1530" y="587" text-anchor="start" style="font-family:Arial;font-size:17px;font-weight:700;fill:#14233B;">NCU comparator</text><text x="1530" y="615" text-anchor="start" style="font-family:Arial;font-size:14px;font-weight:400;fill:#52657A;">directory + launch join</text><rect x="1515" y="685" width="190" height="82" rx="13" fill="white" stroke="#1769AA" stroke-width="2"/><text x="1530" y="717" text-anchor="start" style="font-family:Arial;font-size:17px;font-weight:700;fill:#14233B;">reports</text><text x="1530" y="745" text-anchor="start" style="font-family:Arial;font-size:14px;font-weight:400;fill:#52657A;">MAPE + future-work gaps</text><path d="M1425 400 L1485 400" stroke="#1769AA" stroke-width="4" fill="none" marker-end="url(#arrowBlue)"/><path d="M1425 610 C1460 610 1460 590 1515 590" stroke="#D95D39" stroke-width="3" fill="none" stroke-dasharray="9 7" marker-end="url(#arrowCoral)"/><text x="1460" y="548" text-anchor="middle" style="font-family:Arial;font-size:14px;font-weight:700;fill:#D95D39;">one-way observation</text><rect x="55" y="930" width="1690" height="88" rx="12" fill="#EEF4FA" stroke="#C9D9EA" stroke-width="1.5"/><text x="78" y="960" text-anchor="start" style="font-family:Arial;font-size:16px;font-weight:700;fill:#14233B;">Caption.</text><text x="176" y="960" text-anchor="start" style="font-family:Arial;font-size:16px;font-weight:400;fill:#14233B;">The native path connects trace identity, scheduling, event ordering, memory state, and report emission. NCU enters only after replay; no profiler value is allowed to alter the modeled path.</text><text x="78" y="988" text-anchor="start" style="font-family:Arial;font-size:13px;font-weight:400;fill:#52657A;">Source: docs/ARCHITECTURE.md, docs/COMPONENTS.md, sim/trace, sim/sm, sim/engine, sim/mem, and sim/direct_run.</text></svg>