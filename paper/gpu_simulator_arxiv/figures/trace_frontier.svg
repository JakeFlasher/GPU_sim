<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc"><title id="title">A worked causal replay path for one traced warp</title><desc id="desc">Flagship figure: concrete trace tokens become ordered memory events and remain separate from profiler observations.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fcfdff"/><stop offset="1" stop-color="#edf3fa"/></linearGradient><linearGradient id="hero" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#18345d"/><stop offset="1" stop-color="#2e639f"/></linearGradient><linearGradient id="teal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f7f87"/><stop offset="1" stop-color="#29b5a5"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#203b5f" flood-opacity=".16"/></filter><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#3468ad"/></marker><marker id="arrCoral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#e56d50"/></marker><style>.title{font:700 38px Georgia,serif;fill:#15253f}.sub{font:18px Arial,sans-serif;fill:#5d6b80}.panel{font:700 23px Arial,sans-serif;fill:#15253f}.body{font:17px Arial,sans-serif;fill:#15253f}.small{font:14px Arial,sans-serif;fill:#5d6b80}.tiny{font:12px Arial,sans-serif;fill:#5d6b80}.white{font:16px Arial,sans-serif;fill:#fff}.legend{font:14px Arial,sans-serif;fill:#15253f}.caption{font:16px Arial,sans-serif;fill:#15253f}</style></defs><rect width="1800" height="1000" fill="#ffffff"/><text x="72" y="68" class="title">A traced warp becomes a causal event path</text><text x="74" y="101" class="sub">One worked slice exposes information that a generic architecture block cannot show</text><rect x="60" y="145" width="520" height="700" rx="18" fill="#ffffff" stroke="#d6e0ec" stroke-width="2"/><text x="84" y="185" class="panel">(a) Observed trace + static control</text><text x="92" y="220" class="panel">warp 07 • block 12 • SM 3 • SMSP 2</text><text x="92" y="255" class="small">one record = one warp instruction (32 lanes max)</text><text x="95" y="305" class="small">record</text><text x="270" y="305" class="small">SASS / pipe</text><text x="420" y="305" class="small">lane evidence</text><rect x="92" y="330" width="455" height="72" rx="12" fill="#f7fafc" stroke="#d6e0ec"/><rect x="108" y="344" width="50" height="44" rx="8" fill="#159b9c"/><text x="133" y="372" class="white" text-anchor="middle">r₁</text><text x="185" y="363" class="body">LDG.E</text><text x="185" y="386" class="small">mask 0xffff • S0–S3</text><rect x="92" y="430" width="455" height="72" rx="12" fill="#f7fafc" stroke="#d6e0ec"/><rect x="108" y="444" width="50" height="44" rx="8" fill="#7258a6"/><text x="133" y="472" class="white" text-anchor="middle">r₂</text><text x="185" y="463" class="body">HMMA</text><text x="185" y="486" class="small">tensor • no memory</text><rect x="92" y="530" width="455" height="72" rx="12" fill="#f7fafc" stroke="#d6e0ec"/><rect x="108" y="544" width="50" height="44" rx="8" fill="#e56d50"/><text x="133" y="572" class="white" text-anchor="middle">r₃</text><text x="185" y="563" class="body">STG.E</text><text x="185" y="586" class="small">mask 0x0fff • S4–S5</text><rect x="92" y="650" width="455" height="110" rx="14" fill="#fff4e8" stroke="#efd3a5"/><text x="115" y="685" class="panel" style="font-size:18px">SASS control word</text><text x="115" y="718" class="body">stall 4  •  yield 0  •  wait mask 0</text><text x="115" y="745" class="small">read/write barriers + reuse bits are joined by PC</text><path d="M580,390 L650,390" fill="none" stroke="#3468ad" stroke-width="3" marker-end="url(#arr)"/><path d="M580,490 L650,490" fill="none" stroke="#3468ad" stroke-width="3" marker-end="url(#arr)"/><path d="M580,590 L650,590" fill="none" stroke="#e56d50" stroke-width="3" marker-end="url(#arrCoral)"/><rect x="650" y="145" width="560" height="700" rx="18" fill="#ffffff" stroke="#d6e0ec" stroke-width="2"/><text x="674" y="185" class="panel">(b) Next-event causal path</text><text x="680" y="220" class="small">same line fill merges two requests before DRAM</text><rect x="700" y="330" width="92" height="64" rx="10" fill="#3468ad"/><text x="746" y="357" class="white" text-anchor="middle">① issue</text><text x="746" y="379" class="white" text-anchor="middle">cycle 0</text><path d="M792,362 L805,362" fill="none" stroke="#3468ad" stroke-width="3" marker-end="url(#arr)"/><rect x="805" y="330" width="92" height="64" rx="10" fill="#159b9c"/><text x="851" y="357" class="white" text-anchor="middle">② L1 lookup</text><text x="851" y="379" class="white" text-anchor="middle">cycle +1</text><path d="M897,362 L910,362" fill="none" stroke="#3468ad" stroke-width="3" marker-end="url(#arr)"/><rect x="910" y="330" width="92" height="64" rx="10" fill="#7258a6"/><text x="956" y="357" class="white" text-anchor="middle">③ L2 miss</text><text x="956" y="379" class="white" text-anchor="middle">cycle +2</text><path d="M1002,362 L1015,362" fill="none" stroke="#3468ad" stroke-width="3" marker-end="url(#arr)"/><rect x="1015" y="330" width="92" height="64" rx="10" fill="#e56d50"/><text x="1061" y="357" class="white" text-anchor="middle">④ DRAM burst</text><text x="1061" y="379" class="white" text-anchor="middle">cycle +48</text><path d="M1107,362 L1120,362" fill="none" stroke="#3468ad" stroke-width="3" marker-end="url(#arr)"/><rect x="1120" y="330" width="92" height="64" rx="10" fill="#2f9a69"/><text x="1166" y="357" class="white" text-anchor="middle">⑤ fill / wake</text><text x="1166" y="379" class="white" text-anchor="middle">cycle +96</text><path d="M760,510 C825,510 850,470 955,470" fill="none" stroke="#159b9c" stroke-width="4" stroke-dasharray="8 8" marker-end="url(#arr)"/><circle cx="760" cy="510" r="25" fill="#159b9c"/><text x="760" y="516" class="white" text-anchor="middle">r₃</text><text x="830" y="525" class="body">MSHR merge: one line fill</text><rect x="700" y="620" width="465" height="96" rx="14" fill="#edf5fb" stroke="#c3d8ed"/><text x="725" y="655" class="panel" style="font-size:18px">event-driven jump</text><text x="725" y="687" class="body">clock 1 → 48 without polling idle cycles</text><text x="725" y="712" class="small">causal order is retained; empty time is not simulated</text><rect x="700" y="750" width="465" height="64" rx="12" fill="#159b9c"/><text x="725" y="789" class="white">worked slice: 196,608 load sectors • 8,192 DRAM sectors</text><rect x="1280" y="145" width="460" height="700" rx="18" fill="#ffffff" stroke="#d6e0ec" stroke-width="2"/><text x="1304" y="185" class="panel">(c) Separate frontiers</text><text x="1310" y="220" class="panel">gemm_hmma_bf16_sm80 • SM86</text><text x="1310" y="252" class="small">post-merge simulator / fresh NCU medians</text><line x1="1450.0" y1="300" x2="1450.0" y2="650" stroke="#d6e0ec" stroke-dasharray="4 8"/><text x="1450.0" y="680" class="tiny" text-anchor="middle">0k</text><line x1="1485.7142857142858" y1="300" x2="1485.7142857142858" y2="650" stroke="#d6e0ec" stroke-dasharray="4 8"/><text x="1485.7142857142858" y="680" class="tiny" text-anchor="middle">2k</text><line x1="1521.4285714285713" y1="300" x2="1521.4285714285713" y2="650" stroke="#d6e0ec" stroke-dasharray="4 8"/><text x="1521.4285714285713" y="680" class="tiny" text-anchor="middle">4k</text><line x1="1557.142857142857" y1="300" x2="1557.142857142857" y2="650" stroke="#d6e0ec" stroke-dasharray="4 8"/><text x="1557.142857142857" y="680" class="tiny" text-anchor="middle">6k</text><line x1="1592.857142857143" y1="300" x2="1592.857142857143" y2="650" stroke="#d6e0ec" stroke-dasharray="4 8"/><text x="1592.857142857143" y="680" class="tiny" text-anchor="middle">8k</text><line x1="1628.5714285714287" y1="300" x2="1628.5714285714287" y2="650" stroke="#d6e0ec" stroke-dasharray="4 8"/><text x="1628.5714285714287" y="680" class="tiny" text-anchor="middle">10k</text><line x1="1664.2857142857142" y1="300" x2="1664.2857142857142" y2="650" stroke="#d6e0ec" stroke-dasharray="4 8"/><text x="1664.2857142857142" y="680" class="tiny" text-anchor="middle">12k</text><line x1="1700.0" y1="300" x2="1700.0" y2="650" stroke="#d6e0ec" stroke-dasharray="4 8"/><text x="1700.0" y="680" class="tiny" text-anchor="middle">14k</text><line x1="1450" y1="335" x2="1648.0357142857142" y2="335" stroke="#3468ad" stroke-width="14" stroke-linecap="round"/><circle cx="1648.0357142857142" cy="335" r="10" fill="#3468ad"/><text x="1310" y="340" class="small">issue frontier</text><text x="1664.0357142857142" y="340" class="body">11,090</text><line x1="1450" y1="407" x2="1648.232142857143" y2="407" stroke="#159b9c" stroke-width="14" stroke-linecap="round"/><circle cx="1648.232142857143" cy="407" r="10" fill="#159b9c"/><text x="1310" y="412" class="small">modeled completion</text><text x="1664.232142857143" y="412" class="body">11,101</text><line x1="1450" y1="479" x2="1661.767857142857" y2="479" stroke="#e4ad3d" stroke-width="14" stroke-linecap="round"/><circle cx="1661.767857142857" cy="479" r="10" fill="#e4ad3d"/><text x="1310" y="484" class="small">NCU SM-active</text><text x="1677.767857142857" y="484" class="body">11,859</text><line x1="1450" y1="551" x2="1693.625" y2="551" stroke="#e56d50" stroke-width="14" stroke-linecap="round"/><circle cx="1693.625" cy="551" r="10" fill="#e56d50"/><text x="1310" y="556" class="small">NCU GPC median</text><text x="1709.625" y="556" class="body">13,643</text><rect x="1310" y="680" width="400" height="110" rx="14" fill="#f9e7e7" stroke="#eabcbc"/><text x="1335" y="715" class="panel" style="font-size:18px">typed tail boundary</text><text x="1335" y="747" class="body">coherence • dirty writeback</text><text x="1335" y="772" class="small">not silently folded into elapsed time</text><text x="90" y="838" class="small">Legend</text><rect x="90" y="858" width="22" height="14" rx="4" fill="#159b9c"/><text x="120" y="870" class="legend">trace/data</text><rect x="245" y="858" width="22" height="14" rx="4" fill="#3468ad"/><text x="275" y="870" class="legend">modeled event</text><rect x="410" y="858" width="22" height="14" rx="4" fill="#e4ad3d"/><text x="440" y="870" class="legend">hardware observation</text><rect x="610" y="858" width="22" height="14" rx="4" fill="#e56d50"/><text x="640" y="870" class="legend">typed / diagnostic</text><rect x="58" y="875" width="1684" height="112" rx="12" fill="#e6eef8" stroke="#c7d6e8"/><text x="80" y="906" class="caption"><tspan font-weight="700">Caption.</tspan> Panels (a–c) follow one traced warp instruction through lane-aware decode, L1/L2/DRAM events, an MSHR merge, and separate issue/completion/observation</text><text x="80" y="929" class="caption">frontiers. Numbers are the SM86 gemm_hmma_bf16_sm80 campaign row; the event slice is illustrative and does not invent a cycle-accuracy claim.</text><text x="80" y="957" class="tiny">Source: Post-merge SM86 campaign manifests; sim-trace/sim-sm/sim-mem; docs/postmerge_campaign_comparison_20260909.md.</text></svg>