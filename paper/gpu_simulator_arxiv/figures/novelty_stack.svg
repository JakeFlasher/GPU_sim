<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-labelledby="title desc">
<title id="title">The contribution is a trace-to-frontier evidence contract</title><desc id="desc">Dynamic evidence, causal replay, and independent NCU authority are connected without collapsing their semantics.</desc>
<defs><marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#1769AA"/></marker><marker id="arrowCoral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#D95D39"/></marker></defs>
<rect width="1800" height="1050" fill="white"/><text x="72" y="65" text-anchor="start" style="font-family:Georgia;font-size:38px;font-weight:700;fill:#14233B;">The contribution is a trace-to-frontier evidence contract</text><text x="74" y="100" text-anchor="start" style="font-family:Arial;font-size:19px;font-weight:400;fill:#52657A;">Inherited ingredients are explicit; the integration and full-corpus denominator are the contribution.</text><rect x="65" y="145" width="470" height="700" rx="20" fill="#EAF4FC" stroke="#1769AA" stroke-width="2.5"/><text x="92" y="190" text-anchor="start" style="font-family:Arial;font-size:22px;font-weight:700;fill:#1769AA;">01  OBSERVED EVIDENCE</text><text x="92" y="222" text-anchor="start" style="font-family:Arial;font-size:16px;font-weight:400;fill:#52657A;font-style:italic;">what the recorder actually knows</text><rect x="92" y="270" width="410" height="110" rx="14" fill="white" stroke="#56B4E9" stroke-width="2"/><circle cx="119" cy="298" r="11" fill="#56B4E9" stroke="none" stroke-width="0"/><text x="142" y="305" text-anchor="start" style="font-family:Arial;font-size:21px;font-weight:700;fill:#14233B;">dynamic_trace.pb</text><text x="120" y="342" text-anchor="start" style="font-family:Arial;font-size:16px;font-weight:400;fill:#52657A;">PC • masks • lane sectors • placement</text><rect x="92" y="420" width="410" height="110" rx="14" fill="white" stroke="#7356A5" stroke-width="2"/><circle cx="119" cy="448" r="11" fill="#7356A5" stroke="none" stroke-width="0"/><text x="142" y="455" text-anchor="start" style="font-family:Arial;font-size:21px;font-weight:700;fill:#14233B;">SASS control sidecar</text><text x="120" y="492" text-anchor="start" style="font-family:Arial;font-size:16px;font-weight:400;fill:#52657A;">stall/yield • barriers • wait masks • forms</text><rect x="92" y="570" width="410" height="110" rx="14" fill="white" stroke="#E29B22" stroke-width="2"/><circle cx="119" cy="598" r="11" fill="#E29B22" stroke="none" stroke-width="0"/><text x="142" y="605" text-anchor="start" style="font-family:Arial;font-size:21px;font-weight:700;fill:#14233B;">architecture card</text><text x="120" y="642" text-anchor="start" style="font-family:Arial;font-size:16px;font-weight:400;fill:#52657A;">geometry • latency • typed assumptions</text><text x="92" y="760" text-anchor="start" style="font-family:Arial;font-size:18px;font-weight:700;fill:#1769AA;">Identity-preserving join</text><text x="92" y="790" text-anchor="start" style="font-family:Arial;font-size:16px;font-weight:400;fill:#52657A;">function + PC + warp + launch</text><path d="M535 500 C585 500 585 500 640 500" stroke="#1769AA" stroke-width="4" fill="none" marker-end="url(#arrowBlue)"/><rect x="640" y="145" width="530" height="700" rx="20" fill="#E7F6F2" stroke="#008F82" stroke-width="2.5"/><text x="670" y="190" text-anchor="start" style="font-family:Arial;font-size:22px;font-weight:700;fill:#008F82;">02  CAUSAL REPLAY</text><text x="670" y="222" text-anchor="start" style="font-family:Arial;font-size:16px;font-weight:400;fill:#52657A;font-style:italic;">what the simulator contributes</text><rect x="685" y="280" width="440" height="82" rx="14" fill="white" stroke="#1769AA" stroke-width="2"/><circle cx="714" cy="308" r="14" fill="#1769AA" stroke="none" stroke-width="0"/><text x="714" y="314" text-anchor="middle" style="font-family:Arial;font-size:16px;font-weight:700;fill:white;">1</text><text x="743" y="312" text-anchor="start" style="font-family:Arial;font-size:20px;font-weight:700;fill:#14233B;">canonicalize</text><text x="743" y="341" text-anchor="start" style="font-family:Arial;font-size:15px;font-weight:400;fill:#52657A;">warp records + static control</text><line x1="905" y1="362" x2="905" y2="390" stroke="#008F82" stroke-width="3" marker-end="url(#arrowBlue)"/><rect x="685" y="390" width="440" height="82" rx="14" fill="white" stroke="#7356A5" stroke-width="2"/><circle cx="714" cy="418" r="14" fill="#7356A5" stroke="none" stroke-width="0"/><text x="714" y="424" text-anchor="middle" style="font-family:Arial;font-size:16px;font-weight:700;fill:white;">2</text><text x="743" y="422" text-anchor="start" style="font-family:Arial;font-size:20px;font-weight:700;fill:#14233B;">issue + wake</text><text x="743" y="451" text-anchor="start" style="font-family:Arial;font-size:15px;font-weight:400;fill:#52657A;">4 SMSP partitions • dependencies</text><line x1="905" y1="472" x2="905" y2="500" stroke="#008F82" stroke-width="3" marker-end="url(#arrowBlue)"/><rect x="685" y="500" width="440" height="82" rx="14" fill="white" stroke="#D95D39" stroke-width="2"/><circle cx="714" cy="528" r="14" fill="#D95D39" stroke="none" stroke-width="0"/><text x="714" y="534" text-anchor="middle" style="font-family:Arial;font-size:16px;font-weight:700;fill:white;">3</text><text x="743" y="532" text-anchor="start" style="font-family:Arial;font-size:20px;font-weight:700;fill:#14233B;">sector hierarchy</text><text x="743" y="561" text-anchor="start" style="font-family:Arial;font-size:15px;font-weight:400;fill:#52657A;">L1 → shared L2 → service envelope</text><line x1="905" y1="582" x2="905" y2="610" stroke="#008F82" stroke-width="3" marker-end="url(#arrowBlue)"/><rect x="685" y="610" width="440" height="82" rx="14" fill="white" stroke="#E29B22" stroke-width="2"/><circle cx="714" cy="638" r="14" fill="#E29B22" stroke="none" stroke-width="0"/><text x="714" y="644" text-anchor="middle" style="font-family:Arial;font-size:16px;font-weight:700;fill:white;">4</text><text x="743" y="642" text-anchor="start" style="font-family:Arial;font-size:20px;font-weight:700;fill:#14233B;">frontier ledger</text><text x="743" y="671" text-anchor="start" style="font-family:Arial;font-size:15px;font-weight:400;fill:#52657A;">issue ≠ completion ≠ observation ≠ tail</text><rect x="685" y="750" width="440" height="58" rx="12" fill="#008F82" stroke="#008F82" stroke-width="1"/><text x="905" y="787" text-anchor="middle" style="font-family:Arial;font-size:18px;font-weight:700;fill:white;">deterministic next-event order</text><rect x="1260" y="145" width="475" height="700" rx="20" fill="#FFF3D9" stroke="#E29B22" stroke-width="2.5"/><text x="1290" y="190" text-anchor="start" style="font-family:Arial;font-size:22px;font-weight:700;fill:#E29B22;">03  INDEPENDENT AUTHORITY</text><text x="1290" y="222" text-anchor="start" style="font-family:Arial;font-size:16px;font-weight:400;fill:#52657A;font-style:italic;">what is measured after replay</text><rect x="1290" y="280" width="415" height="100" rx="14" fill="white" stroke="#2C9362" stroke-width="2"/><text x="1318" y="318" text-anchor="start" style="font-family:Arial;font-size:21px;font-weight:700;fill:#14233B;">NCU profile directory</text><text x="1318" y="350" text-anchor="start" style="font-family:Arial;font-size:15px;font-weight:400;fill:#52657A;">same capture identity • renamed kernel safe</text><rect x="1290" y="420" width="415" height="100" rx="14" fill="white" stroke="#E29B22" stroke-width="2"/><text x="1318" y="458" text-anchor="start" style="font-family:Arial;font-size:21px;font-weight:700;fill:#14233B;">launch-order fallback</text><text x="1318" y="490" text-anchor="start" style="font-family:Arial;font-size:15px;font-weight:400;fill:#52657A;">98 exact + 11,460 ordered SM120 joins</text><rect x="1290" y="560" width="415" height="100" rx="14" fill="white" stroke="#B94652" stroke-width="2"/><text x="1318" y="598" text-anchor="start" style="font-family:Arial;font-size:21px;font-weight:700;fill:#14233B;">metric decision</text><text x="1318" y="630" text-anchor="start" style="font-family:Arial;font-size:15px;font-weight:400;fill:#52657A;">≤15% headline • &gt;15% future work</text><path d="M1170 470 C1210 470 1210 330 1290 330" stroke="#D95D39" stroke-width="4" fill="none" stroke-dasharray="10 8" marker-end="url(#arrowCoral)"/><text x="1190" y="300" text-anchor="middle" style="font-family:Arial;font-size:15px;font-weight:700;fill:#D95D39;">observation-only</text><rect x="65" y="865" width="1670" height="48" rx="10" fill="#FDECE7" stroke="#D95D39" stroke-width="1.5"/><text x="900" y="897" text-anchor="middle" style="font-family:Arial;font-size:17px;font-weight:700;fill:#D95D39;">Novelty boundary: not first SASS tracing • not first event simulation • not proprietary RTL recovery</text><rect x="55" y="930" width="1690" height="88" rx="12" fill="#EEF4FA" stroke="#C9D9EA" stroke-width="1.5"/><text x="78" y="960" text-anchor="start" style="font-family:Arial;font-size:16px;font-weight:700;fill:#14233B;">Caption.</text><text x="176" y="960" text-anchor="start" style="font-family:Arial;font-size:16px;font-weight:400;fill:#14233B;">Dynamic records, static controls, sector state, named frontiers, and independent NCU joins form one inspectable contract. Inherited mechanisms are labeled rather than rebranded as new.</text><text x="78" y="988" text-anchor="start" style="font-family:Arial;font-size:13px;font-weight:400;fill:#52657A;">Source: simulator crates, corrected 286/339 full-corpus joins, and SOTA audit in GPU_sims_notes.</text></svg>