# sm_120 L2 cohort expansion roster — frozen Round 0.
#
# Pinned 30 primary + 10 replacement (slug, shape_point) candidates
# for the sm_120 L2 cohort expansion loop. Frozen BEFORE any NCU
# measurement runs; all downstream rounds verify the commit SHA + the
# SHA256 of this file against the Round 0 contract before any sweep
# starts.
#
# Schema invariants (enforced by
# tools/local_labels/sm120_cohort_roster_validator.py):
#   - Exactly 30 rows with split in {calibration, validation, holdout};
#     exactly 10 rows with split = "replacement".
#   - Primary split counts: 15 / 8 / 7 (calibration / validation /
#     holdout). Each split contains >=1 row from each of memory_stress,
#     tensor_compute, activation_norm.
#   - Family-bucket distribution among primary: <=35% per bucket
#     (i.e. <=10 of 30); >=6 each in the three required buckets.
#   - Every row's family has a matching family_bucket per
#     data/local_labels/sm120_cohort_family_buckets.toml.
#   - level == "L2" on every cohort row. The cohort IS L2; source rows
#     with level=="L1" are admitted to the cohort under the cohort-row
#     level reading of AC-2.1 because the resulting NCU measurement
#     reports L2 cache_layer via the trace_l2_accuracy_xl shape.
#   - arch_gate includes "sm_120" on every row.
#
# Sourcing summary:
#   - 6 simbench_bw L1 microbenches in memory_stress (level=L1 in
#     source, level=L2 in cohort): dram_stream_stride_mix,
#     carveout_sensitivity_probe, l2_persisting_window_sweep,
#     l2_prefetch_hint_sweep, working_set_capacity_sweep,
#     warm_cold_pair_relaunch — all already-buildable on this host.
#   - 15 portable_lcd kernels across all three required buckets, with
#     up to 4 shape_points per kernel (correctness_shape, timing_shape,
#     trace_l2_accuracy_lg, trace_l2_accuracy_xl) handled by
#     workloads/portable_lcd/runner_common.h.
#
# Replacement pool semantics: a primary row that fails the AC-2.5
# buildability preflight or the AC-3 NCU sweep with a typed exclusion
# may be substituted with a replacement row from the same family_bucket;
# the substitution is logged in the round summary and counts as a
# typed-excluded primary cell (NOT a silent relaxation).

schema_version = 1

# ---------------------------------------------------------------------
# PRIMARY 30
# ---------------------------------------------------------------------

