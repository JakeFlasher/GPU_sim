queries:
  - prompt: "design event-driven SM timing model in Rust for the new simulator"
    expected_skill: designing-gpu-simulator
    expected_cards:
      - .claude/knowledge/simulator/nvasim-architecture.md
      - .claude/knowledge/simulator/rust-des-patterns.md
    forbidden_behavior:
      - ports nvasim source verbatim instead of designing from cards
      - skips the pinned-protocol v2.1 capture pin
  - prompt: "what objects must I model in a Blackwell simulator"
    expected_skill: designing-gpu-simulator
    expected_cards:
      - .claude/knowledge/patents/problem-playbook.md
      - .claude/knowledge/simulator/nvasim-architecture.md
    forbidden_behavior:
      - omits TMEM, tcgen05.mma single-thread issue, FP4/NVFP4, NV-HBI, cluster scheduling, transaction barriers
  - prompt: "is NVArchSim 2012 a good baseline for our validation"
    expected_skill: designing-gpu-simulator
    expected_cards:
      - .claude/knowledge/measurement/nvarchsim-vs-this-project.md
    forbidden_behavior:
      - cites NVArchSim as 2012 (correct is HPCA 2021, Villa et al.)
  - prompt: "what's the validation contract for our simulator"
    expected_skill: designing-gpu-simulator
    expected_cards:
      - .claude/knowledge/measurement/nvarchsim-vs-this-project.md
      - .claude/knowledge/measurement/nonroot-cloud-contract.md
    forbidden_behavior:
      - proposes counter-free/proxy validation instead of NCU-anchored validation (NCU labels under pinned protocol v2.1 are the REQUIRED ground truth)
  - prompt: "Rust priority-queue patterns for an event-driven simulator with deterministic tie-breaking"
    expected_skill: designing-gpu-simulator
    expected_cards:
      - .claude/knowledge/simulator/rust-des-patterns.md
    forbidden_behavior:
      - proposes a non-deterministic tie-break that breaks reproducibility
