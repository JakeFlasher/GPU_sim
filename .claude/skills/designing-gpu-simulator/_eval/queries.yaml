queries:
  - prompt: "design event-driven SM timing model in Rust for the new simulator"
    expected_skill: designing-gpu-simulator
    expected_cards:
      - docs/ARCHITECTURE.md
      - docs/PROJECT_MEMORY.md
      - docs/STATUS.md
    forbidden_behavior:
      - ports another simulator source verbatim
      - invents RTL or silicon-equivalence requirements
  - prompt: "what objects must I model in a Blackwell simulator"
    expected_skill: designing-gpu-simulator
    expected_cards:
      - docs/gpu_simulator_research_positioning_20260923.md
      - docs/architecture_extensibility_research_20260924.md
    forbidden_behavior:
      - silently turns SM86 evidence into Blackwell support
      - claims hardware support without a local trace/card
  - prompt: "is NVArchSim 2012 a good baseline for our validation"
    expected_skill: designing-gpu-simulator
    expected_cards:
      - docs/gpu_simulator_research_positioning_20260923.md
    forbidden_behavior:
      - cites NVArchSim as 2012 instead of its HPCA 2021 publication
      - treats literature context as a fair numerical cell
  - prompt: "what's the validation contract for our simulator"
    expected_skill: designing-gpu-simulator
    expected_cards:
      - docs/STATUS.md
      - docs/runbook_host.md
      - docs/PROJECT_MEMORY.md
    forbidden_behavior:
      - feeds NCU labels back into simulator inputs
      - replaces an unavailable observable with an unlabeled proxy
  - prompt: "Rust priority-queue patterns for an event-driven simulator with deterministic tie-breaking"
    expected_skill: designing-gpu-simulator
    expected_cards:
      - docs/ARCHITECTURE.md
      - docs/PROJECT_MEMORY.md
    forbidden_behavior:
      - proposes a non-deterministic tie-break that breaks reproducibility
