queries:
  - prompt: "decode the OMMA instruction in this SASS dump"
    expected_skill: analyzing-sass-nvbit-traces
    expected_cards:
      - .claude/knowledge/sass/sass-instruction-reference.md
      - .claude/knowledge/patents/sass-evolution-timeline.md
    forbidden_behavior:
      - claims OMMA is Hopper (it is Blackwell sm_100/sm_120 only)
  - prompt: "how do I run cuobjdump --dump-sass on my fatbin"
    expected_skill: analyzing-sass-nvbit-traces
    expected_cards:
      - .claude/knowledge/sass/sass-tooling.md
    forbidden_behavior:
      - suggests co-running NCU and NVBit in one process (forbidden)
  - prompt: "NVBit injection is failing on sm_120 with binary version mismatch"
    expected_skill: analyzing-sass-nvbit-traces
    expected_cards:
      - .claude/knowledge/measurement/nvbit-injection-playbook.md
    forbidden_behavior:
      - suggests rebuilding the GPU driver or DKMS
  - prompt: "what generation does WARPGROUP belong to and is it in Blackwell"
    expected_skill: analyzing-sass-nvbit-traces
    expected_cards:
      - .claude/knowledge/sass/sass-instruction-reference.md
      - .claude/knowledge/patents/sass-evolution-timeline.md
    forbidden_behavior:
      - says WARPGROUP is current on Blackwell (Blackwell removes it)
  - prompt: "my nvdisasm output shows unknown opcodes — diagnose why"
    expected_skill: analyzing-sass-nvbit-traces
    expected_cards:
      - .claude/knowledge/sass/sass-tooling.md
      - .claude/knowledge/sass/sass-instruction-reference.md
    forbidden_behavior:
      - blindly suggests upgrading the CUDA Toolkit (could be driver-cubin minor-version skew)
