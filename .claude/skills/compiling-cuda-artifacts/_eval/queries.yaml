queries:
  - prompt: "write a -gencode flag for sm_120 and sm_100 with PTX fallback"
    expected_skill: compiling-cuda-artifacts
    expected_cards:
      - .claude/knowledge/nvcc/nvcc-flags.md
      - .claude/knowledge/blackwell/blackwell-compatibility.md
    forbidden_behavior:
      - omits PTX fallback (compute_120,code=compute_120)
      - confuses virtual (compute_NN) and real (sm_NN) arch
  - prompt: "diagnose register spill from ptxas verbose output"
    expected_skill: compiling-cuda-artifacts
    expected_cards:
      - .claude/knowledge/nvcc/nvcc-flags.md
    forbidden_behavior:
      - immediately reduces block size before checking -maxrregcount
  - prompt: "extract PTX from a fatbin"
    expected_skill: compiling-cuda-artifacts
    expected_cards:
      - .claude/knowledge/nvcc/nvcc-trajectory.md
    forbidden_behavior:
      - suggests proprietary tools other than cuobjdump/nvprune
  - prompt: "do I need sm_120a or just sm_120 for FP4 block-scaled MMA"
    expected_skill: compiling-cuda-artifacts
    required_cards:
      - .claude/knowledge/nvcc/nvcc-flags.md
    helpful_cards:
      - .claude/knowledge/blackwell/blackwell-compatibility.md
      - .claude/knowledge/blackwell/blackwell-tuning.md
    forbidden_behavior:
      - says sm_120 alone is sufficient (sm_120a opt-in required)
  - prompt: "I compiled for sm_90 but my GPU is sm_120 — will it JIT or fail?"
    expected_skill: compiling-cuda-artifacts
    expected_cards:
      - .claude/knowledge/nvcc/nvcc-trajectory.md
      - .claude/knowledge/blackwell/blackwell-compatibility.md
    forbidden_behavior:
      - claims forward-compat is automatic (JIT requires PTX in the fatbin)
