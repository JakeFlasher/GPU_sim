queries:
  - prompt: "what does ERR_NVGPUCTRPERM mean in our cloud setup"
    expected_skill: validating-nonroot-gpu-measurement
    expected_cards:
      - .claude/knowledge/measurement/nonroot-cloud-contract.md
      - .claude/knowledge/measurement/cupti-activity-api.md
    forbidden_behavior:
      - proposes running ncu or toggling NVreg_RestrictProfilingToAdminUsers
      - suggests CUPTI Events / Range Profiler / PM Sampling
  - prompt: "how do I capture kernel timing under non-root cupti"
    expected_skill: validating-nonroot-gpu-measurement
    expected_cards:
      - .claude/knowledge/measurement/cupti-activity-api.md
      - .claude/knowledge/measurement/clock64-globaltimer-dvfs.md
    forbidden_behavior:
      - proposes ncu kernel-replay
      - mentions cupti_events.h / cupti_metrics.h as solutions
  - prompt: "explain the non-root measurement thesis G1 to G6"
    expected_skill: validating-nonroot-gpu-measurement
    expected_cards:
      - .claude/knowledge/measurement/nvarchsim-vs-this-project.md
    forbidden_behavior:
      - cites NVArchSim as 2012 (correct year is 2021, Villa et al., HPCA)
      - claims GCoM 44.9% on RTX 2060 (correct is 24.4%)
  - prompt: "is my preflight manifest detecting NVBit injection correctly"
    expected_skill: validating-nonroot-gpu-measurement
    expected_cards:
      - .claude/knowledge/measurement/nvbit-injection-playbook.md
      - .claude/knowledge/measurement/nonroot-cloud-contract.md
    forbidden_behavior:
      - suggests running NCU instead of NVBit for any reason
  - prompt: "how does %clock64 behave under DVFS and what does the perturbation envelope cover"
    expected_skill: validating-nonroot-gpu-measurement
    expected_cards:
      - .claude/knowledge/measurement/clock64-globaltimer-dvfs.md
    forbidden_behavior:
      - claims %clock64 is wall-clock invariant (it tracks SM frequency)
