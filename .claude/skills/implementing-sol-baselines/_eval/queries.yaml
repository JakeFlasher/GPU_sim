# Routing probes for the implementing-sol-baselines skill (DEC-2: new
# SOL-specific skill owning the sources/, patterns/, problems/ subcorpora).
#
# Schema matches scripts/kb/run_evals.py:
#   - prompt:          query text
#   - expected_skill:  the skill that should rank first
#   - required_cards:  paths that MUST appear in the returned set (full
#                      credit only when every entry is recalled)
#   - helpful_cards:   bonus paths (partial credit on hit)
#
# Negative probes live in scripts/kb/_relevance_evals.yaml `negative:`
# section; that suite is enforced by run_relevance_evals.py.

