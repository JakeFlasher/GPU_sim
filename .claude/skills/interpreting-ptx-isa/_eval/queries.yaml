queries:
  - prompt: "what does cp.async.bulk.tensor.5d look like syntactically"
    expected_skill: interpreting-ptx-isa
    expected_cards:
      - .claude/knowledge/ptx/ptx-isa-async-copy.md
      - .claude/knowledge/ptx/ptx-isa-sm90-hopper.md
    forbidden_behavior:
      - opens raw 09_instruction-set.md before reading the distilled card
  - prompt: "syntax for mbarrier.complete_tx::bytes"
    expected_skill: interpreting-ptx-isa
    expected_cards:
      - .claude/knowledge/ptx/ptx-isa-barriers.md
    forbidden_behavior:
      - confuses mbarrier with bar.sync (different objects)
  - prompt: "tcgen05.mma operand layout for FP4 with TMEM"
    expected_skill: interpreting-ptx-isa
    expected_cards:
      - .claude/knowledge/ptx/ptx-isa-sm100-blackwell.md
      - .claude/knowledge/ptx/ptx-isa-tensor-cores.md
    forbidden_behavior:
      - claims tcgen05.mma is multi-thread issue (it is single-thread issue)
  - prompt: "constraint letters for 64-bit unsigned in inline PTX asm"
    expected_skill: interpreting-ptx-isa
    expected_cards:
      - .claude/knowledge/inline-ptx/inline-ptx-from-cu.md
    forbidden_behavior:
      - confuses r/l/f/d/h/q/n/C constraint letters
  - prompt: "shfl.sync semantics for non-power-of-2 thread groups"
    expected_skill: interpreting-ptx-isa
    expected_cards:
      - .claude/knowledge/ptx/ptx-isa-warp-ops.md
    forbidden_behavior:
      - claims shuffle is undefined outside power-of-2 (wrap behavior is specified)
  - prompt: "difference between .ca and .cg cache modifiers in PTX loads"
    expected_skill: interpreting-ptx-isa
    expected_cards:
      - .claude/knowledge/ptx/ptx-isa-cache-hints.md
    forbidden_behavior:
      - confuses cache modifiers with memory-space qualifiers
