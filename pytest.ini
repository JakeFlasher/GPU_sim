[pytest]
# The default gate covers the simulator, trace/label pipeline, calibration
# references, and the lightweight workload contracts.  SOL-ExecBench and its
# downloaded FlashInfer corpus are an optional GPU evaluation bundle with a
# separate environment under tools/sol_execbench/; they are never collected by
# an ordinary repository test run.
addopts = -m "not campaign_evidence and not hardware_evidence"
markers =
    campaign_evidence: requires the immutable external campaign archive and must run through tools/dev/campaign_evidence_gate.sh
    hardware_evidence: requires machine-local GPU trace/control evidence and must run through the explicit hardware gate
testpaths =
    arch_profiles/tests
    eval/guards
    tools/cache_predictor
    tools/cache_replay
    tools/hrd_profiler
    tools/local_labels
    tools/nvbit_tracer
    tools/pchase
    tools/sass_control
    tools/sector_stream
    tools/sol_baselines_scaffold
    tools/trace_sampling/tests
    workloads/simbench_bw/tests
norecursedirs =
    .git
    .humanize
    .pytest_cache
    .toolchain
    .venv
    __pycache__
    data
    sim/target
    tools/sol_execbench
