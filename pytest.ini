[pytest]
# A bare `pytest` is a quick smoke run. Campaign, hardware, and large subsystem
# suites remain available by passing their paths explicitly.
testpaths =
    arch_profiles/tests
    eval/tests/test_direct_score.py
    tools/local_labels/test_collect_ncu.py
    tools/local_labels/test_metrics.py
    tools/local_labels/test_ncu_csv.py
norecursedirs =
    .git
    .pytest_cache
    .toolchain
    .venv
    __pycache__
    data
    sim/target
    tools/sol_execbench
