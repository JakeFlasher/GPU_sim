# SimBench-BW per-kernel trace-size + wall-time budgets.
#
# Covers the full 72-kernel roster plus 2 vendor-control rows. Schema grammar,
# sampling_policy regex,
# `BudgetViolationUntracked` semantics, and [defaults]-template-only convention
# are preserved so tools/cloud/trace_budgets.py::load_trace_budgets continues
# to parse this file unchanged.
#
# cell_id is the row slug. max_trace_bytes = trace_budget_mib * 1024 * 1024.
# max_wall_time_s defaults to 3600 (1 hour). Rows with a mechanically justified
# larger end-to-end capture envelope are explicitly uplifted to 5400. SOL rows
# use their separately declared 7200-second envelope except for the measured
# problem-027, problem-039, and problem-040 AC9 routes, which are explicitly
# uplifted to 10800, 21600, and 18000 respectively.
#
# sampling_policy values beyond "off" indicate a pre-declared mitigation for
# kernels whose native trace would exceed budget.

schema_version = 1

[defaults]
max_trace_bytes = 2147483648
max_wall_time_s = 3600
sampling_policy = "off"


# Round-28 fixed-design capture budgets. These are retained-artifact ceilings,
# not permission for legacy stride/kernel-limit truncation. A raw breach enters
# the compression-first AC9 route; the SOL rows trace one pinned candidate
# launch after full logical-workload correctness validation.

