# Predictor↔NCU Comparison Contract
#
# Pins the binding terms for comparing the analytical cache-hit-rate
# predictor's output (per workloads/simbench_bw/schemas/cache_predictor.schema.json)
# against NCU-derived ground-truth labels (per data/local_labels/sm_<N>/<slug>/<shape>/label_*.json).
# The contract is the load-bearing surface: every term affects the
# headline geomean relative error number. Bumping any term must be
# accompanied by a coordinated update to the schema, the comparison
# runner, the regression tests, and the round summary's reported
# metric definition.
#
# This file is consumed by workloads/simbench_bw/comparison_runner.py.
# The TOML format mirrors the existing roster.toml / splits.toml /
# nvbit_phase_injection.toml pattern; jsonschema validation lives in
# the consumer's typed-failure / typed-unavailable admission helper.

schema_version = 1

# ---------------------------------------------------------------------
# NCU metric pinning
# ---------------------------------------------------------------------
# The exact NCU metric used as ground truth. Sector-basis L2 hit rate
# per the L2 sector lookup-hit / lookup-total ratio. Sector basis
# (32B granularity) matches the predictor's modeled-hit rule, which
# operates in 32B-sector units (cache_model_capacity_bytes // 32).
# Selecting an L1tex-level metric here would require a parallel
# predictor head that models L1 separately; deferred behind the
# per-record L1-bypass + set-associative refinement ablation gates
# documented in plans/cache_hit_rate_predictor_first_plan.md.

[ncu_metric]
# NCU 2026.1.0's `--query-metrics` lists `lts__t_sector_hit_rate` as the
# canonical Ratio metric: "proportion of L2 sector lookups that hit".
# The earlier pin `lts__t_sectors_lookup_hit_rate.pct` was an unintended
# typo conflating the singular Ratio's name with the plural Counter
# names (`lts__t_sectors_lookup_hit`, `lts__t_sectors_lookup_miss`);
# NCU returns "n/a" when asked for the typo'd form. The canonical
# Ratio is the legacy name preserved here, accessed in percent form
# via the standard `.pct` suffix.
name = "lts__t_sector_hit_rate.pct"
display = "L2 Sector Hit Rate"
description = "Fraction of L2 sector lookups that hit (NCU `lts__t_sector_hit_rate` Ratio metric, accessed in percent form via `.pct`). Sector basis (32B granularity); excludes TLB-induced misses; includes all access types unless overridden by per-cell filters."
unit = "fraction"           # ∈ [0, 1]; NCU exports as percent but we normalize to fraction
percent_to_fraction = true
ncu_metric_version = "ncu_2026.1.x"  # bumped when NCU metric semantics drift; matched against label sidecar's profiler_version
includes_atomics = true
includes_stores = true
sector_basis = true         # not request basis
excludes_tlb_misses = true  # NCU L2 hit rate excludes TLB misses by default

# ---------------------------------------------------------------------
# Join key — 7 fields
# ---------------------------------------------------------------------
# Predictor and NCU label cells are joined by the full 7-tuple. Any
# one-field drift rejects the cell with typed `comparison_contract_drift`.
# This mirrors the manifest_pairing_index 5-field cross-check in
# verify_artifacts.py (R4 widening at d2ec483) plus the per-arch
# `device` covariate plus the `ncu_metric_version` to guard against
# NCU metric semantics drift.

[join_key]
fields = [
  "slug",
  "shape_point",
  "binary_sha256",
  "source_commit",
  "kernel_signature_sha256",
  "arch",
  "ncu_metric_version",
  "cache_layer",
]

# ---------------------------------------------------------------------
# Error formula
# ---------------------------------------------------------------------
# Relative error = |predicted − ground_truth| / max(ground_truth, epsilon).
# The max(...) gate handles ground_truth values near 0 (where strict
# relative error blows up). Epsilon is a contract parameter; the
# default of 0.01 means hit rates below 1% fall back to absolute-error
# semantics. Per-cell overrides are NOT supported (any cell-specific
# epsilon would defeat the geomean's reproducibility).

[error_formula]
formula = "abs(predicted - ground_truth) / max(ground_truth, epsilon)"
epsilon = 0.01
both_in_fraction_units = true   # both predicted and ground_truth must be in [0, 1]
log_space_geomean = true        # geomean computed as exp(mean(log(rel_err)))

# ---------------------------------------------------------------------
# Geomean aggregation
# ---------------------------------------------------------------------
# Geomean of per-cell relative errors across admitted cells, with
# bootstrap CI per the same BOOTSTRAP_RESAMPLES=2000 / CI_CONFIDENCE=0.95
# discipline as the HRD profiler. The bootstrap unit is the per-cell
# relative error, NOT per-launch (the per-cell aggregation already
# absorbs per-launch variance via the predictor's bootstrap CI).

[geomean]
bootstrap_resamples = 2000
ci_confidence = 0.95
ci_half_width_target = 0.05
bootstrap_unit = "cell"          # per-cell relative-error resampling
typed_unavailable_handling = "exclude"  # cells with result_kind=typed_unavailable do NOT enter the geomean
bounded_arm_handling = "report_three"   # report geomean over hit_rate_lower / hit_rate_upper / midpoint variants

# ---------------------------------------------------------------------
# Admitted-cell coverage gate
# ---------------------------------------------------------------------
# The headline geomean is "reportable" only when these thresholds
# are met. Below the smoke-test floor, the runner emits the
# `headline_geomean_admitted_cell_count_below_threshold` typed
# diagnostic and returns no scalar geomean. The thresholds follow
# the existing 45/16/16 calibration / validation / holdout split
# semantics: 5 cells per arch is a smoke-test floor; 10+ per arch
# is the publication-grade floor; 20+ cells across the 45-row
# calibration set is the aspirational target.

[coverage_gate]
smoke_test_floor_per_arch = 5            # below this: no scalar headline; only diagnostic
publication_grade_floor_per_arch = 10    # at or above this: a defensible geomean is reported
aspirational_target_total = 20           # across both arches in the calibration set
require_both_arches_for_cross_arch = true  # cross-arch transfer evaluation is gated separately

# ---------------------------------------------------------------------
# Scope — what the comparison covers (anti-overclaim discipline)
# ---------------------------------------------------------------------
# This contract pins the comparison's scope. Reviewers asking
# "what does this geomean cover?" can read this section directly.
# The round summary cites this section verbatim when reporting the
# headline number, per the prior-art-comparison citation-safe
# discipline documented in plans/cache_hit_rate_predictor_first_plan.md.

[scope]
arch_set = ["sm_86", "sm_120"]   # local-only; cloud / server arches out of scope per Rule 1
cache_layers = ["L1", "L2"]        # L1 promoted to load-bearing. Contract-side labels are "L1"/"L2"; the runner maps bundle-side "L1TEX"->"L1" via _BUNDLE_TO_CONTRACT_CACHE_LAYER, so the contract value is "L1" (writing "L1TEX" here would drift-exclude every L1 bundle). The driver emits L1TEX predictor bundles in lockstep with this widening: tools/local_labels/run_headline_cohort_predict_compare.py appends per-cell L1TEX bundles built by tools/local_labels/emit_l1_closure_artifacts.build_l1tex_bundles_from_predictions (sourced from the committed per-cell L1 walker predictions). Cells whose L1 walker emitted a scalar prediction score in the L1 geomean; cells whose L1 prediction is typed_unavailable (predictor_l1_sass_provenance_missing) score as predictor_typed_unavailable, NOT join_key_unmatched. On the current cohort the live L1 headline count is below the smoke floor (5); the coverage gate reports meets_floor=false honestly until the cohort grows.
metric_target = "hit_rate"         # hit rate, not miss rate or sector counts
device_set = ["RTX 3090 Ti", "RTX 5060 Laptop GPU"]  # local-only; cloud sm_120 GB202 deferred
prior_art_handling = "contextual_only"  # head-to-head requires normalized workloads/metrics; deferred

# ---------------------------------------------------------------------
# Per-arch diagnostics configuration
# ---------------------------------------------------------------------
# Pins the vocabulary the runner uses to tally per-arch and
# unattributed exclusion records, and the small-n threshold above
# which the per-arch statistics block emits q25/q50/q75. The runner
# enforces set-equality between this section's diagnostic_vocabulary
# and its _EXCLUDED_DIAGNOSTIC_VALUES constant at load time; drift
# raises ComparisonContractDrift before any cell is processed so the
# runner cannot silently fall back when the contract and the runner
# enums disagree.

[per_arch_diagnostics_config]
diagnostic_vocabulary = [
    "comparison_contract_drift",
    "comparison_runner_join_key_unmatched",
    "predictor_typed_unavailable",
]
quartile_min_n = 4
