# NVBit `%clock64` phase-injection admission registry.
#
# Registers the non-root measurement thresholds that the
# consumer modules `phase_cycle_ledger_consumer.py` and
# `dual_run_manifest_consumer.py` apply when admitting per-launch
# ledger / manifest sidecars produced by the consolidated NVBit
# tracer extension under `tools/nvbit_tracer/tracer_tool/`.
#
# AC4 — A/B Heisenberg-overhead admission. The phase-cycle ledger's
# `ab_overhead_record.admitted` is computed as
# `overhead_pct <= admission_threshold_pct`. A kernel whose injected
# variant exceeds the per-kernel threshold is excluded from
# phase-ledger consumers and the typed
# `nvbit_phase_injection_overhead_exceeded` diagnostic is surfaced.
#
# AC4.1 — Dual-run NVML drift. The dual-run manifest carries
# `drift_tolerance_ns` per pair; the join layer rejects pairs whose
# per-launch `(cupti_run_nvml_state, nvbit_run_nvml_state)` differ by
# more than this threshold with the typed `dual_run_drift_exceeded`
# diagnostic. The default registered here is the value the closure
# plan's pre-registration TOML will pin once AC12 freezes; per-pair
# overrides remain available so an operator running on a known-volatile
# host can register a wider tolerance for that paired run.
#
# This artifact is destined for the AC12 frozen-artifact set; once the
# pre-registration tag is applied any modification to the default
# values requires an `pre_registration_amendments/AMD_NNN.md`.

schema_version = 1

[defaults]
# 300 ms maximum drift between CUPTI-side and NVBit-side per-launch
# NVML samples. The default reflects the non-root measurement contract's phase-injection
# guidance that sub-second drift is the target; a tighter tolerance
# (e.g., 50 ms) would over-fit single-host runs and a wider tolerance
# (e.g., 1 s) would mask genuine per-launch divergence.
drift_tolerance_ns = 300_000_000

# 10% maximum A/B Heisenberg overhead. The default is the non-root
# measurement contract's phase-injection NVBit-overhead guidance; per-kernel overrides land
# in the `[per_kernel.<slug>]` section as the producer side admits
# the smoke set.
default_admission_threshold_pct = 10.0

# Per-kernel admission overrides. Empty until the producer side
# (R12+) admits the smoke set; populating this section requires
# an `pre_registration_amendments/AMD_NNN.md` once the AC12
# pre-registration tag is applied.

[per_kernel]

[provenance]
closure_plan_revision = "non_root_measurement_contract@2026-05-03"
populated_dated_iso8601 = "2026-04-29T02:30:00Z"
notes = """The defaults above are the non-root measurement baseline. Per-kernel
overrides are not yet populated because the consolidated NVBit tracer
extension that produces per-kernel A/B overhead measurements is
sequenced for a subsequent round. Until then, the consumer module
defaults to the values in [defaults] for every kernel.
"""
