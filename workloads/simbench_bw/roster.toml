# SimBench-BW canonical roster.
#
# Workload inputs for CUDA builds and captures.
#
# Maintenance discipline:
# - Adding or removing a row is a schema-version-relevant change; update the
#   schema_version field at the top and any consumer whose cached column set
#   depends on row count.
# - Per-row tier drives the kernel build target set in common.mk
#   (arch_gate -> ARCH_GATE tokens).
# - primary_subsystems and secondary_subsystems use the S1-S20 identifiers
#   from the subsystem coverage matrix.
# - probe_dependencies is an array of feature-key tokens whose availability
#   gates the row; empty list is allowed. When probe_dependencies is empty,
#   tier must resolve cleanly from arch_gate alone.

schema_version = 1

