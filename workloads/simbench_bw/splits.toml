# SimBench-BW calibration / validation / holdout splits.
#
# Stratified 46 / 17 / 16 across the 79 rows by (domain, level, primary_precision).
# Downstream prediction models use only calibration for tuning; validation is
# for mid-loop checks; holdout is reserved for final evaluation. R44 admitted
# `working_set_capacity_sweep` and `warm_cold_pair_relaunch`; R46 admitted
# `l2_prefetch_hint_sweep`; R47 admitted `l2_persisting_window_sweep`; R48
# admitted `carveout_sensitivity_probe` (the final residual microbenchmark-
# suite-coverage family) into calibration, expanding from 44 to 45 rows. The
# sm86 cohort regen loop's task3 admitted `dram_streaming_dot_product`
# into calibration, growing it to 46 rows. The atomics ATOM-vs-RED pairing
# added `global_atomic_return_used` (the atomic-with-return partner of the
# return-ignored `global_atomic_histogram`) to validation, growing it from 16
# to 17 (78 -> 79 rows). The vector-width request/sector-formation family then
# added `global_vectorized_128b_copy` (float4 -> LDG.E.128/STG.E.128) and
# `global_scalar_32b_copy` (scalar -> LDG.E/STG.E) to validation, growing it
# from 17 to 19 (79 -> 81 rows), and then the 64-bit member
# `global_vectorized_64b_copy` (float2 -> LDG.E.64/STG.E.64) grew it from 19 to
# 20 (81 -> 82 rows). The opcode-distinct atomic-MAX pair then added
# `global_atomic_max_histogram` (REDG.E.MAX.S32) and
# `global_atomic_max_return_used` (ATOMG.E.MAX.S32) to validation, growing it
# from 20 to 22 (82 -> 84 rows), and the bitwise atomic-AND pair
# (`global_atomic_and_histogram` REDG.E.AND + `global_atomic_and_return_used`
# ATOMG.E.AND) grew it from 22 to 24 (84 -> 86 rows). Counts are frozen
# until the next suite-expansion round.

schema_version = 1
stratification_keys = ["domain", "level", "primary_precision"]

[counts]
calibration = 48
validation = 24
holdout = 16

