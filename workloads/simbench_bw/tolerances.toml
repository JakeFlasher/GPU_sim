[[entries]]
dtype = "NVFP4"
reduction_kind = "fma_chain"
kernel_family = "mma_microbench"
rtol = 0.2
atol = 0.75
max_ulp = 4
notes = "NVFP4 per-16-element block-scaled MMA at K=256 accumulation. The band reflects the inherent floor observed empirically AND via a Python ideal-quantization simulation: both give max absolute error ~0.7 on random [-0.5, 0.5] inputs (R19 `nvfp4_blockscale_gemm` validation). Each element is quantized to signed 4-bit FP (step ~0.125 at unit scale); cumulative error over K=256 independent rounding events reaches ~sqrt(K) * per-element-step = sqrt(256) * 0.05 = 0.8 in the worst random tail. rtol stays tight (0.2) because the relative error for large |ref| IS per-block-FP8-tier (~20%)."

[[entries]]
dtype = "TF32"
reduction_kind = "fma_chain"
kernel_family = "mma_microbench"
rtol = 0.005
atol = 0.005
max_ulp = 16
notes = "TF32 m16n8k8 MMA at K up to 32 (correctness shape). TF32 has a 10-bit mantissa (eps ~= 2^-10 = 1e-3); per-element FMA error grows by sqrt(K)*eps for randomly signed errors and up to K*eps in the worst-case tail. R42 widened from rtol=5e-4/atol=1e-4 (which assumed K~1) to rtol=atol=5e-3 to fit the measured precision floor on the K=32 correctness shape (max abs diff ~1e-3 observed)."
[[entries]]
