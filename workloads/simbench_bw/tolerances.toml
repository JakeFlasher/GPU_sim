# SimBench-BW numerical tolerance policy.
#
# Keyed by (dtype, reduction_kind, kernel_family) triplets. Every roster row
# maps to exactly one entry; run_suite.py --mode correctness --verbose logs the
# matched triplet. Adding a new kernel whose triplet is not covered here is an
# explicit extension requirement: append an entry before the kernel lands.

schema_version = 1

