[[entries]]
dtype = "FP32"
reduction_kind = "fma_chain"
kernel_family = "control"
rtol = 1e-3
atol = 1e-3
max_ulp = 16
notes = "Vendor-library FP32 strided-batched SGEMM control (cublasSgemmStridedBatched under CUBLAS_PEDANTIC_MATH forces the deterministic FFMA SIMT path: no HMMA, no TF32). Band is the FP32 step of the control-family precision progression (FP8 5e-2 -> BF16 1e-2 -> FP32 1e-3): ~a decade tighter than the BF16 control floor, reflecting FP32's narrower accumulate floor while absorbing the K-accumulation-order divergence between the batched FFMA GEMM and the FP32 CPU matmul reference."
