schema_version = 1
slug = "working_set_capacity_sweep"

# Working-set capacity sweep microbench: each shape sizes the
# allocation across the L1 / L2 / DRAM capacity knees on sm_120
# (~96 KiB L1, ~32 MiB L2) via the `working_set_bytes` axis. The
# kernel runs a fixed phased access pattern (it does NOT iterate a
# variable per-thread read count), so the only dynamic workload
# axis is `working_set_bytes`; the HRD-profiler criterion exposes
# hit-rate distributions that change at each capacity threshold.
# Reference is the `(warps, 32)` identity round-trip seeded tensor.

[[timing_shapes]]
name = "timing_00"
axes = { working_set_bytes = 33554432, warps = 256 }
launch_config = { grid = [256, 1, 1], block = [128, 1, 1] }
warm_up_iters = 5
repeat_iters = 30

[[trace_shapes]]
name = "trace_00"
axes = { working_set_bytes = 1048576, warps = 32 }
launch_config = { grid = [32, 1, 1], block = [128, 1, 1] }
predicted_bytes = 20480
estimator_source = "static"

[[trace_shapes]]
name = "trace_l2_accuracy_xl"
axes = { working_set_bytes = 16777216, warps = 64 }
launch_config = { grid = [64, 1, 1], block = [32, 1, 1] }
predicted_bytes = 10240
estimator_source = "static"

[[correctness_shapes]]
name = "correctness_00"
axes = { working_set_bytes = 4096, warps = 4 }
launch_config = { grid = [4, 1, 1], block = [32, 1, 1] }
digest_kind = "hash"
