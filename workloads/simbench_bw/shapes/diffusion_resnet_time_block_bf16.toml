schema_version = 1
slug = "diffusion_resnet_time_block_bf16"

# ResNet block + time embedding. Activation tensor is
# [batch, channels, height, width]; time embedding is [batch, time_dim]
# projected per-channel by a [time_dim, channels] linear and added as
# bias before the second norm-silu stage. Output is shape-preserving
# (final = x + h2). Trace budget = 512 MiB.

[[timing_shapes]]
name = "timing_00"
axes = { batch = 8, channels = 256, height = 32, width = 32, time_dim = 1024 }
launch_config = { grid = [8, 256, 1], block = [128, 1, 1] }
warm_up_iters = 5
repeat_iters = 30

[[timing_shapes]]
name = "timing_01"
axes = { batch = 4, channels = 512, height = 16, width = 16, time_dim = 1024 }
launch_config = { grid = [4, 512, 1], block = [128, 1, 1] }
warm_up_iters = 5
repeat_iters = 30

[[trace_shapes]]
name = "trace_00"
axes = { batch = 2, channels = 8, height = 8, width = 8, time_dim = 16 }
launch_config = { grid = [2, 8, 1], block = [64, 1, 1] }
predicted_bytes = 2621440
estimator_source = "static"

[[correctness_shapes]]
