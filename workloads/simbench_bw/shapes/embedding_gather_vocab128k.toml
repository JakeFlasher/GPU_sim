schema_version = 1
slug = "embedding_gather_vocab128k"

# Gather embedding table E[vocab_size, hidden] at indices[batch, indices]
# to produce output[batch, indices, hidden]. Timing shapes exercise the
# realistic 128k vocab claimed in the slug; trace shapes stay small so
# the static predictor keeps predicted_bytes under trace_budget_mib=128.

[[timing_shapes]]
name = "timing_00"
axes = { batch = 1024, indices = 128, hidden = 4096, vocab_size = 131072 }
launch_config = { grid = [128, 1, 1], block = [128, 1, 1] }
warm_up_iters = 5
repeat_iters = 30

[[timing_shapes]]
name = "timing_01"
axes = { batch = 256, indices = 64, hidden = 2048, vocab_size = 131072 }
launch_config = { grid = [64, 1, 1], block = [128, 1, 1] }
warm_up_iters = 5
repeat_iters = 30

[[trace_shapes]]
name = "trace_00"
axes = { batch = 16, indices = 32, hidden = 128 }
launch_config = { grid = [16, 1, 1], block = [128, 1, 1] }
predicted_bytes = 10485760
estimator_source = "static"

[[correctness_shapes]]
name = "correctness_00"
axes = { batch = 4, indices = 8, hidden = 32, vocab_size = 64 }
launch_config = { grid = [4, 1, 1], block = [32, 1, 1] }
digest_kind = "full_tensor"
