schema_version = 1
slug = "flash_attn_fwd_bf16_noncausal"

# Flash attention forward, non-causal mask. Same axis schema as the
# causal variant: Q is [batch, heads, seq, head_dim]; K, V are
# [batch, kv_heads, seq, head_dim]. attention.py applies a causal
# mask only on rows whose slug carries "causal" — non-causal rows
# attend over the full key sequence.

[[timing_shapes]]
name = "timing_00"
axes = { batch = 1, seq = 4096, head_dim = 128, heads = 32 }
launch_config = { grid = [4096, 32, 1], block = [128, 1, 1] }
warm_up_iters = 5
repeat_iters = 30

[[timing_shapes]]
name = "timing_01"
axes = { batch = 2, seq = 1024, head_dim = 64, heads = 16 }
launch_config = { grid = [1024, 16, 2], block = [64, 1, 1] }
warm_up_iters = 5
repeat_iters = 30

[[trace_shapes]]
name = "trace_00"
axes = { batch = 1, seq = 1024, head_dim = 64, heads = 8 }
launch_config = { grid = [1024, 8, 1], block = [64, 1, 1] }
predicted_bytes = 83886080
estimator_source = "static"

[[correctness_shapes]]
name = "correctness_00"
axes = { batch = 1, seq = 64, head_dim = 32, heads = 4 }
launch_config = { grid = [64, 4, 1], block = [32, 1, 1] }
digest_kind = "hash"
