schema_version = 1
slug = "local_volatile_array"

# Local-memory microbench (VOLATILE mechanism). Each thread holds a per-thread
# `volatile` automatic array; the volatile qualifier forces every access to be
# a real memory access (no register promotion), so the array lives in .local
# memory -> LDL/STL (no -maxrregcount cap). The verified output is the identity
# round-trip on the seeded buffer (out = in); the reference is a seeded tensor
# of the same axis-product envelope. The local-memory work folds into a scratch
# sink that is NOT part of `out`. `bins` sets the number of volatile
# read-modify-write passes over the per-thread array. Same launch geometry
# (grid[1,1,1]/block[32,1,1]) as the other single-block identity microbenches
# so the shape launch_config matches the kernel's hardcoded launch.

[[timing_shapes]]
name = "timing_00"
axes = { samples = 1048576, bins = 1024 }
launch_config = { grid = [1, 1, 1], block = [32, 1, 1] }
warm_up_iters = 5
repeat_iters = 30

[[trace_shapes]]
name = "trace_00"
axes = { samples = 1024, bins = 64 }
launch_config = { grid = [1, 1, 1], block = [32, 1, 1] }
predicted_bytes = 10485760
estimator_source = "static"

[[trace_shapes]]
name = "trace_l2_accuracy_xl"
axes = { samples = 1024, bins = 32 }
launch_config = { grid = [1, 1, 1], block = [32, 1, 1] }
predicted_bytes = 5242880
estimator_source = "static"

[[correctness_shapes]]
name = "correctness_00"
axes = { samples = 32, bins = 8 }
launch_config = { grid = [1, 1, 1], block = [32, 1, 1] }
digest_kind = "hash"
