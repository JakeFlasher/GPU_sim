schema_version = 1
slug = "dsmem_ring_bandwidth"

# Cluster ring bandwidth: each CTA writes its seeded tile to its
# right neighbor via DSMEM. Reference is the cluster-rotated
# (one-step-shifted) sequence of seeded tiles.

[[timing_shapes]]
name = "timing_00"
axes = { cluster_size = 8, elements = 1024 }
launch_config = { grid = [8, 1, 1], block = [128, 1, 1] }
warm_up_iters = 5
repeat_iters = 30

[[trace_shapes]]
name = "trace_00"
axes = { cluster_size = 4, elements = 128 }
launch_config = { grid = [4, 1, 1], block = [128, 1, 1] }
predicted_bytes = 81920
estimator_source = "static"

[[correctness_shapes]]
name = "correctness_00"
axes = { cluster_size = 2, elements = 16 }
launch_config = { grid = [2, 1, 1], block = [32, 1, 1] }
digest_kind = "hash"
