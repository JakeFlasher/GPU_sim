schema_version = 1
slug = "embedding_bag_scatter_atomic"

# Atomic-sum bag-style embedding: for each sample b, sum
# E[indices[b, i], :] over i in [0, bag_size) into output[b, :].
# Reference is a deterministic Python sum; the kernel uses atomic add
# (deterministic=ND in roster.toml) and the tolerance band absorbs the
# summation-order mismatch. trace_budget_mib = 160.

[[timing_shapes]]
name = "timing_00"
axes = { batch = 2048, bag_size = 32, hidden = 4096, vocab_size = 131072 }
launch_config = { grid = [128, 1, 1], block = [128, 1, 1] }
warm_up_iters = 5
repeat_iters = 30

[[timing_shapes]]
name = "timing_01"
axes = { batch = 512, bag_size = 64, hidden = 2048, vocab_size = 131072 }
launch_config = { grid = [64, 1, 1], block = [128, 1, 1] }
warm_up_iters = 5
repeat_iters = 30

[[trace_shapes]]
name = "trace_00"
axes = { batch = 32, bag_size = 16, hidden = 256 }
launch_config = { grid = [32, 1, 1], block = [128, 1, 1] }
predicted_bytes = 20971520
estimator_source = "static"

[[correctness_shapes]]
name = "correctness_00"
axes = { batch = 4, bag_size = 8, hidden = 32, vocab_size = 64 }
launch_config = { grid = [4, 1, 1], block = [32, 1, 1] }
digest_kind = "full_tensor"
