# conditioning vector c is [batch, cond_dim] projected through three
# independent linears to (scale, shift, gate) of shape [batch, hidden].
# Output is x + gate * (LayerNorm(x) * (1 + scale) + shift), with the
# gate zero-init in production. Trace budget = 384 MiB.

