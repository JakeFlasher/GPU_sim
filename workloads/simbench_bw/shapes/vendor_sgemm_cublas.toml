schema_version = 1
slug = "vendor_sgemm_cublas"

# Vendor-library control row: cuBLAS FP32 GEMM C = A @ B via
# cublasSgemm under CUBLAS_PEDANTIC_MATH. The pedantic math-mode
# lock forbids TF32 / HMMA / tensor-core dispatch, forcing the FP32
# FFMA SIMT kernel ampere_sgemm_128x128_nn so the trace stays clean
# under the canonical NVBit tracer's HMMA opcode parser. Unbatched
# sibling of vendor_sgemm_strided_batched_cublas (same kernel
# family, batch_count axis removed).
# tier = control -> excluded from headline scoring.
# trace_budget_mib = 64.
# launch_config values document the cuBLAS-chosen geometry for the
# given axes (the library, not the harness, selects the launch).

[[timing_shapes]]
name = "timing_00"
axes = { m = 1024, n = 1024, k = 1024 }
launch_config = { grid = [8, 8, 1], block = [256, 1, 1] }
warm_up_iters = 1
repeat_iters = 3

[[trace_shapes]]
name = "timing_shape"
axes = { m = 32, n = 32, k = 32 }
launch_config = { grid = [1, 1, 1], block = [128, 1, 1] }
predicted_bytes = 5242880
estimator_source = "static"

[[correctness_shapes]]
name = "correctness_00"
axes = { m = 8, n = 8, k = 8 }
launch_config = { grid = [1, 1, 1], block = [32, 1, 1] }
digest_kind = "full_tensor"
