schema_version = 1
slug = "sparse_2to4_int8_gemm"

# INT8 sparse 2:4 GEMM (m16n8k64 with sparse-MMA). Reference is the
# FP32 matmul on the 2:4-masked A and B after INT8 round-trip
# quantization at SCALE=64 (`mma_microbench.py::build_reference`
# dispatches through `_apply_2to4_mask` + `_quantize_matrix_int8`,
# which uses `_round_half_away_from_zero` per R14 to match the
# host driver's `lroundf(v * SCALE)` bit-exactly), under the INT8
# fma_chain tolerance.

[[timing_shapes]]
name = "timing_00"
axes = { m = 1024, n = 1024, k = 4096 }
launch_config = { grid = [64, 128, 1], block = [32, 1, 1] }
warm_up_iters = 5
repeat_iters = 30

[[trace_shapes]]
name = "trace_00"
axes = { m = 64, n = 64, k = 128 }
launch_config = { grid = [4, 8, 1], block = [32, 1, 1] }
predicted_bytes = 83886080
estimator_source = "static"

[[correctness_shapes]]
name = "correctness_00"
axes = { m = 32, n = 16, k = 64 }
launch_config = { grid = [2, 2, 1], block = [32, 1, 1] }
digest_kind = "reduction_summary"
