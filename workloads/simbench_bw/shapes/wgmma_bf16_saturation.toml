schema_version = 1
slug = "wgmma_bf16_saturation"

# Hopper wgmma BF16 saturation (sm_90a-only). Warpgroup-level
# m64n64k16 BF16 MMA driving accumulator saturation. Reference is
# `mma_microbench.py::_fp32_matmul` on the **un-quantized** seeded
# FP32 operands (the `wgmma_bf16_saturation` slug has no elif in
# build_reference's dispatch chain; it falls through to plain
# `_fp32_matmul` like the other BF16/FP16/TF32 rows that don't go
# through kind::f8f6f4 quantization). The kernel sees host-cast BF16
# inputs (via `__float2bfloat16`) while the reference sees
# un-quantized FP32; the two diverge per BF16's 7-bit mantissa
# (BF16's wide dynamic range from its 8-bit exponent does NOT make
# the cast exact for arbitrary FP32 values in [-0.5, 0.5)). The
# (BF16, fma_chain, mma_microbench) tolerance triplet absorbs both
# the BF16 input-quantization error and the BF16*BF16→FP32 hardware-
# multiply rounding. R25 corrected prior Round-23 prose that
# falsely claimed BF16 cast was exact in this range. R23 fixed
# correctness_00 K from 32 → 16 to match the kernel's m64n64k16
# capability (single warpgroup × single wgmma issue; pre-Round-23
# the K mismatch was masked by host-FP32-matmul-is-authoritative;
# post-Round-23 the kernel output is authoritative). Trace/timing
# shapes stay larger because they're instruction-path-only (no
# output validation).

[[timing_shapes]]
name = "timing_00"
axes = { m = 1024, n = 1024, k = 4096 }
launch_config = { grid = [16, 16, 1], block = [128, 1, 1] }
warm_up_iters = 5
repeat_iters = 30

[[trace_shapes]]
name = "trace_00"
axes = { m = 64, n = 64, k = 128 }
launch_config = { grid = [1, 1, 1], block = [128, 1, 1] }
predicted_bytes = 83886080
estimator_source = "static"

[[correctness_shapes]]
name = "correctness_00"
axes = { m = 64, n = 64, k = 16 }
launch_config = { grid = [1, 1, 1], block = [128, 1, 1] }
