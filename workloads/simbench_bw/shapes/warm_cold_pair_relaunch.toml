schema_version = 1
slug = "warm_cold_pair_relaunch"

# Warm/cold cache-pair microbench: two launches over the same
# allocation. The first (cold) launch reads through the input
# fresh from DRAM; an optional eviction sweep touches a scratch
# buffer of `eviction_bytes`; the second (warm) launch re-reads
# the same allocation. The HRD-profiler criterion compares per-
# launch hit-rate distributions to recover the warm/cold delta.
# Reference is a seeded tensor of the same axis-product envelope.

[[timing_shapes]]
name = "timing_00"
axes = { allocation_bytes = 8388608, accesses = 4096, eviction_bytes = 67108864, warps = 256 }
launch_config = { grid = [256, 1, 1], block = [32, 1, 1] }
warm_up_iters = 5
repeat_iters = 30

[[trace_shapes]]
name = "trace_00"
axes = { allocation_bytes = 524288, accesses = 256, eviction_bytes = 1048576, warps = 32 }
launch_config = { grid = [32, 1, 1], block = [32, 1, 1] }
# 1310720 = (4.0 * 1 * (256 * 32 / 32) * 32) * 32 + (0.5 * dynamic_warp_instructions) * 16
# i.e. dynamic_warp_instructions=32768, memref_count=16384
# = 32768 * 32 + 16384 * 16 = 1048576 + 262144 = 1310720.
# The prior value (40960) preceded the R49 axis-product fix that
# excluded `_bytes` axes; the estimator now produces 1310720 here
# and `trace_size_estimator.validate_slug` flags any drift > 10%.
predicted_bytes = 1310720
estimator_source = "static"

[[trace_shapes]]
name = "trace_l2_accuracy_xl"
axes = { allocation_bytes = 524288, accesses = 512, eviction_bytes = 524288, warps = 8 }
launch_config = { grid = [8, 1, 1], block = [32, 1, 1] }
predicted_bytes = 655360
estimator_source = "static"

[[correctness_shapes]]
name = "correctness_00"
axes = { allocation_bytes = 4096, accesses = 32, eviction_bytes = 4 }
launch_config = { grid = [1, 1, 1], block = [32, 1, 1] }
digest_kind = "hash"
