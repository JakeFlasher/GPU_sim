schema_version = 1
slug = "moe_grouped_gemm_fp8"

# Launch geometry reflects the R18 kernel's actual wrapper:
#   grid  = (tokens, 1, 1)   # one block per token
#   block = (256, 1, 1)      # fixed block of 256 threads striding over intermediate
# The kernel signature lives at
# `l2/moe_grouped_gemm_fp8/moe_grouped_gemm_fp8.cu::moe_grouped_gemm_fp8_launch`.
# Shipped shape-locked from day one — retained as a workload input contract.
#
# trace_00 uses `experts=4` (not 8) so the axis_product with the explicit
# top_k factor stays under the 512-MiB trace budget; matches the R14
# moe_grouped_gemm_bf16 shape trim rationale exactly.

[[timing_shapes]]
name = "timing_00"
axes = { tokens = 2048, experts = 64, hidden = 4096, intermediate = 11008, top_k = 2 }
launch_config = { grid = [2048, 1, 1], block = [256, 1, 1] }
warm_up_iters = 5
repeat_iters = 30

[[trace_shapes]]
name = "trace_00"
axes = { tokens = 64, experts = 4, hidden = 64, intermediate = 64, top_k = 2 }
launch_config = { grid = [64, 1, 1], block = [256, 1, 1] }
predicted_bytes = 335544320
estimator_source = "static"

[[correctness_shapes]]
name = "correctness_00"
axes = { tokens = 64, experts = 4, hidden = 512, intermediate = 1024, top_k = 2 }
launch_config = { grid = [64, 1, 1], block = [256, 1, 1] }
digest_kind = "reduction_summary"
