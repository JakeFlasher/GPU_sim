schema_version = 1
slug = "fp6_e3m2_mma_dep_chain"

# FP6 (E3M2) dependent-MMA chain (sm_120a-only). Reference is the
# FP32 matmul on A and B after FP6 E3M2 round-trip quantization
# (`mma_microbench.py::build_reference` dispatches through
# `_quantize_matrix_fp6_e3m2`, which round-trips FP32 → FP6 E3M2
# code → FP32 representable per the kind::f8f6f4 .e3m2 byte layout
# in low 6 bits [5:0] with padding mask 0xC0, max ±28.0, bias=3;
# R6 added the dispatch — same byte layout as e2m3, different
# value table), under the FP6_E3M2 fma_chain tolerance band.

[[timing_shapes]]
name = "timing_00"
axes = { m = 1024, n = 1024, k = 4096 }
launch_config = { grid = [64, 128, 1], block = [32, 1, 1] }
warm_up_iters = 5
repeat_iters = 30

[[trace_shapes]]
name = "trace_00"
axes = { m = 32, n = 16, k = 64 }
launch_config = { grid = [2, 2, 1], block = [32, 1, 1] }
predicted_bytes = 5242880
estimator_source = "static"

[[correctness_shapes]]
name = "correctness_00"
axes = { m = 16, n = 16, k = 32 }
launch_config = { grid = [1, 2, 1], block = [32, 1, 1] }
digest_kind = "reduction_summary"
