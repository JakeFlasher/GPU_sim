schema_version = 1
slug = "sampling_topk_temperature_bf16"

[[timing_shapes]]
name = "timing_00"
axes = { batch = 32, vocab = 128000, top_k = 50 }
launch_config = { grid = [32, 1, 1], block = [128, 1, 1] }
warm_up_iters = 5
repeat_iters = 30

[[trace_shapes]]
name = "trace_00"
axes = { batch = 1, vocab = 512, top_k = 16 }
launch_config = { grid = [32, 1, 1], block = [128, 1, 1] }
predicted_bytes = 64000000
estimator_source = "static"

[[correctness_shapes]]
name = "correctness_00"
# Small vocab + top_k so BF16-quantized probabilities remain strictly
# distinct; larger vocab sizes produce BF16 tied probabilities where the
# kernel's and reference's stable-sort tie-break orderings can diverge.
axes = { batch = 1, vocab = 32, top_k = 4 }
launch_config = { grid = [32, 1, 1], block = [128, 1, 1] }
digest_kind = "full_tensor"
