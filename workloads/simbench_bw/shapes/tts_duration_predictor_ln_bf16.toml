schema_version = 1
slug = "tts_duration_predictor_ln_bf16"

# TTS duration predictor: Linear(H->H) -> SiLU -> LayerNorm(over H)
# -> Linear(H->1) -> exp. Output is one predicted duration per token.
# trace_budget_mib = 384.

[[timing_shapes]]
name = "timing_00"
axes = { batch = 16, seq = 1024, hidden = 1024 }
launch_config = { grid = [16, 64, 1], block = [128, 1, 1] }
warm_up_iters = 5
repeat_iters = 30

[[timing_shapes]]
name = "timing_01"
axes = { batch = 8, seq = 2048, hidden = 512 }
launch_config = { grid = [8, 128, 1], block = [128, 1, 1] }
warm_up_iters = 5
repeat_iters = 30

[[trace_shapes]]
name = "trace_00"
axes = { batch = 1, seq = 16, hidden = 64 }
launch_config = { grid = [4, 64, 1], block = [128, 1, 1] }
predicted_bytes = 5242880
estimator_source = "static"

[[correctness_shapes]]
name = "correctness_00"
axes = { batch = 2, seq = 4, hidden = 8 }
launch_config = { grid = [2, 4, 1], block = [32, 1, 1] }
digest_kind = "full_tensor"
