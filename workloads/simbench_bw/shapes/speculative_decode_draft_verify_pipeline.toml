schema_version = 1
slug = "speculative_decode_draft_verify_pipeline"

# L4 pipeline: draft model proposes `draft_length` speculative tokens,
# verifier accepts/rejects. References at
# `references/attention.py::build_reference` (standard forward SDPA as
# the correctness anchor; the full speculative pipeline's final output
# is reduced to the forward attention output here) +
# `references/attention.py::build_l4_checkpoint` (canonical draft-to-
# verifier boundary per
# `schemas/l4_checkpoints/speculative_decode_draft_verify_pipeline.schema.json`).
# trace_budget_mib = 768.
#
# Axes merge the two reference contracts:
# - attention: batch, heads, seq, head_dim
# - speculative: batch, draft_length, vocab, num_layers, num_kv_heads, head_dim
# Both consume the same `batch` and `head_dim`; the rest are per-path.

[[timing_shapes]]
name = "timing_00"
axes = { batch = 8, draft_length = 32, vocab = 32768, num_layers = 32, num_kv_heads = 8, head_dim = 128, heads = 32, seq = 512 }
launch_config = { grid = [8, 32, 1], block = [128, 1, 1] }
warm_up_iters = 5
repeat_iters = 30

[[timing_shapes]]
name = "timing_01"
axes = { batch = 4, draft_length = 16, vocab = 32768, num_layers = 16, num_kv_heads = 4, head_dim = 128, heads = 16, seq = 1024 }
launch_config = { grid = [4, 16, 1], block = [128, 1, 1] }
warm_up_iters = 5
repeat_iters = 30

[[trace_shapes]]
name = "trace_00"
axes = { batch = 2, draft_length = 4, vocab = 32, num_layers = 2, num_kv_heads = 2, head_dim = 16, heads = 2, seq = 8 }
launch_config = { grid = [2, 2, 1], block = [64, 1, 1] }
predicted_bytes = 41943040
estimator_source = "static"

[[correctness_shapes]]
name = "correctness_00"
axes = { batch = 2, draft_length = 4, vocab = 32, num_layers = 2, num_kv_heads = 2, head_dim = 16, heads = 2, seq = 8 }
launch_config = { grid = [2, 2, 1], block = [32, 1, 1] }
digest_kind = "full_tensor"
