schema_version = 1
slug = "moe_grouped_gemm_bf16"

# Launch geometry reflects the R13 kernel's actual wrapper:
#   grid  = (tokens, 1, 1)   # one block per token
#   block = (256, 1, 1)      # fixed block of 256 threads striding over intermediate
# The kernel signature lives at
# `l2/moe_grouped_gemm_bf16/moe_grouped_gemm_bf16.cu::moe_grouped_gemm_bf16_launch`.
# R14 added the `top_k` axis to every shape set — the MoE row
# contract and `references/grouped_gemm.py::build_reference` both
# parameterize on top_k (default 2), and leaving it out made the
# stale launch_config look correct while hiding a missing axis.
# See tests/test_round14_repairs.py for the lock.
# The trace shape's `experts` was reduced 8 -> 4 so the axis_product
# with the added `top_k` factor keeps `predicted_bytes` within the
# row's 512-MiB trace budget.

[[timing_shapes]]
name = "timing_00"
axes = { tokens = 2048, experts = 64, hidden = 4096, intermediate = 11008, top_k = 2 }
launch_config = { grid = [2048, 1, 1], block = [256, 1, 1] }
warm_up_iters = 5
repeat_iters = 30

[[trace_shapes]]
name = "trace_00"
axes = { tokens = 64, experts = 4, hidden = 64, intermediate = 64, top_k = 2 }
launch_config = { grid = [64, 1, 1], block = [256, 1, 1] }
predicted_bytes = 335544320
estimator_source = "static"

[[correctness_shapes]]
name = "correctness_00"
axes = { tokens = 64, experts = 4, hidden = 512, intermediate = 1024, top_k = 2 }
launch_config = { grid = [64, 1, 1], block = [256, 1, 1] }
digest_kind = "reduction_summary"
