repeat_iters = 30

[[trace_shapes]]
name = "trace_00"
axes = { m = 32, n = 32, k = 32, batch_count = 4 }
launch_config = { grid = [2, 2, 4], block = [64, 1, 1] }
predicted_bytes = 20971520
estimator_source = "static"

[[correctness_shapes]]
name = "correctness_00"
axes = { m = 8, n = 8, k = 8, batch_count = 2 }
launch_config = { grid = [1, 1, 2], block = [32, 1, 1] }
