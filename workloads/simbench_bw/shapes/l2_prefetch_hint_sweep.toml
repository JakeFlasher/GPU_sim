schema_version = 1
slug = "l2_prefetch_hint_sweep"

# L2 prefetch-hint sweep microbench: each warp issues a
# `prefetch.global.L2 [addr]` PTX hint `prefetch_distance` slots
# ahead of each read in a sequential stream. The HRD-profiler
# criterion observes the resulting hit-rate distribution; sweeping
# the `prefetch_distance` axis exposes how the L2-prefetch hint
# changes effective latency. The prefetch hint is hardware-
# advisory and may legally be elided by the optimizer; the family
# covers the structural expression of the hint, not a guaranteed
# SASS marker. Reference is a seeded tensor of the same axis-
# product envelope.

[[timing_shapes]]
name = "timing_00"
axes = { accesses = 4096, prefetch_distance = 8, warps = 256 }
launch_config = { grid = [256, 1, 1], block = [32, 1, 1] }
warm_up_iters = 5
repeat_iters = 30

[[trace_shapes]]
name = "trace_00"
axes = { accesses = 256, prefetch_distance = 4, warps = 32 }
launch_config = { grid = [32, 1, 1], block = [32, 1, 1] }
predicted_bytes = 1310720
estimator_source = "static"

[[trace_shapes]]
name = "trace_l2_accuracy_xl"
axes = { accesses = 512, prefetch_distance = 4, warps = 16 }
launch_config = { grid = [64, 1, 1], block = [32, 1, 1] }
predicted_bytes = 20971520
estimator_source = "static"

[[correctness_shapes]]
name = "correctness_00"
axes = { accesses = 16, prefetch_distance = 2, warps = 4 }
launch_config = { grid = [4, 1, 1], block = [32, 1, 1] }
digest_kind = "hash"
