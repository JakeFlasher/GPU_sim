schema_version = 1
slug = "cluster_rmsnorm_dsmem_bf16"

# Cluster-wide RMSNorm via DSMEM: cluster members hold per-segment
# rows of a global activation; mean-square is reduced across cluster
# members through DSMEM atomic adds. Reference is a CPU RMSNorm
# operating on the rebuilt full-hidden rows.

[[timing_shapes]]
name = "timing_00"
axes = { cluster_size = 4, rows = 1024, hidden = 4096 }
launch_config = { grid = [4, 32, 1], block = [128, 1, 1] }
warm_up_iters = 5
repeat_iters = 30

[[trace_shapes]]
name = "trace_00"
axes = { cluster_size = 4, rows = 64, hidden = 256 }
launch_config = { grid = [4, 4, 1], block = [128, 1, 1] }
predicted_bytes = 10485760
estimator_source = "static"

[[correctness_shapes]]
name = "correctness_00"
axes = { cluster_size = 2, rows = 4, hidden = 16 }
launch_config = { grid = [2, 1, 1], block = [32, 1, 1] }
digest_kind = "full_tensor"
