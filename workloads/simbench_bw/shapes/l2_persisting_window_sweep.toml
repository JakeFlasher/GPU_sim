schema_version = 1
slug = "l2_persisting_window_sweep"

# L2 persisting-window sweep microbench: the host driver sets an
# L2 persistence access-policy window over the input allocation
# via `cudaStreamSetAttribute` + `cudaStreamAttributeAccessPolicyWindow`
# before launching the kernel. The `persisting_window_bytes` axis
# sweeps the requested window size; the runtime clips to the
# device's actual L2 persisting capacity. Reference is a seeded
# tensor of the same axis-product envelope; the persistence hint
# does not affect the kernel's deterministic output.

[[timing_shapes]]
name = "timing_00"
axes = { allocation_bytes = 33554432, persisting_window_bytes = 16777216, warps = 256 }
launch_config = { grid = [256, 1, 1], block = [32, 1, 1] }
warm_up_iters = 5
repeat_iters = 30

[[trace_shapes]]
name = "trace_00"
axes = { allocation_bytes = 1048576, persisting_window_bytes = 524288, warps = 32 }
launch_config = { grid = [32, 1, 1], block = [32, 1, 1] }
predicted_bytes = 5120
estimator_source = "static"

[[trace_shapes]]
name = "trace_l2_accuracy_xl"
axes = { allocation_bytes = 16777216, persisting_window_bytes = 8388608, warps = 256 }
launch_config = { grid = [256, 1, 1], block = [32, 1, 1] }
predicted_bytes = 40960
estimator_source = "static"

[[correctness_shapes]]
name = "correctness_00"
axes = { allocation_bytes = 4096, persisting_window_bytes = 1024, warps = 4 }
launch_config = { grid = [4, 1, 1], block = [32, 1, 1] }
digest_kind = "hash"
