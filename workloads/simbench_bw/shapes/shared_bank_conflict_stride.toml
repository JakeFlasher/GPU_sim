schema_version = 1
slug = "shared_bank_conflict_stride"

# Shared-memory bank-conflict microbench: each warp issues strided
# accesses against shared memory; `stride` controls the bank
# conflict factor. Reference is a seeded tensor of the same
# axis-product envelope.

[[timing_shapes]]
name = "timing_00"
axes = { rows = 4096, cols = 256, stride = 4 }
# This existing single-CTA shape exceeds current devices' per-block capacity;
# keep its failure in campaign accounting rather than silently shrinking it.
launch_config = { grid = [1, 1, 1], block = [32, 1, 1] }
warm_up_iters = 5
repeat_iters = 30

[[trace_shapes]]
name = "trace_00"
axes = { rows = 64, cols = 64, stride = 4 }
launch_config = { grid = [1, 1, 1], block = [32, 1, 1] }
predicted_bytes = 2621440
estimator_source = "static"

[[trace_shapes]]
name = "trace_l2_accuracy_xl"
axes = { rows = 32, cols = 16, stride = 4 }
launch_config = { grid = [1, 1, 1], block = [32, 1, 1] }
predicted_bytes = 327680
estimator_source = "static"

[[correctness_shapes]]
name = "correctness_00"
axes = { rows = 8, cols = 8, stride = 2 }
launch_config = { grid = [1, 1, 1], block = [32, 1, 1] }
digest_kind = "hash"
