schema_version = 1
slug = "ragged_attention_prefill_bf16"

# Launch geometry reflects the R16 kernel's actual wrapper:
#   grid  = (total_tokens, heads, 1)   # one block per (query_row, head)
#   block = (head_dim, 1, 1)           # one thread per output dim
# The kernel signature lives at
# `l2/ragged_attention_prefill_bf16/ragged_attention_prefill_bf16.cu::ragged_attention_prefill_bf16_launch`.
# R16 finishes task19 by making `num_seqs` a first-class axis that
# both the kernel and the references/attention.py segmented branch
# honor: cu_seqlens is derived as an even partition of total_tokens
# (first num_seqs%total_tokens segments get one extra token), and the
# kernel computes attention ONLY within each query's own segment.
# See the retained workload contract for the launch-config + num_seqs
# locks and the segmented-vs-contiguous reference-output invariance
# behavior required by the full-workload capture.
#
# The trace_00 axes were trimmed from the pre-Round-16 template so the
# axis_product with `num_seqs` added stays within the row's 384-MiB
# trace budget under the static `predict_bytes` estimator.

[[timing_shapes]]
name = "timing_00"
axes = { total_tokens = 16384, head_dim = 128, heads = 32, num_seqs = 8 }
launch_config = { grid = [16384, 32, 1], block = [128, 1, 1] }
warm_up_iters = 5
repeat_iters = 30

[[trace_shapes]]
name = "trace_00"
axes = { total_tokens = 16, head_dim = 64, heads = 1, num_seqs = 1 }
launch_config = { grid = [1024, 8, 1], block = [64, 1, 1] }
predicted_bytes = 335544320
estimator_source = "static"

[[correctness_shapes]]
name = "correctness_00"
axes = { total_tokens = 16, head_dim = 64, heads = 1, num_seqs = 1 }
launch_config = { grid = [1024, 8, 1], block = [64, 1, 1] }
digest_kind = "hash"
