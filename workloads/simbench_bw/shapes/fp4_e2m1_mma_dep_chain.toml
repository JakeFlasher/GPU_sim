schema_version = 1
slug = "fp4_e2m1_mma_dep_chain"

# FP4 (E2M1) dependent-MMA chain (sm_120a-only). Reference is the
# FP32 matmul on A and B after FP4 E2M1 round-trip quantization
# (`mma_microbench.py::build_reference` dispatches through
# `_quantize_matrix_fp4_e2m1`, which round-trips FP32 → FP4 E2M1
# code → FP32 representable per the kind::f8f6f4 .e2m1 byte layout
# centered at bits [5:2] with padding mask 0xC3, max ±6.0; R3
# added the dispatch, R4 fixed the central-bit byte placement),
# under the FP4 fma_chain tolerance band.

[[timing_shapes]]
name = "timing_00"
axes = { m = 1024, n = 1024, k = 4096 }
launch_config = { grid = [64, 128, 1], block = [32, 1, 1] }
warm_up_iters = 5
repeat_iters = 30

[[trace_shapes]]
name = "trace_00"
axes = { m = 32, n = 16, k = 64 }
launch_config = { grid = [2, 2, 1], block = [32, 1, 1] }
predicted_bytes = 5242880
estimator_source = "static"

[[correctness_shapes]]
name = "correctness_00"
axes = { m = 16, n = 16, k = 32 }
launch_config = { grid = [1, 2, 1], block = [32, 1, 1] }
digest_kind = "reduction_summary"
