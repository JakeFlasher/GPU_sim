schema_version = 1
slug = "flash_attn_bwd_bf16"

# Launch geometry reflects the R17 kernel's actual wrapper:
#   grid  = (seq, heads, batch)   # one block per (query_row, head, batch)
#   block = (head_dim, 1, 1)      # one thread per dQ[qi] dim
# The kernel signature lives at
# `l2/flash_attn_bwd_bf16/flash_attn_bwd_bf16.cu::flash_attn_bwd_bf16_launch`.
# Shipped shape-locked from day one — retained as a workload input contract.
#
# The row is deterministic="ND" (atomic_add reductions widen the
# tolerance band; verified via run_suite.py::_infer_reduction_kind).

[[timing_shapes]]
name = "timing_00"
axes = { batch = 1, seq = 4096, head_dim = 128, heads = 32 }
launch_config = { grid = [4096, 32, 1], block = [128, 1, 1] }
warm_up_iters = 5
repeat_iters = 30

[[trace_shapes]]
name = "trace_00"
axes = { batch = 1, seq = 16, head_dim = 64, heads = 1 }
launch_config = { grid = [1024, 8, 1], block = [64, 1, 1] }
predicted_bytes = 83886080
estimator_source = "static"

[[correctness_shapes]]
name = "correctness_00"
axes = { batch = 1, seq = 256, head_dim = 64, heads = 4 }
launch_config = { grid = [256, 4, 1], block = [64, 1, 1] }
digest_kind = "hash"
