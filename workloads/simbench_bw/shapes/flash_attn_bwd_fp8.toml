schema_version = 1
slug = "flash_attn_bwd_fp8"

# Flash attention backward in FP8. Same axis schema as the bf16
# backward variant — gradients are computed against the same Q/K/V
# layout. attention.py reuses the forward reference plus a softmax
# Jacobian path under the FP8 atomic_add tolerance band.

[[timing_shapes]]
name = "timing_00"
axes = { batch = 1, seq = 4096, head_dim = 128, heads = 32 }
launch_config = { grid = [4096, 32, 1], block = [128, 1, 1] }
warm_up_iters = 5
repeat_iters = 30

[[timing_shapes]]
name = "timing_01"
axes = { batch = 2, seq = 1024, head_dim = 64, heads = 16 }
launch_config = { grid = [1024, 16, 2], block = [64, 1, 1] }
warm_up_iters = 5
repeat_iters = 30

[[trace_shapes]]
name = "trace_00"
axes = { batch = 1, seq = 16, head_dim = 64, heads = 1 }
launch_config = { grid = [1024, 8, 1], block = [64, 1, 1] }
predicted_bytes = 83886080
estimator_source = "static"

[[correctness_shapes]]
name = "correctness_00"
axes = { batch = 1, seq = 64, head_dim = 32, heads = 4 }
launch_config = { grid = [64, 4, 1], block = [32, 1, 1] }
digest_kind = "hash"
