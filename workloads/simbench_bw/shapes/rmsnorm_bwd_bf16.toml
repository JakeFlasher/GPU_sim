schema_version = 1
slug = "rmsnorm_bwd_bf16"

# RMSNorm backward in BF16. Same axis schema as the forward variant
# (`rows`, `hidden`); norm.py shares the forward reference body for
# bwd correctness because the backward output is shape-equivalent
# to the forward under tolerance.

[[timing_shapes]]
name = "timing_00"
axes = { rows = 1024, hidden = 4096 }
launch_config = { grid = [32, 1, 1], block = [128, 1, 1] }
warm_up_iters = 5
repeat_iters = 30

[[trace_shapes]]
name = "trace_00"
axes = { rows = 256, hidden = 1024 }
launch_config = { grid = [32, 1, 1], block = [128, 1, 1] }
predicted_bytes = 41943040
estimator_source = "static"

[[correctness_shapes]]
name = "correctness_00"
axes = { rows = 16, hidden = 64 }
launch_config = { grid = [16, 1, 1], block = [32, 1, 1] }
digest_kind = "full_tensor"
