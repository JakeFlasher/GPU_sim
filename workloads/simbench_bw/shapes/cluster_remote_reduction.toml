schema_version = 1
slug = "cluster_remote_reduction"

# Launch geometry reflects the R11 cluster-launched kernel: one block
# per cluster member, `elements` threads per block, with a
# cudaLaunchAttributeClusterDimension = cluster_size cluster attribute.
# The kernel's kMaxElements=1024 ceiling covers all three modes below.

[[timing_shapes]]
name = "timing_00"
axes = { cluster_size = 4, tiles = 16, elements = 256 }
launch_config = { grid = [4, 1, 1], block = [256, 1, 1] }
warm_up_iters = 5
repeat_iters = 30

[[trace_shapes]]
name = "trace_00"
axes = { cluster_size = 4, tiles = 8, elements = 128 }
launch_config = { grid = [4, 1, 1], block = [128, 1, 1] }
predicted_bytes = 655360
estimator_source = "static"

[[correctness_shapes]]
name = "correctness_00"
axes = { cluster_size = 2, tiles = 4, elements = 64 }
launch_config = { grid = [2, 1, 1], block = [64, 1, 1] }
digest_kind = "reduction_summary"
