schema_version = 1
slug = "tma_tensor_copy_2d"

# Launch geometry reflects the R12 kernel's tiled TMA implementation:
# one block per 64x64 tile (the kernel's hardcoded TMA box size), 32 threads
# per block (only thread 0 issues the cp.async.bulk.tensor ops). Larger
# (rows, cols) surfaces are covered by growing the grid, not the block.

[[timing_shapes]]
name = "timing_00"
axes = { rows = 1024, cols = 1024 }
launch_config = { grid = [16, 16, 1], block = [32, 1, 1] }
warm_up_iters = 5
repeat_iters = 30

[[trace_shapes]]
name = "trace_00"
axes = { rows = 256, cols = 256 }
launch_config = { grid = [4, 4, 1], block = [32, 1, 1] }
predicted_bytes = 10485760
estimator_source = "static"

[[correctness_shapes]]
name = "correctness_00"
axes = { rows = 64, cols = 64 }
launch_config = { grid = [1, 1, 1], block = [32, 1, 1] }
digest_kind = "hash"
