schema_version = 1
slug = "nvfp4_grouped_gemm_moe"

# NVFP4 grouped-GEMM for MoE expert dispatch (sm_120a-only). Same
# axis schema as the BF16 / FP8 grouped-GEMM rows; grouped_gemm.py
# applies the same router-weighted permuted-tokens path with
# tighter NVFP4 tolerance bands.

[[timing_shapes]]
name = "timing_00"
axes = { tokens = 2048, experts = 64, hidden = 4096, intermediate = 11008, top_k = 2 }
launch_config = { grid = [2048, 1, 1], block = [256, 1, 1] }
warm_up_iters = 5
repeat_iters = 30

[[trace_shapes]]
name = "trace_00"
axes = { tokens = 64, experts = 4, hidden = 64, intermediate = 64, top_k = 2 }
launch_config = { grid = [64, 1, 1], block = [256, 1, 1] }
predicted_bytes = 335544320
estimator_source = "static"

[[correctness_shapes]]
name = "correctness_00"
axes = { tokens = 32, experts = 4, hidden = 256, intermediate = 512, top_k = 2 }
launch_config = { grid = [32, 1, 1], block = [256, 1, 1] }
digest_kind = "reduction_summary"
