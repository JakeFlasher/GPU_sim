schema_version = 1
slug = "vae_conv_gn_silu_residual_bf16"

# Launch geometry matches the conv-kernel wrapper in
# l3/vae_conv_gn_silu_residual_bf16/vae_conv_gn_silu_residual_bf16.cu
# (vae_conv_gn_silu_residual_bf16_launch):
#
#   grid  = (batch, channels, height, 1)   one block per (n, c_out, y)
#   block = (width, 1, 1)                  one thread per spatial-x output column
#
# That is the dominant kernel launch in the 3-kernel fused pipeline
# (conv -> gn-reduce -> gn+silu+residual); the two follow-up launches
# use grids derived internally (reduce: (batch, num_groups)).

[[timing_shapes]]
name = "timing_00"
axes = { batch = 2, channels = 128, height = 128, width = 128 }
launch_config = { grid = [2, 128, 128], block = [128, 1, 1] }
warm_up_iters = 5
repeat_iters = 30

[[trace_shapes]]
name = "trace_00"
axes = { batch = 1, channels = 64, height = 32, width = 32 }
launch_config = { grid = [1, 64, 32], block = [32, 1, 1] }
predicted_bytes = 10485760
estimator_source = "static"

[[correctness_shapes]]
name = "correctness_00"
axes = { batch = 1, channels = 32, height = 16, width = 16 }
