schema_version = 1
slug = "clip_text_image_cross_attn_bf16"

# CLIP-style text-image cross-attention. Q is derived from text tokens
# [batch, heads, seq_text, head_dim]; K/V from image tokens
# [batch, heads, seq_image, head_dim]. Output is [batch, heads, seq_text,
# head_dim]. trace_budget_mib = 768.
#
# Timing shapes follow CLIP ViT-B/16 conventions: seq_text = 77 text
# positions, seq_image = 49 image patches (7x7 grid). Trace shapes are
# sized down so the static predictor's axis-product stays within budget.

[[timing_shapes]]
name = "timing_00"
axes = { batch = 32, heads = 12, seq_text = 77, seq_image = 49, head_dim = 64 }
launch_config = { grid = [32, 12, 1], block = [128, 1, 1] }
warm_up_iters = 5
repeat_iters = 30

[[timing_shapes]]
name = "timing_01"
axes = { batch = 16, heads = 16, seq_text = 77, seq_image = 197, head_dim = 64 }
launch_config = { grid = [16, 16, 1], block = [128, 1, 1] }
warm_up_iters = 5
repeat_iters = 30

[[trace_shapes]]
name = "trace_00"
axes = { batch = 2, heads = 4, seq_text = 16, seq_image = 32, head_dim = 64 }
launch_config = { grid = [2, 4, 1], block = [128, 1, 1] }
predicted_bytes = 41943040
estimator_source = "static"

[[correctness_shapes]]
name = "correctness_00"
axes = { batch = 2, heads = 2, seq_text = 3, seq_image = 4, head_dim = 4 }
launch_config = { grid = [2, 2, 1], block = [32, 1, 1] }
digest_kind = "full_tensor"
