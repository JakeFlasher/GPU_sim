schema_version = 1
slug = "cp_async_shared_tile_copy"

# cp.async shared-tile copy: each CTA copies a tile of (rows, cols)
# bytes from global memory into shared memory via cp.async. The TMA
# family reference is an identity copy.

[[timing_shapes]]
name = "timing_00"
axes = { rows = 1024, cols = 1024 }
launch_config = { grid = [16, 16, 1], block = [128, 1, 1] }
warm_up_iters = 5
repeat_iters = 30

[[trace_shapes]]
name = "trace_00"
axes = { rows = 256, cols = 256 }
launch_config = { grid = [4, 4, 1], block = [64, 1, 1] }
predicted_bytes = 10485760
estimator_source = "static"

[[trace_shapes]]
name = "trace_l2_accuracy_xl"
axes = { rows = 64, cols = 64 }
launch_config = { grid = [1, 1, 1], block = [128, 1, 1] }
