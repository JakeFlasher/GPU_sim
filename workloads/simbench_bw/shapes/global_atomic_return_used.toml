schema_version = 1
slug = "global_atomic_return_used"

# Atomic-with-return (ATOM) partner of global_atomic_histogram: same global
# atomicAdd traffic, but the returned old value is USED so the compiler emits
# the ATOM SASS form (vs the RED reduction form the return-ignored sibling
# emits). Same axis-product envelope + identity-round-trip reference as the
# sibling.
#
# launch_config is AUTHORITATIVE here: it records the geometry the binary's
# launcher actually uses (global_atomic_return_used_launch hardcodes
# grid=(1,1,1) / block=(32,1,1) and strides the axis-product loops over the
# 32-lane block), so every shape's launch_config = grid (1,1,1) / block
# (32,1,1). The kernel_signature for live admission is derived from the live
# trace, but the descriptive geometry here must not contradict the real launch
# (BL-20260531-static-sass-signature-is-launch-config-input-not-sass-derived).

[[timing_shapes]]
name = "timing_00"
axes = { samples = 1048576, bins = 1024 }
launch_config = { grid = [1, 1, 1], block = [32, 1, 1] }
warm_up_iters = 5
repeat_iters = 30

[[trace_shapes]]
name = "trace_00"
axes = { samples = 1024, bins = 64 }
launch_config = { grid = [1, 1, 1], block = [32, 1, 1] }
predicted_bytes = 10485760
estimator_source = "static"

[[trace_shapes]]
name = "trace_l2_accuracy_xl"
axes = { samples = 1024, bins = 32 }
launch_config = { grid = [1, 1, 1], block = [32, 1, 1] }
predicted_bytes = 5242880
estimator_source = "static"

[[correctness_shapes]]
name = "correctness_00"
axes = { samples = 32, bins = 8 }
launch_config = { grid = [1, 1, 1], block = [32, 1, 1] }
digest_kind = "hash"
