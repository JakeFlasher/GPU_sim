schema_version = 1
slug = "fp8_e5m2_saturation"

# FP8 (E5M2) saturation microbench. Reference is the FP32 matmul on
# A and B after FP8 E5M2 round-trip quantization
# (`mma_microbench.py::build_reference` dispatches through
# `_quantize_matrix_fp8_e5m2`, which round-trips FP32 → FP8 E5M2
# code → FP32 representable per the canonical 256-entry IEEE-style
# binary8 value table with satfinite saturation to ±57344 max finite;
# special values match `cuda_fp8.h::__nv_fp8_e5m2` byte-for-byte per
# R26/27 alignment: NaN inputs encode as 0x7F (canonical positive
# E5M2 NaN) and decode back to NaN; -0.0 inputs encode as 0x80 (sign
# preserved) and decode back to -0.0; ±Inf inputs satfinite-clamp to
# ±57344 (bytes 0x7B/0xFB). The encoder never produces the 2 Inf
# encodings (0x7C/0xFC) or the other 5 NaN encodings (0x7D, 0x7E,
# 0xFD-0xFF); those bytes remain valid decode targets. R20
# added the elif branch for this row; R26 aligned the special-
# value behavior with cuda_fp8.h.), under the FP8_E5M2 fma_chain
# tolerance.

[[timing_shapes]]
name = "timing_00"
axes = { m = 1024, n = 1024, k = 4096 }
launch_config = { grid = [64, 128, 1], block = [32, 1, 1] }
warm_up_iters = 5
repeat_iters = 30

[[trace_shapes]]
name = "trace_00"
axes = { m = 32, n = 16, k = 64 }
launch_config = { grid = [2, 2, 1], block = [32, 1, 1] }
predicted_bytes = 5242880
estimator_source = "static"

[[correctness_shapes]]
name = "correctness_00"
axes = { m = 16, n = 16, k = 32 }
launch_config = { grid = [1, 2, 1], block = [32, 1, 1] }
digest_kind = "reduction_summary"
