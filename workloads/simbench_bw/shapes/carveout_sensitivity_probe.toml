schema_version = 1
slug = "carveout_sensitivity_probe"

# Carveout-sensitivity microbench: the host driver sets the
# per-kernel preferred shared-memory carveout split via
# `cudaFuncSetAttribute` +
# `cudaFuncAttributePreferredSharedMemoryCarveout` before launch.
# The `carveout_percent` axis sweeps the requested split across
# multiple shape points (25 / 50 / 75 percent) so the
# HRD-profiler criterion can observe how the L1/shared partition
# ratio shifts the effective hit-rate distribution. The runtime
# clips to the device's supported partition points (typically
# 0/25/50/75/100 percent on most architectures). Reference is
# the same deterministic-seeded identity round-trip the peer
# microbenches use; the carveout preference does not affect the
# kernel's identity output. The kernel reads from BOTH a
# multi-KiB carveout-bounded shared tile AND the global
# allocation, so the partition split is observable in the
# resulting L1 / shared traffic.

[[timing_shapes]]
name = "timing_25"
axes = { allocation_bytes = 33554432, shared_bytes = 16384, carveout_percent = 25, accesses = 4096, warps = 256 }
launch_config = { grid = [256, 1, 1], block = [32, 1, 1] }
warm_up_iters = 5
repeat_iters = 30

