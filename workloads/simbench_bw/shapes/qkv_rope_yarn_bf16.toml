schema_version = 1
slug = "qkv_rope_yarn_bf16"

# YaRN-scaled RoPE (extended-context variant). Same axis schema as
# standard RoPE; rope.py reads the optional `yarn_scale` axis and
# divides each frequency by it. Default yarn_scale = 4.0.

[[timing_shapes]]
name = "timing_00"
axes = { tokens = 4096, head_dim = 128, heads = 32, yarn_scale = 4 }
launch_config = { grid = [64, 4, 1], block = [128, 1, 1] }
warm_up_iters = 5
repeat_iters = 30

[[trace_shapes]]
name = "trace_00"
axes = { tokens = 256, head_dim = 64, heads = 16, yarn_scale = 4 }
launch_config = { grid = [64, 4, 1], block = [128, 1, 1] }
predicted_bytes = 167772160
estimator_source = "static"

[[correctness_shapes]]
name = "correctness_00"
axes = { tokens = 64, head_dim = 32, heads = 4, yarn_scale = 4 }
launch_config = { grid = [4, 1, 1], block = [32, 1, 1] }
digest_kind = "hash"
