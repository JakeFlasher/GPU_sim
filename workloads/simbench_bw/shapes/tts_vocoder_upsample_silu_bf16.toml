schema_version = 1
slug = "tts_vocoder_upsample_silu_bf16"

# TTS vocoder upsample: nearest-neighbor upsample by `upsample_factor`
# followed by SiLU. Output is [batch, channels, length * upsample_factor]
# with each input position replicated UF times then activated.
# trace_budget_mib = 512.

[[timing_shapes]]
name = "timing_00"
axes = { batch = 8, channels = 80, length = 1024, upsample_factor = 4 }
launch_config = { grid = [8, 80, 1], block = [128, 1, 1] }
warm_up_iters = 5
repeat_iters = 30

[[timing_shapes]]
name = "timing_01"
axes = { batch = 4, channels = 160, length = 512, upsample_factor = 8 }
launch_config = { grid = [4, 160, 1], block = [128, 1, 1] }
warm_up_iters = 5
repeat_iters = 30

[[trace_shapes]]
name = "trace_00"
axes = { batch = 4, channels = 16, length = 32, upsample_factor = 2 }
launch_config = { grid = [4, 16, 1], block = [64, 1, 1] }
predicted_bytes = 655360
estimator_source = "static"

[[correctness_shapes]]
name = "correctness_00"
axes = { batch = 2, channels = 4, length = 8, upsample_factor = 2 }
launch_config = { grid = [2, 4, 1], block = [32, 1, 1] }
digest_kind = "full_tensor"
