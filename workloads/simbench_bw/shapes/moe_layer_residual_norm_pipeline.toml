schema_version = 1
slug = "moe_layer_residual_norm_pipeline"

# L4 pipeline: MoE router + permuted grouped-GEMM + combine + residual
# + RMSNorm. The reference is at references/grouped_gemm.py. Residual
# add requires hidden == intermediate for this slug; the reference
# refuses with a clear ValueError otherwise. Canonical checkpoint is
# emitted at the router-to-grouped-gemm boundary per
# schemas/l4_checkpoints/moe_layer_residual_norm_pipeline.schema.json.
# trace_budget_mib = 1024.

[[timing_shapes]]
name = "timing_00"
axes = { tokens = 2048, experts = 32, top_k = 2, hidden = 1024, intermediate = 1024 }
launch_config = { grid = [64, 4, 1], block = [128, 1, 1] }
warm_up_iters = 5
repeat_iters = 30

[[timing_shapes]]
name = "timing_01"
axes = { tokens = 1024, experts = 16, top_k = 4, hidden = 2048, intermediate = 2048 }
launch_config = { grid = [32, 4, 1], block = [128, 1, 1] }
warm_up_iters = 5
repeat_iters = 30

[[trace_shapes]]
name = "trace_00"
axes = { tokens = 64, experts = 8, top_k = 2, hidden = 32, intermediate = 32 }
launch_config = { grid = [8, 4, 1], block = [64, 1, 1] }
predicted_bytes = 167772160
estimator_source = "static"

[[correctness_shapes]]
name = "correctness_00"
axes = { tokens = 16, experts = 4, top_k = 2, hidden = 32, intermediate = 32 }
launch_config = { grid = [4, 1, 1], block = [32, 1, 1] }
digest_kind = "full_tensor"
