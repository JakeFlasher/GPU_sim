schema_version = 1
slug = "flash_attn_fwd_bf16_causal"

# Launch geometry reflects the R15 kernel's actual wrapper:
#   grid  = (seq, heads, batch)   # one block per (query_row, head, batch)
#   block = (head_dim, 1, 1)      # one thread per output dim
# The kernel signature lives at
# `l2/flash_attn_fwd_bf16_causal/flash_attn_fwd_bf16_causal.cu::flash_attn_fwd_bf16_causal_launch`.
# R16 restored shape-contract alignment after R15 shipped a
# template launch_config; see tests/test_round16_repairs.py for the lock.

[[timing_shapes]]
name = "timing_00"
axes = { batch = 1, seq = 4096, head_dim = 128, heads = 32 }
launch_config = { grid = [4096, 32, 1], block = [128, 1, 1] }
warm_up_iters = 5
repeat_iters = 30

[[timing_shapes]]
name = "timing_01"
axes = { batch = 2, seq = 1024, head_dim = 64, heads = 16 }
launch_config = { grid = [1024, 16, 2], block = [64, 1, 1] }
warm_up_iters = 5
repeat_iters = 30

[[trace_shapes]]
name = "trace_00"
axes = { batch = 1, seq = 16, head_dim = 64, heads = 1 }
launch_config = { grid = [1024, 8, 1], block = [64, 1, 1] }
predicted_bytes = 83886080
estimator_source = "static"

[[correctness_shapes]]
name = "correctness_00"
