schema_version = 1
slug = "l2_thrash_pointer_chase"

# L2 cache pointer-chase microbench: each warp follows a long
# dependent-load chain, exceeding L2 capacity to drive L2 miss rate.
# Reference is a seeded tensor of the same axis-product envelope.

[[timing_shapes]]
name = "timing_00"
axes = { chain_length = 4096, warps = 256 }
launch_config = { grid = [256, 1, 1], block = [128, 1, 1] }
warm_up_iters = 5
repeat_iters = 30

[[trace_shapes]]
name = "trace_00"
axes = { chain_length = 256, warps = 32 }
launch_config = { grid = [32, 1, 1], block = [128, 1, 1] }
predicted_bytes = 1310720
estimator_source = "static"

[[trace_shapes]]
name = "trace_l2_accuracy_xl"
axes = { chain_length = 512, warps = 16 }
launch_config = { grid = [64, 1, 1], block = [128, 1, 1] }
