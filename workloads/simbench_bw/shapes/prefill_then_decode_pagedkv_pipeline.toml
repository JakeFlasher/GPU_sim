schema_version = 1
slug = "prefill_then_decode_pagedkv_pipeline"

# L4 pipeline: prefill phase populates a paged KV cache, decode phase
# reads from it. References at
# `references/paged_attention.py::build_reference` (single-token decode
# output) +
# `references/paged_attention.py::build_l4_checkpoint` (canonical
# router-to-decode KV-boundary dict per
# `schemas/l4_checkpoints/prefill_then_decode_pagedkv_pipeline.schema.json`).
# trace_budget_mib = 1024.
#
# block_size = 16 is the standard paged-KV page size (FlashInfer /
# vLLM convention). head_dim must be even for RoPE.

[[timing_shapes]]
name = "timing_00"
axes = { batch = 32, context = 2048, head_dim = 128, q_heads = 16, kv_heads = 4, block_size = 16 }
launch_config = { grid = [32, 16, 1], block = [128, 1, 1] }
warm_up_iters = 5
repeat_iters = 30

[[timing_shapes]]
name = "timing_01"
axes = { batch = 16, context = 4096, head_dim = 128, q_heads = 32, kv_heads = 8, block_size = 16 }
launch_config = { grid = [16, 32, 1], block = [128, 1, 1] }
warm_up_iters = 5
repeat_iters = 30

[[trace_shapes]]
name = "trace_00"
axes = { batch = 4, context = 64, head_dim = 32, q_heads = 4, kv_heads = 2, block_size = 16 }
launch_config = { grid = [4, 4, 1], block = [128, 1, 1] }
predicted_bytes = 167772160
estimator_source = "static"

[[correctness_shapes]]
name = "correctness_00"
axes = { batch = 2, context = 32, head_dim = 32, q_heads = 4, kv_heads = 2, block_size = 16 }
launch_config = { grid = [2, 4, 1], block = [32, 1, 1] }
digest_kind = "full_tensor"
