# portable_lcd suite roster — all 15 LCD-portable kernels.
#
# Each row carries the fields the standalone subtree contract verifier
# (`workloads/portable_lcd/verify_kernel_contracts.py`) reads to drive
# per-row checks: build artifact path, manifest path, trace dir, and
# the per-row shape names the runner exposes.
#
# Status semantics:
#   active   — slug directory exists with a built `<slug>_run` binary;
#              contract verifier checks fatbin slices, NVBit trace,
#              suite SASS coverage, and manifest schema validity for
#              this row.
#   pending  — slug directory does not yet exist; contract verifier
#              skips this row and reports it as "pending".
#
# Tier "P" denotes LCD-portable: build slices target the BASE archs
# `sm_86`, `sm_90`, `sm_120` plus a `compute_80` PTX fallback. The
# architecture-conditional variants (sm_90a / sm_120a / sm_120f) are
# forbidden as build targets per the LCD discipline.

schema_version = 1

