# Relevance gate evaluation suites — INDEPENDENT of skill routing.
#
# Each entry has a `prompt` and `expect: true|false`. The test harness
# (scripts/kb/run_relevance_evals.py) classifies the prompt with
# is_kb_relevant() from _relevance.py and reports pass/fail per category.
#
# Goal: prove the Group A / Group B+C / CODENAME_FP gate behaves
# correctly across realistic prompt distributions, including the long
# tail of false-positive collisions and false-negative misses that the
# skill-routing eval (run_evals.py) cannot exercise (because run_evals.py
# only tests prompts that PASS the gate).

# ---------------------------------------------------------------------------
# Positive suite — prompts that SHOULD pass the gate (KB-relevant).
# Failure indicates a false negative in the gate (real GPU/CUDA prompts
# the agent would silently miss).
# ---------------------------------------------------------------------------
positive:
  # Group A — single-token mnemonics, fires alone
  - prompt: "wgmma instruction encoding"
    expect: true
  - prompt: "cp.async semantics for cluster shared memory"
    expect: true
  - prompt: "tcgen05.mma latency on Blackwell"
    expect: true
  - prompt: "shfl.sync semantics for non-power-of-2 thread groups"
    expect: true
  - prompt: "atomicCAS with memory_order_release in CUDA"
    expect: true
  - prompt: "ERR_NVGPUCTRPERM in cloud container"
    expect: true
  - prompt: "ldmatrix and stmatrix layout"
    expect: true
  - prompt: "FP4 block-scaled MMA on sm_120a"
    expect: true
  - prompt: "decode UTCCP in this SASS dump"
    expect: true
  - prompt: "wall-clock-primary measurement contract"
    expect: true

  # Group B+C — codename + GPU context
  - prompt: "Hopper architecture warp scheduler details"
    expect: true
  - prompt: "what changed in Pascal compared to Maxwell on the GPU side"
    expect: true
  - prompt: "Volta rewrite split the matrix path"
    expect: true
  - prompt: "Ampere tensor core differences from Turing"
    expect: true
  - prompt: "Blackwell GPU feature surface vs Hopper"
    expect: true

  # Compound technical prompts
  - prompt: "compare cp.async vs ldmatrix vs tcgen05.cp for tensor-core data supply"
    expect: true
  - prompt: "shared memory bank conflict in my warp-cooperative reduction"
    expect: true
  - prompt: "cluster.sync placement before DSMEM peer reads"
    expect: true
  - prompt: "what does cuobjdump --dump-sass output for sm_120"
    expect: true
  - prompt: "register pressure debugging via -Xptxas -v"
    expect: true

  # Meta-router intents
  - prompt: "list the available specialty skills in this repo"
    expect: true
  - prompt: "give me an overview of the project knowledge base structure"
    expect: true
  - prompt: "which card explains tcgen05 ownership"
    expect: true
  - prompt: "I have a specific question and want the shortest path to the right card"
    expect: true

  # Architectural-history prompts
  - prompt: "explain the three-rewrites thesis"
    expect: true
  - prompt: "did Microsoft or Intel patent something similar to TMEM"
    expect: true
  - prompt: "how did NVLink evolve from Volta to Hopper"
    expect: true

  # Simulator design
  - prompt: "design event-driven SM timing model in Rust"
    expect: true
  - prompt: "what objects must I model in a Blackwell simulator"
    expect: true

  # Compilation
  - prompt: "write a -gencode flag for sm_120 with PTX fallback"
    expect: true
  - prompt: "extract PTX from a fatbin"
    expect: true

  # SOL-ExecBench and SOLAR routing anchors
  - prompt: "I want to start problem_004_gemm_n128_k2048"
    expect: true
  - prompt: "GEMM N=128 K=2048 baseline for B200"
    expect: true
  - prompt: "RoPE attention with KV sharing"
    expect: true
  - prompt: "FP8 MoE dispatch backward"
    expect: true
  - prompt: "block-scaled FP8 quantization for B200"
    expect: true
  - prompt: "fused add and RMSNorm for hidden_size 2048"
    expect: true
  - prompt: "GQA paged decode kernel for FlashInfer"
    expect: true
  - prompt: "implement an NVFP4 expert linear projection"
    expect: true
  - prompt: "what does SOLAR derive for B200?"
    expect: true
  - prompt: "SOLAR T_SOL deriver einsum pipeline"
    expect: true
  - prompt: "Orojenesis refinement in SOLAR analysis"
    expect: true
  - prompt: "the SOL-ExecBench eval-harness command line"
    expect: true

