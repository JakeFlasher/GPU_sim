# cases the gate handles deliberately. Failure here is not a regression;
# the test harness reports them as "known".
# ---------------------------------------------------------------------------
known_edge:
  # `\bsass\b` in Group A is an accepted trade-off (recall on "decode this
  # sass" wins over the rare FP). This entry documents it so the test
  # harness can flag it without scoring as failure.
  - prompt: "sass talk to your boss"
    expect: false  # reported as KNOWN-FP, not FAIL
    note: "accepted Group-A trade-off; recall on 'decode this sass' beats this rare FP"
